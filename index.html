<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lern-App für Windows CMD, PowerShell und Active Directory - Konzepte, Befehle und ihre Zusammenhänge.">
<meta name="theme-color" content="#06121a">
<title>Konsole &amp; Verzeichnis – CMD, PowerShell, Active Directory</title>
<style>
:root{
  --bg:#06121a;
  --bg-deep:#040c12;
  --panel:#0c1c26;
  --panel-2:#102530;
  --line:#1b3a48;
  --line-soft:#153040;
  --ink:#d8e8ef;
  --ink-dim:#8aa8b6;
  --ink-faint:#5f7d8c;

  --teal:#2dd4bf;
  --emerald:#34d399;
  --ps:#6ea8fe;
  --ps-deep:#1e5fa8;
  --cmd:#c6d4dc;
  --ad:#2dd4bf;
  --amber:#f0b429;
  --rose:#f87171;

  --mono:"Cascadia Mono","Consolas","SF Mono","DejaVu Sans Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;

  --r:10px;
  --shell-w:280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 620px at 78% -12%,rgba(45,212,191,.10),transparent 62%),
             radial-gradient(760px 480px at 4% 104%,rgba(110,168,254,.08),transparent 60%);
}
a{color:var(--teal)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.55rem;margin-top:0}
h3{font-size:1.12rem;margin-top:2rem;color:#eaf5f9}
h4{font-size:.98rem;margin-top:1.4rem;color:var(--teal);font-weight:600}
p{margin:0 0 1rem}
ul,ol{margin:0 0 1rem;padding-left:1.25rem}
li{margin-bottom:.4rem}
code{font-family:var(--mono);font-size:.88em;background:#0a1f2a;border:1px solid var(--line-soft);
  border-radius:5px;padding:.1em .38em;color:#a9e9dd;white-space:nowrap}
strong{color:#f0fafd;font-weight:600}

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem .8rem;
  padding-top:calc(.55rem + env(safe-area-inset-top));
  background:rgba(4,12,18,.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:600;font-size:.98rem;letter-spacing:-.01em;min-width:0}
.brand .caret{font-family:var(--mono);color:var(--teal);flex:0 0 auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:9px;font-size:1.05rem;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--teal);color:var(--teal)}
.spacer{flex:1}
.progress-mini{display:flex;align-items:center;gap:.45rem;font-size:.74rem;color:var(--ink-faint);font-family:var(--mono)}
.progress-mini .track{width:56px;height:5px;border-radius:3px;background:#0e2836;overflow:hidden}
.progress-mini .fill{height:100%;background:linear-gradient(90deg,var(--ps),var(--teal));width:0%}

/* ---------- Navigation ---------- */
.shell{display:flex}
nav.side{
  width:var(--shell-w);flex:0 0 var(--shell-w);
  position:sticky;top:53px;align-self:flex-start;z-index:2;
  height:calc(100vh - 53px);overflow-y:auto;
  border-right:1px solid var(--line);
  padding:1rem .6rem 3rem;
  background:var(--bg-deep);
}
nav.side .navgroup{font-size:.68rem;letter-spacing:.09em;color:var(--ink-faint);
  font-family:var(--mono);margin:1.3rem .6rem .45rem;text-transform:uppercase}
nav.side .navgroup:first-child{margin-top:0}
.navitem{
  display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
  background:none;border:0;border-left:2px solid transparent;
  color:var(--ink-dim);font:inherit;font-size:.9rem;
  padding:.46rem .6rem;border-radius:0 7px 7px 0;cursor:pointer;
}
.navitem:hover{background:#0d2029;color:var(--ink)}
.navitem.active{background:#0f2a36;color:#eafcf8;border-left-color:var(--teal)}
.navitem .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#22414f}
.navitem.done .dot{background:var(--emerald);box-shadow:0 0 7px rgba(52,211,153,.55)}
.navitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Inhalt ---------- */
main{flex:1;min-width:0;padding:1.6rem 1.5rem 6rem;max-width:900px;position:relative;z-index:1}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:.74rem;color:var(--ink-faint);margin-bottom:.35rem}
.lede{color:var(--ink-dim);font-size:1.02rem;border-left:2px solid var(--line);padding-left:.9rem;margin-bottom:1.8rem}

/* ---------- Bausteine ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin:1.1rem 0}
.card.tight{padding:.75rem .9rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin:1.1rem 0}

.term{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r);
  margin:1rem 0;overflow:hidden;
}
.term-head{
  display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;
  background:var(--panel-2);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
}
.term-head .tag{padding:.05rem .4rem;border-radius:4px;font-size:.66rem;letter-spacing:.04em}
.tag.t-cmd{background:#243139;color:var(--cmd)}
.tag.t-ps{background:#122a4a;color:var(--ps)}
.tag.t-ad{background:#0d3b39;color:var(--ad)}
.term pre{
  margin:0;padding:.8rem .85rem;overflow-x:auto;
  font-family:var(--mono);font-size:.83rem;line-height:1.7;color:#cfe7ef;
  -webkit-overflow-scrolling:touch;
}
.term pre .c{color:var(--ink-faint)}
.term pre .p{color:var(--emerald)}
.term pre .o{color:var(--amber)}
.term pre .s{color:#e79ad8}
.copy{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink-faint);
  border-radius:5px;font-size:.66rem;font-family:var(--mono);padding:.1rem .4rem;cursor:pointer}
.copy:hover{color:var(--teal);border-color:var(--teal)}

.note{border-left:3px solid var(--teal);background:#0b2129;padding:.75rem .9rem;border-radius:0 8px 8px 0;margin:1.1rem 0;font-size:.94rem}
.note.warn{border-left-color:var(--amber);background:#231c0c}
.note.stop{border-left-color:var(--rose);background:#241214}
.note b{display:block;margin-bottom:.2rem;color:#eafcf8}

.tblwrap{overflow-x:auto;margin:1.1rem 0;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:480px}
th{background:var(--panel-2);text-align:left;padding:.55rem .7rem;font-weight:600;color:#eafcf8;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:.82rem}
td{padding:.55rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-dim)}
tr:last-child td{border-bottom:0}
td code{white-space:normal}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0}
.chip{
  background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:20px;padding:.28rem .75rem;font-size:.8rem;cursor:pointer;font:inherit;font-size:.8rem;
}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip.on{background:#0f3038;border-color:var(--teal);color:#a9f0e4}

/* ---------- Befehlssuche ---------- */
.searchbar{display:flex;gap:.5rem;margin:1rem 0;position:sticky;top:53px;z-index:20;
  background:var(--bg);padding:.6rem 0}
.searchbar input{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font:inherit;font-size:.95rem;padding:.6rem .8rem;font-family:var(--mono);
}
.searchbar input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.cmdrow{
  border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  background:var(--panel);margin-bottom:.55rem;overflow:hidden;
}
.cmdrow.s-cmd{border-left-color:#6e8493}
.cmdrow.s-ps{border-left-color:var(--ps)}
.cmdrow.s-ad{border-left-color:var(--ad)}
.cmdrow > button{
  width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;
  padding:.6rem .8rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline;
}
.cmdrow > button:hover{background:var(--panel-2)}
.cmdrow .name{font-family:var(--mono);font-size:.88rem;color:#a9e9dd;flex:0 0 auto}
.cmdrow.s-ps .name{color:#a8c9ff}
.cmdrow.s-cmd .name{color:#dbe6ec}
.cmdrow .short{font-size:.83rem;color:var(--ink-faint);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdrow .body{display:none;padding:0 .8rem .8rem;font-size:.89rem;border-top:1px solid var(--line-soft)}
.cmdrow.open .body{display:block}
.cmdrow .body p{margin:.7rem 0 .5rem;color:var(--ink-dim)}
.cmdrow .body .ex{font-family:var(--mono);font-size:.8rem;background:var(--bg-deep);
  border:1px solid var(--line-soft);border-radius:7px;padding:.5rem .6rem;overflow-x:auto;white-space:pre;color:#cfe7ef}
.cmdrow .body .rel{font-size:.78rem;color:var(--ink-faint);margin-top:.5rem}
.counter{font-family:var(--mono);font-size:.78rem;color:var(--ink-faint);margin:.4rem 0 .8rem}
.catline{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
  margin:1.4rem 0 .5rem;border-bottom:1px solid var(--line-soft);padding-bottom:.25rem}

/* ---------- Cmdlet-Katalog ---------- */
.selwrap{margin:0 0 .3rem}
.selwrap select{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font:inherit;font-size:.9rem;padding:.55rem .7rem;font-family:var(--mono);
}
.cmdlet{display:flex;gap:.7rem;align-items:baseline;padding:.42rem .2rem;border-bottom:1px solid var(--line-soft)}
.cmdlet:last-child{border-bottom:0}
.cmdlet .cn{font-family:var(--mono);font-size:.84rem;color:#a8c9ff;flex:0 0 auto}
.cmdlet .cd{font-size:.85rem;color:var(--ink-dim);flex:1;min-width:0}
@media(max-width:620px){
  .cmdlet{display:block;padding:.5rem .2rem}
  .cmdlet .cn{display:block}
  .cmdlet .cd{display:block;margin-top:.15rem}
}

/* ---------- Skript-Generator ---------- */
.genstep{display:flex;align-items:center;gap:.5rem;margin:1.7rem 0 .6rem;
  font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-family:var(--mono)}
.gnum{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:#0f3038;color:var(--teal);font-size:.7rem;flex:0 0 auto}
.genzweck{font-size:.88rem;color:var(--ink-dim);border-left:2px solid var(--line);padding-left:.75rem;margin:.5rem 0 0}
.genfeld{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;flex-wrap:wrap}
.genfeld label{font-size:.83rem;color:var(--ink-dim);flex:0 0 190px}
.genfeld input[type=text],.genfeld input[type=number],.genfeld select{
  flex:1;min-width:150px;background:var(--bg-deep);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font-family:var(--mono);font-size:.83rem;padding:.42rem .55rem}
.genfeld input:focus,.genfeld select:focus{outline:2px solid var(--teal);outline-offset:1px}
.genfeld .gvar{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);flex:0 0 auto}
.genfeld.schalter{margin:.2rem 0 .6rem}
.genschalter,.genopt{display:flex;align-items:center;gap:.45rem;font-size:.83rem;color:var(--ink-dim);cursor:pointer}
.genschalter input,.genopt input{accent-color:var(--teal);width:16px;height:16px}
.genopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:.4rem .8rem}
.genbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0 0}
.genblock{display:flex;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line-soft);font-size:.86rem;color:var(--ink-dim)}
.genblock:last-child{border-bottom:0}
.genblock .bnum{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#12242e;
  color:var(--ink-faint);font-family:var(--mono);font-size:.68rem;display:flex;align-items:center;justify-content:center}
.genblock b{display:block;color:#eafcf8;font-family:var(--mono);font-size:.8rem;margin-bottom:.15rem;font-weight:500}
@media(max-width:620px){
  .genfeld{display:block}
  .genfeld label{display:block;margin-bottom:.2rem}
  .genfeld input[type=text],.genfeld input[type=number],.genfeld select{width:100%}
  .genfeld .gvar{display:none}
}

/* ---------- Baukasten ---------- */
.gentabs{display:flex;gap:.4rem;margin:.9rem 0 0}
.gentab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
  font:inherit;font-size:.86rem;padding:.5rem .6rem;border-radius:9px;cursor:pointer}
.gentab.on{background:#0f3038;border-color:var(--teal);color:#a9f0e4;font-weight:500}
.bauhilfe{font-size:.83rem;color:var(--ink-dim);background:#0b2129;border-left:3px solid var(--teal);
  padding:.6rem .75rem;border-radius:0 8px 8px 0;margin:.2rem 0 .8rem}
.bauleer{font-size:.85rem;color:var(--ink-faint);border:1px dashed var(--line);
  border-radius:9px;padding:.8rem;text-align:center}
.baurow{display:flex;align-items:center;gap:.5rem;background:var(--panel);border:1px solid var(--line);
  border-left-width:3px;border-radius:8px;padding:.45rem .55rem;margin-bottom:.4rem}
.baurow.t-quelle {border-left-color:#6ea8fe}
.baurow.t-schritt{border-left-color:var(--teal)}
.baurow.t-aktion {border-left-color:var(--amber)}
.baurow.t-ausgabe{border-left-color:var(--emerald)}
.bnr{width:20px;height:20px;border-radius:50%;background:#12242e;color:var(--ink-faint);
  font-family:var(--mono);font-size:.68rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.btxt{flex:1;min-width:0}
.btxt b{display:block;font-size:.86rem;color:#eafcf8;font-weight:500}
.btxt span{display:block;font-size:.76rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbtn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:6px;
  width:28px;height:28px;font-size:.8rem;cursor:pointer;flex:0 0 auto}
.bbtn:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.bbtn:disabled{opacity:.3;cursor:default}
.bbtn.weg:hover{border-color:var(--rose);color:var(--rose)}
.baugruppe{margin-top:1rem}
.bautitel{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);margin-bottom:.4rem}
.baucard{display:block;width:100%;text-align:left;background:var(--bg-deep);border:1px solid var(--line);
  border-left-width:3px;border-radius:8px;padding:.45rem .6rem;margin-bottom:.35rem;cursor:pointer;font:inherit}
.baucard.t-quelle {border-left-color:#6ea8fe}
.baucard.t-schritt{border-left-color:var(--teal)}
.baucard.t-aktion {border-left-color:var(--amber)}
.baucard.t-ausgabe{border-left-color:var(--emerald)}
.baucard:hover{background:var(--panel-2)}
.baucard b{display:block;font-size:.85rem;color:#eafcf8;font-weight:500}
.baucard span{display:block;font-size:.76rem;color:var(--ink-faint)}

.baurow.t-struktur{border-left-color:#c084fc}
.baucard.t-struktur{border-left-color:#c084fc}
.bauspeicher{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 .9rem;align-items:center}
.bauspeicher select{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:.8rem;padding:.42rem .5rem}
.bauspeicher .btn{font-size:.8rem;padding:.42rem .7rem}
.genfeld.lang{display:block}
.genfeld.lang label{display:block;margin-bottom:.25rem;flex:none}
.genfeld textarea{width:100%;background:var(--bg-deep);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font-family:var(--mono);font-size:.82rem;line-height:1.6;padding:.5rem .55rem;resize:vertical}
.genfeld textarea:focus{outline:2px solid var(--teal);outline-offset:1px}

/* ---------- Prüfung ---------- */
#genpruefung{margin:.2rem 0 .7rem}
.pruefkopf{font-family:var(--mono);font-size:.8rem;padding:.45rem .7rem;border-radius:8px 8px 0 0;
  border:1px solid var(--line);border-bottom:0}
.pruefkopf.p-ok{background:#0d2a20;color:#b6f0d6;border-color:#1c5240}
.pruefkopf.p-warnung{background:#231c0c;color:#f0d9a0;border-color:#4a3a14}
.pruefkopf.p-fehler{background:#2a1416;color:#f3b8b8;border-color:#5a2226}
.pruefzeile{display:flex;gap:.55rem;font-size:.84rem;color:var(--ink-dim);
  padding:.45rem .7rem;border:1px solid var(--line);border-top:0;background:var(--panel)}
.pruefzeile span{flex:0 0 52px;font-family:var(--mono);font-size:.7rem;padding-top:.15rem}
.pruefzeile.p-fehler span{color:var(--rose)}
.pruefzeile.p-warnung span{color:var(--amber)}
.pruefzeile.p-tipp span{color:var(--teal)}
.pruefnote{font-size:.78rem;color:var(--ink-faint);padding:.5rem .7rem;background:var(--bg-deep);
  border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;line-height:1.7}
.pruefnote code{display:block;margin:.3rem 0;white-space:pre-wrap;word-break:break-all}

/* ---------- Quiz ---------- */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:.9rem}
.q .qtext{font-weight:500;margin-bottom:.75rem;color:#eafcf8}
.opt{display:block;width:100%;text-align:left;background:var(--bg-deep);border:1px solid var(--line);
  color:var(--ink-dim);border-radius:8px;padding:.55rem .75rem;margin-bottom:.4rem;cursor:pointer;font:inherit;font-size:.92rem}
.opt:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--emerald);background:#0d2a20;color:#b6f0d6}
.opt.wrong{border-color:var(--rose);background:#2a1416;color:#f3b8b8}
.expl{font-size:.86rem;color:var(--ink-dim);border-left:2px solid var(--teal);padding-left:.7rem;margin-top:.6rem;display:none}
.expl.on{display:block}
.btn{background:linear-gradient(135deg,var(--ps-deep),#0d6a63);border:0;color:#eafcf8;font:inherit;
  font-weight:600;padding:.6rem 1.1rem;border-radius:9px;cursor:pointer;font-size:.93rem}
.btn:hover{filter:brightness(1.14)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-dim);font-weight:400}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal)}
.scorebox{font-family:var(--mono);font-size:.85rem;color:var(--ink-dim);margin-bottom:1rem}

/* ---------- Fußnavigation ---------- */
.pager{display:flex;gap:.6rem;align-items:center;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.readtoggle{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-dim);cursor:pointer;user-select:none}
.readtoggle input{accent-color:var(--emerald);width:17px;height:17px}

/* ---------- Quellenliste ---------- */
.src{display:block;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:.7rem .85rem;margin-bottom:.55rem;text-decoration:none;color:inherit}
.src:hover{border-color:var(--teal)}
.src .t{color:#eafcf8;font-size:.93rem;font-weight:500}
.src .u{font-family:var(--mono);font-size:.73rem;color:var(--ink-faint);word-break:break-all}
.src .d{font-size:.83rem;color:var(--ink-dim);margin-top:.2rem}

/* ---------- Impressum ---------- */
.legal dt{font-size:.74rem;color:var(--ink-faint);font-family:var(--mono);margin-top:.6rem}
.legal dd{margin:0;color:var(--ink)}
.paypal{display:inline-block;background:#ffc439;color:#12232e;font-weight:700;text-decoration:none;
  padding:.6rem 1.3rem;border-radius:24px;margin:.4rem 0}

{id:"start", grp:"Einstieg", nav:"Landkarte", title:"Drei Werkzeuge, eine Windows-Welt",
lede:"CMD, PowerShell und Active Directory werden oft in einem Atemzug genannt, sind aber drei völlig verschiedene Dinge: ein Interpreter, eine Automatisierungsumgebung und ein Verzeichnisdienst.",
html:`
<p>Bevor irgendein Befehl Sinn ergibt, muss die Rollenverteilung sitzen. Wer sie einmal sauber trennt, verwechselt danach nie wieder eine Shell mit einem Dienst.</p>

<div class="tblwrap"><table>
<tr><th></th><th>Was es ist</th><th>Womit es arbeitet</th><th>Typischer Einsatz</th></tr>
<tr><td><strong>CMD</strong><br><code>cmd.exe</code></td><td>Befehlsinterpreter seit Windows NT, Nachfolger von COMMAND.COM</td><td>Text: jede Ausgabe ist eine Zeichenkette</td><td>Schnelle Einzelbefehle, Batchdateien, Anmeldeskripte, Notfallkonsole in WinRE</td></tr>
<tr><td><strong>PowerShell</strong><br><code>powershell.exe</code> / <code>pwsh.exe</code></td><td>Shell <em>und</em> Skriptsprache auf .NET-Basis</td><td>Objekte: jede Ausgabe hat Eigenschaften und Methoden</td><td>Automatisierung, Massenänderungen, Auswertungen, Verwaltung aus der Ferne</td></tr>
<tr><td><strong>Active Directory</strong><br><code>NTDS.dit</code> auf einem DC</td><td>Verzeichnisdienst, also eine verteilte Datenbank plus Authentifizierung</td><td>Objekte im Verzeichnis: Benutzer, Gruppen, Computer, Richtlinien</td><td>Zentrale Anmeldung, Berechtigungen, Gruppenrichtlinien in Firmennetzen</td></tr>
</table></div>

<div class="note"><b>Der entscheidende Unterschied</b>CMD und PowerShell sind <em>Werkzeuge</em>, mit denen du etwas bedienst. Active Directory ist das <em>Etwas</em>, das bedient wird. Es läuft auf einem Server, nicht in deiner Konsole. Beide Shells können mit ihm sprechen - nur auf verschiedenen Wegen.</div>

<h3>Wo die Programme tatsächlich liegen</h3>
<p>Das ist kein Detailwissen für Sammler: Es erklärt, warum drei verschiedene blaue oder schwarze Fenster auf demselben Rechner existieren können.</p>
<div class="tblwrap"><table>
<tr><th>Programm</th><th>Pfad</th><th>Version</th></tr>
<tr><td>cmd.exe</td><td><code>%SystemRoot%\\System32\\cmd.exe</code></td><td>Teil von Windows, keine eigene Versionspflege</td></tr>
<tr><td>powershell.exe</td><td><code>%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\</code></td><td>Windows PowerShell 5.1, fest im Betriebssystem, erhält nur noch Sicherheitsupdates</td></tr>
<tr><td>pwsh.exe</td><td><code>%ProgramFiles%\\PowerShell\\7\\</code></td><td>PowerShell 7.x, plattformübergreifend, separat installiert, läuft parallel zu 5.1</td></tr>
</table></div>
<p>Windows PowerShell 5.1 und PowerShell 7 sind <strong>keine</strong> konkurrierenden Installationen - sie existieren absichtlich nebeneinander. Der Grund ist Kompatibilität: Manche älteren Module laufen nur unter 5.1 auf dem .NET Framework.</p>

<x-term data-k="ps">
# Welche Version läuft hier gerade?
$PSVersionTable.PSVersion

# Wo liegt die ausführbare Datei?
(Get-Process -Id $PID).Path
</x-term>

<h3>Ein Befehl, drei Wege</h3>
<p>Die Aufgabe: Alle gestoppten Dienste anzeigen, die eigentlich automatisch starten sollten.</p>
<x-term data-k="cmd">
:: CMD - nur Text, Filtern ist Zeichenkettensuche
sc query state= all | findstr /i "STOPPED"
</x-term>
<x-term data-k="ps">
# PowerShell - Objekte mit echten Eigenschaften
Get-Service | Where-Object {$_.Status -eq 'Stopped' -and $_.StartType -eq 'Automatic'}
</x-term>
<p>Der CMD-Weg findet das Wort STOPPED irgendwo im Text und weiß nichts vom Starttyp - dafür gibt es dort schlicht keine Eigenschaft. Der PowerShell-Weg fragt zwei tatsächliche Merkmale des Objekts ab. Das ist der ganze Unterschied zwischen Text und Objekt, an einem einzigen Beispiel.</p>

<div class="note warn"><b>Nicht verwechseln</b>Die Windows-Konsolenanwendung, in der alles läuft, ist wieder etwas anderes: früher <code>conhost.exe</code>, heute meist Windows Terminal. Das ist nur das Fenster - CMD, PowerShell und pwsh sind die Programme darin.</div>
`},

  |                           |          |
  v                           v          v
 net.exe  dsquery.exe  ping.exe      ActiveDirectory-Modul
  |            |                          |
  | SMB/RPC    | LDAP 389                 | ADWS 9389
  v            v                          v
 +---------------------------------------------------+
 |        DOMÄNENCONTROLLER (Windows Server)          |
 |   AD DS  ->  NTDS.dit  +  SYSVOL  +  DNS  + KDC    |
 +---------------------------------------------------+
</pre>
</div>

<p>Drei Beobachtungen daraus, die in Prüfungen und in der Praxis immer wieder auftauchen:</p>
<ul>
<li><strong>PowerShell ersetzt CMD nicht, es umfasst es.</strong> Jedes <code>.exe</code>-Werkzeug aus der CMD-Welt lässt sich aus PowerShell heraus aufrufen - <code>ipconfig</code>, <code>robocopy</code>, <code>dsquery</code> funktionieren dort genauso. Umgekehrt geht es nicht: CMD kennt keine Cmdlets.</li>
<li><strong>Der Zugriffsweg aufs AD unterscheidet sich.</strong> Die klassischen Werkzeuge sprechen LDAP auf Port 389 oder RPC. Das PowerShell-Modul <code>ActiveDirectory</code> spricht dagegen mit den <em>Active Directory Web Services</em> auf TCP 9389. Ist dieser Dienst auf dem DC gestoppt oder der Port gesperrt, scheitert <code>Get-ADUser</code>, während <code>dsquery user</code> weiterhin funktioniert. Genau dieser Fall verwirrt im Störungsfall am meisten.</li>
<li><strong>Beide Wege ändern dieselbe Datenbank.</strong> Ob du einen Benutzer in der grafischen Konsole, per <code>dsadd</code> oder per <code>New-ADUser</code> anlegst - am Ende landet ein Objekt in derselben <code>NTDS.dit</code> und wird an alle anderen Domänencontroller repliziert.</li>
</ul>

<h3>Dieselbe Aufgabe in drei Sprachen</h3>
<div class="tblwrap"><table>
<tr><th>Aufgabe</th><th>CMD</th><th>PowerShell</th></tr>
<tr><td>Benutzer im AD suchen</td><td><code>net user max /domain</code><br><code>dsquery user -name "Max*"</code></td><td><code>Get-ADUser max -Properties *</code></td></tr>
<tr><td>Gruppenmitglied hinzufügen</td><td><code>net group "Vertrieb" max /add /domain</code></td><td><code>Add-ADGroupMember Vertrieb -Members max</code></td></tr>
<tr><td>Konto entsperren</td><td>nur über die GUI oder <code>net user max /active:yes</code> (nicht identisch!)</td><td><code>Unlock-ADAccount max</code></td></tr>
<tr><td>Richtlinien aktualisieren</td><td><code>gpupdate /force</code> (nur lokal)</td><td><code>Invoke-GPUpdate -Computer PC01 -Force</code> (auch entfernt)</td></tr>
<tr><td>Richtlinienbericht</td><td><code>gpresult /h bericht.html</code></td><td><code>Get-GPResultantSetOfPolicy -ReportType Html</code></td></tr>
<tr><td>Dienste prüfen</td><td><code>sc query</code> / <code>net start</code></td><td><code>Get-Service</code></td></tr>
<tr><td>Port testen</td><td><code>telnet dc01 389</code></td><td><code>Test-NetConnection dc01 -Port 389</code></td></tr>
<tr><td>DC finden</td><td><code>nltest /dsgetdc:firma.local</code></td><td><code>Get-ADDomainController -Discover</code></td></tr>
</table></div>

<div class="note"><b>Warum es die alten Werkzeuge noch gibt</b>Sie sind auf jedem Windows vorhanden, auch ohne nachinstallierte Verwaltungswerkzeuge, und sie laufen in Umgebungen ohne PowerShell-Remoting. Auf einem frisch aufgesetzten Client ohne RSAT ist <code>net user /domain</code> unter Umständen der einzige Weg, überhaupt etwas über ein Konto zu erfahren.</div>

<h3>Die Brücke: Textausgaben in PowerShell weiterverarbeiten</h3>
<p>Ein <code>.exe</code>-Werkzeug liefert an PowerShell nur Zeichenketten, keine Objekte. Damit die Pipeline trotzdem funktioniert, muss der Text zerlegt werden.</p>
<x-term data-k="ps">
# ipconfig liefert Text - PowerShell filtert ihn wie CMD es täte
ipconfig /all | Select-String "DNS-Server"

# Besser: das native Cmdlet nutzen und echte Objekte bekommen
Get-DnsClientServerAddress -AddressFamily IPv4 |
    Select-Object InterfaceAlias, ServerAddresses
</x-term>
<p>Die Faustregel lautet: Wenn es ein Cmdlet gibt, nimm das Cmdlet. Externe Werkzeuge nur dort, wo kein Cmdlet existiert - und dann bewusst mit der Einschränkung leben, dass die Ausgabe reiner Text ist.</p>

<h3>Der Lebenszyklus eines Mitarbeiterkontos durch alle drei Schichten</h3>
<div class="tblwrap"><table>
<tr><th>Schritt</th><th>Passiert im AD</th><th>Spürbar auf dem Client</th></tr>
<tr><td>Konto angelegt</td><td>Objekt in einer OU, SID vergeben, Kennwort gesetzt</td><td>Anmeldung möglich, sobald die Replikation durch ist</td></tr>
<tr><td>Gruppe zugewiesen</td><td>Eintrag im Attribut <code>member</code> der Gruppe</td><td>Wirkt erst nach neuer Anmeldung - das Kerberos-Ticket enthält die Gruppen</td></tr>
<tr><td>GPO verknüpft</td><td>Verknüpfung an der OU, Dateien im SYSVOL</td><td><code>gpupdate /force</code> oder nächster Aktualisierungszyklus (90 Minuten plus Versatz)</td></tr>
<tr><td>Laufwerk verbunden</td><td>GPO-Einstellung oder Anmeldeskript</td><td><code>net use</code> zeigt die Verbindung</td></tr>
<tr><td>Konto deaktiviert</td><td><code>userAccountControl</code> geändert</td><td>Anmeldung schlägt fehl, bestehende Sitzung läuft weiter bis zum Ticketablauf</td></tr>
</table></div>
<p>Die dritte Spalte enthält die Erklärung für den häufigsten Helpdesk-Satz überhaupt: <em>Ich habe die Gruppe doch eben hinzugefügt, warum kommt er nicht auf das Laufwerk?</em> Weil das Zugriffstoken bei der Anmeldung gebaut wird und die neue Gruppe darin schlicht noch nicht steht.</p>
<x-term data-k="cmd">
:: Prüfen, was tatsächlich im Token steckt
whoami /groups

:: Kerberos-Tickets verwerfen, damit neue ausgestellt werden
klist purge
</x-term>
`},

{id:"cmd-basis", grp:"Eingabeaufforderung", nav:"CMD verstehen", title:"Die Eingabeaufforderung",
lede:"cmd.exe ist alt, simpel und begrenzt - und genau deshalb überall verfügbar und in Notfällen unersetzlich.",
html:`
<h3>Interne und externe Befehle</h3>
<p>Ein Teil der Befehle steckt direkt in <code>cmd.exe</code> - <code>dir</code>, <code>cd</code>, <code>copy</code>, <code>echo</code>, <code>set</code>, <code>if</code>, <code>for</code>. Sie existieren nicht als eigene Datei auf der Platte. Alles andere sind eigenständige Programme in <code>System32</code>: <code>ping.exe</code>, <code>ipconfig.exe</code>, <code>robocopy.exe</code>, <code>net.exe</code>.</p>
<x-term data-k="cmd">
:: Interne Befehle auflisten
help

:: Zeigt nichts - dir ist kein eigenes Programm
where dir

:: Zeigt den Pfad - ping schon
where ping
</x-term>
<p>Diese Unterscheidung ist der Grund dafür, dass <code>help</code> nur eine kurze Liste ausgibt, während die offizielle Windows-Befehlsreferenz über 250 Einträge umfasst. Die Referenz zählt beides zusammen.</p>

<h3>Umgebungsvariablen</h3>
<p>Variablen werden in Prozentzeichen eingeschlossen. Sie gelten nur für die aktuelle Sitzung und alle davon gestarteten Prozesse - deshalb kennt ein bereits geöffnetes Fenster eine neu gesetzte Variable nicht.</p>
<div class="tblwrap"><table>
<tr><th>Variable</th><th>Inhalt</th></tr>
<tr><td><code>%USERNAME%</code></td><td>Angemeldeter Benutzer</td></tr>
<tr><td><code>%USERDOMAIN%</code></td><td>Domäne oder Computername bei lokaler Anmeldung</td></tr>
<tr><td><code>%COMPUTERNAME%</code></td><td>Name des Rechners</td></tr>
<tr><td><code>%USERPROFILE%</code></td><td>Profilordner, meist C:\\Users\\name</td></tr>
<tr><td><code>%APPDATA%</code> / <code>%LOCALAPPDATA%</code></td><td>Anwendungsdaten, roaming bzw. lokal</td></tr>
<tr><td><code>%SystemRoot%</code> / <code>%WINDIR%</code></td><td>Windows-Verzeichnis</td></tr>
<tr><td><code>%PATH%</code></td><td>Suchpfade für ausführbare Dateien</td></tr>
<tr><td><code>%TEMP%</code></td><td>Temporärer Ordner</td></tr>
<tr><td><code>%LOGONSERVER%</code></td><td>Domänencontroller, der die Anmeldung bearbeitet hat</td></tr>
<tr><td><code>%ERRORLEVEL%</code></td><td>Rückgabewert des letzten Befehls, 0 heißt Erfolg</td></tr>
</table></div>
<x-term data-k="cmd">
echo %USERDOMAIN%\\%USERNAME% an %COMPUTERNAME%
echo Anmeldeserver: %LOGONSERVER%

:: Nur für diese Sitzung
set PROJEKT=Migration2026

:: Dauerhaft in der Registrierung, wirkt erst in neuen Prozessen
setx PROJEKT "Migration2026"
</x-term>
<div class="note warn"><b>ERRORLEVEL richtig lesen</b><code>if errorlevel 1</code> bedeutet <em>größer oder gleich 1</em>, nicht <em>gleich 1</em>. Wer exakt vergleichen will, schreibt <code>if "%ERRORLEVEL%"=="1"</code>. Bei robocopy ist außerdem alles unter 8 ein Erfolg - eine 1 heißt dort nur, dass Dateien kopiert wurden.</div>

<h3>Groß- und Kleinschreibung, Pfade, Anführungszeichen</h3>
<ul>
<li>CMD unterscheidet <strong>nicht</strong> zwischen Groß- und Kleinschreibung, weder bei Befehlen noch bei Dateinamen.</li>
<li>Pfade mit Leerzeichen gehören in doppelte Anführungszeichen: <code>cd "C:\\Program Files"</code>.</li>
<li>Der Backslash trennt Verzeichnisse, der Schrägstrich leitet Optionen ein - umgekehrt als unter Linux.</li>
<li><code>.</code> ist das aktuelle, <code>..</code> das übergeordnete Verzeichnis.</li>
</ul>

<h3>Warum CMD in der Praxis überlebt</h3>
<ul>
<li><strong>Wiederherstellungsumgebung:</strong> In WinRE, bei <code>bootrec</code>, <code>diskpart</code> oder <code>bcdedit</code> gibt es oft nur eine Eingabeaufforderung.</li>
<li><strong>Anmeldeskripte:</strong> Unzählige gewachsene <code>.cmd</code>-Dateien laufen noch in produktiven Netzen.</li>
<li><strong>Keine Ausführungsrichtlinie:</strong> Batchdateien starten ohne die Hürde der PowerShell-ExecutionPolicy.</li>
<li><strong>Geschwindigkeit:</strong> Für einen einzelnen <code>ipconfig</code> braucht niemand eine Laufzeitumgebung.</li>
</ul>
`},

{id:"cmd-syntax", grp:"Eingabeaufforderung", nav:"Operatoren &amp; Batch", title:"Umleitung, Verkettung und Batchdateien",
lede:"Hier wird aus einzelnen Befehlen ein Ablauf. Die Operatoren sind wenige, aber sie tauchen in jedem Skript und jeder Prüfung wieder auf.",
html:`
<h3>Umleitungsoperatoren</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Wirkung</th><th>Beispiel</th></tr>
<tr><td><code>&gt;</code></td><td>Ausgabe in Datei, überschreibt</td><td><code>dir &gt; liste.txt</code></td></tr>
<tr><td><code>&gt;&gt;</code></td><td>Ausgabe anhängen</td><td><code>echo Ende &gt;&gt; log.txt</code></td></tr>
<tr><td><code>&lt;</code></td><td>Eingabe aus Datei lesen</td><td><code>sort &lt; unsortiert.txt</code></td></tr>
<tr><td><code>2&gt;</code></td><td>Nur Fehlerausgabe umleiten</td><td><code>befehl 2&gt; fehler.txt</code></td></tr>
<tr><td><code>2&gt;&amp;1</code></td><td>Fehler in die normale Ausgabe mischen</td><td><code>befehl &gt; alles.txt 2&gt;&amp;1</code></td></tr>
<tr><td><code>2&gt;nul</code></td><td>Fehlermeldungen verwerfen</td><td><code>del *.tmp 2&gt;nul</code></td></tr>
<tr><td><code>|</code></td><td>Ausgabe als Eingabe weitergeben</td><td><code>tasklist | findstr chrome</code></td></tr>
</table></div>
<div class="note"><b>Wichtig für das Verständnis der Pipe</b>In CMD fließt durch die Pipe reiner Text. In PowerShell fließen Objekte. Derselbe senkrechte Strich, zwei völlig verschiedene Konzepte - das ist die meistgestellte Verständnisfrage beim Umstieg.</div>

<h3>Verkettungsoperatoren</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Bedeutung</th></tr>
<tr><td><code>&amp;</code></td><td>Nacheinander ausführen, unabhängig vom Ergebnis</td></tr>
<tr><td><code>&amp;&amp;</code></td><td>Zweiten Befehl nur bei Erfolg (ERRORLEVEL 0) ausführen</td></tr>
<tr><td><code>||</code></td><td>Zweiten Befehl nur bei Fehler ausführen</td></tr>
<tr><td><code>^</code></td><td>Sonderzeichen entwerten oder Zeile umbrechen</td></tr>
</table></div>
<x-term data-k="cmd">
:: Ordner nur anlegen, wenn der Wechsel scheitert
cd C:\\Backup || md C:\\Backup

:: Kopieren und nur bei Erfolg protokollieren
copy quelle.txt ziel.txt &amp;&amp; echo OK &gt;&gt; log.txt
</x-term>

<h3>Eine Batchdatei mit Substanz</h3>
<p>Die Endung ist <code>.cmd</code> oder <code>.bat</code> - funktional praktisch identisch, <code>.cmd</code> ist die neuere Variante. Innerhalb einer Batchdatei werden Schleifenvariablen mit doppeltem Prozentzeichen geschrieben.</p>
<x-term data-k="cmd">
@echo off
setlocal enabledelayedexpansion
title Log-Archivierung

set QUELLE=C:\\Logs
set ZIEL=D:\\Archiv\\%DATE:~-4%-%DATE:~3,2%

if not exist "%ZIEL%" md "%ZIEL%"

for %%F in ("%QUELLE%\\*.log") do (
    echo Verarbeite %%~nxF
    copy "%%F" "%ZIEL%\\" &gt;nul
    if errorlevel 1 (
        echo FEHLER bei %%~nxF &gt;&gt; "%ZIEL%\\fehler.txt"
    )
)

echo Fertig: %DATE% %TIME%
endlocal
</x-term>
<p>Die Tilden-Modifizierer bei <code>%%~nxF</code> sind eine Eigenheit, die man einmal gesehen haben muss: <code>~n</code> liefert den Dateinamen ohne Endung, <code>~x</code> die Endung, <code>~dp</code> Laufwerk und Pfad, <code>~f</code> den vollständigen Pfad.</p>

<h3>for /f - das schärfste Werkzeug in CMD</h3>
<p>Damit lassen sich Textausgaben anderer Programme zerlegen. Das ist der Ersatz für alles, was PowerShell mit Objekten erledigt.</p>
<x-term data-k="cmd">
:: Jede Zeile einer Datei, aufgeteilt am Semikolon
for /f "usebackq tokens=1,2 delims=;" %%A in ("benutzer.csv") do (
    echo Konto: %%A   Abteilung: %%B
)

:: Ausgabe eines Befehls zerlegen, Kopfzeile überspringen
for /f "skip=1 tokens=2" %%S in ('sc query Spooler ^| findstr STATE') do echo Status: %%S
</x-term>
<div class="note warn"><b>Verzögerte Erweiterung</b>Innerhalb von Klammerblöcken wird <code>%var%</code> <em>einmal beim Einlesen</em> ersetzt, nicht bei jedem Durchlauf. Wer Variablen in einer Schleife setzt und liest, braucht <code>setlocal enabledelayedexpansion</code> und schreibt dann <code>!var!</code>. Ohne diese Zeile scheitern unzählige Batchskripte auf immer dieselbe Art.</div>
`}
];

CHAPTERS.push(

{id:"ps-basis", grp:"PowerShell", nav:"Grundlagen", title:"PowerShell verstehen",
lede:"PowerShell wirkt zunächst geschwätzig - bis klar wird, dass die langen Namen ein System haben, das man erraten kann statt auswendig zu lernen.",
html:`
<h3>Verb-Substantiv: das ganze Namenssystem</h3>
<p>Jedes Cmdlet heißt <code>Verb-Substantiv</code>, immer im Singular. Das Verb stammt aus einer festen, von Microsoft gepflegten Liste. Wer das Schema kennt, rät neue Befehle richtig.</p>
<div class="tblwrap"><table>
<tr><th>Verb</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><code>Get</code></td><td>Abfragen, ändert nichts</td><td>Get-Service, Get-ADUser</td></tr>
<tr><td><code>Set</code></td><td>Bestehendes ändern</td><td>Set-ADUser, Set-Service</td></tr>
<tr><td><code>New</code></td><td>Neu erzeugen</td><td>New-ADUser, New-Item</td></tr>
<tr><td><code>Remove</code></td><td>Löschen</td><td>Remove-Item, Remove-ADGroupMember</td></tr>
<tr><td><code>Add</code></td><td>Zu etwas Bestehendem hinzufügen</td><td>Add-ADGroupMember</td></tr>
<tr><td><code>Start</code> / <code>Stop</code></td><td>Starten und anhalten</td><td>Start-Service, Stop-Process</td></tr>
<tr><td><code>Test</code></td><td>Prüfen, liefert meist True/False</td><td>Test-Path, Test-NetConnection</td></tr>
<tr><td><code>Invoke</code></td><td>Etwas ausführen lassen</td><td>Invoke-Command, Invoke-WebRequest</td></tr>
<tr><td><code>Export</code> / <code>Import</code></td><td>In ein Format schreiben und zurücklesen</td><td>Export-Csv, Import-Csv</td></tr>
<tr><td><code>Enable</code> / <code>Disable</code></td><td>Aktivieren, deaktivieren</td><td>Enable-ADAccount</td></tr>
</table></div>
<x-term data-k="ps">
# Alle genehmigten Verben ansehen
Get-Verb | Sort-Object Verb

# Was gibt es rund um Netzwerkadapter?
Get-Command -Noun NetAdapter*
</x-term>

<h3>Die drei Befehle, mit denen man alles selbst herausfindet</h3>
<x-term data-k="ps">
Get-Command -Module ActiveDirectory   # Was kann dieses Modul?
Get-Help New-ADUser -Examples         # Wie sieht ein Aufruf aus?
Get-ADUser max -Properties * | Get-Member   # Welche Eigenschaften hat das Ergebnis?
</x-term>
<p>Diese Dreierkette ersetzt das Auswendiglernen. <code>Get-Member</code> ist dabei der unterschätzte Teil: Es zeigt, woran die Pipeline im nächsten Schritt überhaupt andocken kann.</p>

<h3>Aliase: bequem in der Konsole, schädlich im Skript</h3>
<div class="tblwrap"><table>
<tr><th>Alias</th><th>Eigentliches Cmdlet</th><th>Herkunft</th></tr>
<tr><td><code>dir</code>, <code>ls</code>, <code>gci</code></td><td>Get-ChildItem</td><td>CMD, Unix, PowerShell-Kurzform</td></tr>
<tr><td><code>cd</code>, <code>sl</code></td><td>Set-Location</td><td>CMD</td></tr>
<tr><td><code>cat</code>, <code>type</code>, <code>gc</code></td><td>Get-Content</td><td>Unix, CMD</td></tr>
<tr><td><code>cp</code>, <code>copy</code></td><td>Copy-Item</td><td>Unix, CMD</td></tr>
<tr><td><code>rm</code>, <code>del</code></td><td>Remove-Item</td><td>Unix, CMD</td></tr>
<tr><td><code>?</code>, <code>where</code></td><td>Where-Object</td><td>PowerShell</td></tr>
<tr><td><code>%</code>, <code>foreach</code></td><td>ForEach-Object</td><td>PowerShell</td></tr>
<tr><td><code>select</code></td><td>Select-Object</td><td>PowerShell</td></tr>
<tr><td><code>ft</code>, <code>fl</code></td><td>Format-Table, Format-List</td><td>PowerShell</td></tr>
</table></div>
<div class="note warn"><b>Falle beim Umstieg</b>Die Aliase sehen aus wie die alten Befehle, verhalten sich aber anders. <code>ls -l</code> scheitert, weil Get-ChildItem keinen Parameter <code>-l</code> kennt. Und <code>where</code> ist in PowerShell Where-Object, in CMD dagegen where.exe zum Finden von Programmen - dieselbe Eingabe, zwei verschiedene Dinge.</div>

<h3>Provider: dasselbe Cmdlet für ganz verschiedene Datenquellen</h3>
<p>PowerShell behandelt Registrierung, Zertifikatsspeicher, Umgebungsvariablen und sogar das Active Directory wie ein Dateisystem. Deshalb funktionieren <code>Get-ChildItem</code> und <code>Set-Location</code> überall gleich.</p>
<x-term data-k="ps">
Get-PSDrive                       # Alle verfügbaren Laufwerke, auch virtuelle

Get-ChildItem Env:                # Umgebungsvariablen
Get-ChildItem HKLM:\\SOFTWARE      # Registrierung
Get-ChildItem Cert:\\LocalMachine\\My   # Zertifikate
Set-Location AD:                  # Verzeichnis, wenn das AD-Modul geladen ist
</x-term>

<h3>Operatoren, die man täglich braucht</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><code>-eq</code> / <code>-ne</code></td><td>gleich / ungleich</td><td><code>$_.Status -eq 'Running'</code></td></tr>
<tr><td><code>-gt</code> <code>-ge</code> <code>-lt</code> <code>-le</code></td><td>größer, kleiner mit Gleich-Varianten</td><td><code>$_.Length -gt 1MB</code></td></tr>
<tr><td><code>-like</code> / <code>-notlike</code></td><td>Platzhaltervergleich mit * und ?</td><td><code>$_.Name -like 'srv*'</code></td></tr>
<tr><td><code>-match</code></td><td>Regulärer Ausdruck</td><td><code>$_.Name -match '^PC-\\d{3}$'</code></td></tr>
<tr><td><code>-contains</code> / <code>-in</code></td><td>Prüft Listenmitgliedschaft</td><td><code>'IT' -in $abteilungen</code></td></tr>
<tr><td><code>-and</code> <code>-or</code> <code>-not</code></td><td>Logische Verknüpfung</td><td><code>A -and -not B</code></td></tr>
</table></div>
<p>Größenangaben versteht PowerShell direkt: <code>1KB</code>, <code>1MB</code>, <code>1GB</code>, <code>1TB</code> werden automatisch in Bytes umgerechnet. Das spart in Filterausdrücken viel Rechnerei.</p>
`},

{id:"ps-pipeline", grp:"PowerShell", nav:"Pipeline &amp; Objekte", title:"Die Pipeline",
lede:"Der eine Gedanke, der PowerShell von jeder anderen Shell unterscheidet: Durch die Pipe fließt kein Text, sondern strukturierte Objekte.",
html:`
<h3>Was in der Pipe passiert</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.8rem;line-height:1.8;margin:0;overflow-x:auto;color:#cfe7ef">
Get-ADUser -Filter *   |   Where-Object ...   |   Select-Object ...   |   Export-Csv
      |                        |                       |                     |
  liefert Objekte          filtert sie            wählt Spalten         schreibt Datei
  mit Eigenschaften        anhand echter          und benennt um
  (Name, Enabled, ...)     Werte
</pre>
</div>
<p>Jede Stufe bekommt vollständige Objekte, keine abgeschnittenen Bildschirmzeilen. Deshalb geht in der Mitte nichts verloren - anders als bei CMD, wo nach dem ersten <code>findstr</code> nur noch die getroffene Textzeile übrig ist.</p>

<h3>Die sieben Arbeitspferde</h3>
<x-term data-k="ps">
Get-Service |
    Where-Object   { $_.Status -eq 'Stopped' } |   # filtern
    Sort-Object    DisplayName |                   # sortieren
    Select-Object  Name, DisplayName, StartType |  # Spalten wählen
    Export-Csv     C:\\dienste.csv -NoTypeInformation -Delimiter ';' -Encoding UTF8
</x-term>
<ul>
<li><strong>Where-Object</strong> filtert. Kurzform ohne Klammern seit Version 3: <code>Where-Object Status -eq 'Stopped'</code>.</li>
<li><strong>Select-Object</strong> wählt Eigenschaften oder begrenzt mit <code>-First</code> und <code>-Last</code>.</li>
<li><strong>Sort-Object</strong> sortiert, <code>-Descending</code> kehrt um.</li>
<li><strong>Group-Object</strong> gruppiert und zählt - die Basis jeder Auswertung.</li>
<li><strong>Measure-Object</strong> rechnet Summen, Durchschnitte, Maxima.</li>
<li><strong>ForEach-Object</strong> führt für jedes Objekt Code aus, Platzhalter ist <code>$_</code>.</li>
<li><strong>Export-Csv</strong> schreibt das Ergebnis weg - für den Chef, das Ticket oder die Doku.</li>
</ul>

<h3>Berechnete Eigenschaften</h3>
<p>Wenn eine Spalte so nicht existiert, wird sie in <code>Select-Object</code> erzeugt. Die Kurzschreibweise <code>n</code> steht für Name, <code>e</code> für Expression.</p>
<x-term data-k="ps">
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
    Select-Object DeviceID,
        @{n='GrößeGB'; e={[math]::Round($_.Size/1GB,1)}},
        @{n='FreiGB';  e={[math]::Round($_.FreeSpace/1GB,1)}},
        @{n='Frei%';   e={[math]::Round($_.FreeSpace/$_.Size*100,0)}}
</x-term>

<h3>Filtern links, nicht rechts</h3>
<p>Eine Regel, die bei großen Verzeichnissen den Unterschied zwischen Sekunden und Minuten ausmacht: Filter gehören in den Befehl selbst, nicht erst in ein nachgelagertes <code>Where-Object</code>.</p>
<x-term data-k="ps">
# Langsam: der DC liefert alle Konten, PowerShell wirft danach weg
Get-ADUser -Filter * -Properties Department | Where-Object Department -eq 'IT'

# Schnell: der DC filtert selbst und schickt nur die Treffer
Get-ADUser -Filter "Department -eq 'IT'" -Properties Department
</x-term>

<h3>Formatieren kommt immer zum Schluss</h3>
<div class="note stop"><b>Häufiger Fehler</b>Nach einem <code>Format-Table</code> sind es keine echten Objekte mehr, sondern Formatierungsanweisungen. Ein anschließendes <code>Export-Csv</code> liefert deshalb unbrauchbaren Inhalt. Merksatz: Format-Cmdlets nur ganz am Ende und nie vor einem Export.</div>

<h3>Die Ausgabe verlässt PowerShell</h3>
<div class="tblwrap"><table>
<tr><th>Ziel</th><th>Cmdlet</th><th>Wofür</th></tr>
<tr><td>Bildschirm, tabellarisch</td><td><code>Format-Table -AutoSize</code></td><td>Schneller Blick</td></tr>
<tr><td>Bildschirm, alle Felder</td><td><code>Format-List *</code></td><td>Ein Objekt vollständig erkunden</td></tr>
<tr><td>Sortierbares Fenster</td><td><code>Out-GridView -PassThru</code></td><td>Auswahl durch den Anwender</td></tr>
<tr><td>Tabellenkalkulation</td><td><code>Export-Csv -Delimiter ';'</code></td><td>Auswertung, Übergabe</td></tr>
<tr><td>Bericht</td><td><code>ConvertTo-Html</code></td><td>Dokumentation, Ticketanhang</td></tr>
<tr><td>Zwischenablage</td><td><code>Set-Clipboard</code></td><td>Schnelles Einfügen ins Ticket</td></tr>
</table></div>
`},

{id:"ps-skript", grp:"PowerShell", nav:"Skripte &amp; Remoting", title:"Skripte, Fehler und entfernte Rechner",
lede:"Ab hier wird aus der Konsole Automatisierung: eigene Dateien, kontrollierte Fehler und Befehle, die auf hundert Rechnern gleichzeitig laufen.",
html:`
<h3>Ausführungsrichtlinie</h3>
<p>Eine <code>.ps1</code>-Datei startet nicht per Doppelklick, sondern unterliegt der ExecutionPolicy. Sie ist ein Schutz vor Versehen, keine Sicherheitsgrenze - wer ein Skript ausführen will, kann sie immer umgehen.</p>
<div class="tblwrap"><table>
<tr><th>Einstellung</th><th>Lokal erstelltes Skript</th><th>Heruntergeladenes Skript</th><th>Einsatz</th></tr>
<tr><td><code>Restricted</code></td><td>blockiert</td><td>blockiert</td><td>Standard auf Windows-Clients. Einzelne Befehle gehen, Skriptdateien nicht.</td></tr>
<tr><td><code>AllSigned</code></td><td>nur signiert</td><td>nur signiert</td><td>Hohe Sicherheit, aber jedes eigene Skript braucht ein Codesignaturzertifikat.</td></tr>
<tr><td><code>RemoteSigned</code></td><td>läuft</td><td>nur signiert</td><td>Der übliche Kompromiss und Standard auf Windows Server.</td></tr>
<tr><td><code>Unrestricted</code></td><td>läuft</td><td>läuft nach Rückfrage</td><td>Standard auf Linux und macOS. Auf Windows nur in abgeschotteten Testumgebungen sinnvoll.</td></tr>
<tr><td><code>Bypass</code></td><td>läuft</td><td>läuft</td><td>Keine Prüfung, keine Warnung. Gedacht für einzelne Aufrufe aus anderen Programmen heraus.</td></tr>
<tr><td><code>Undefined</code></td><td colspan="2">keine eigene Festlegung</td><td>Der nächstniedrigere Bereich entscheidet. Sind alle undefiniert, gilt Restricted.</td></tr>
</table></div>

<h4>RemoteSigned im Detail</h4>
<p>Die Unterscheidung zwischen lokal und heruntergeladen ist keine Magie. Beim Download aus dem Internet legt Windows an der Datei einen zusätzlichen NTFS-Datenstrom namens <code>Zone.Identifier</code> an. Darin steht die Herkunftszone: 3 für Internet, 4 für nicht vertrauenswürdige Quellen. Genau daran erkennt RemoteSigned ein fremdes Skript.</p>
<x-term data-k="ps">
# Herkunftsmarkierung sichtbar machen
Get-Item .\\skript.ps1 -Stream *
Get-Content .\\skript.ps1 -Stream Zone.Identifier

# Markierung entfernen, damit das Skript unter RemoteSigned läuft
Unblock-File .\\skript.ps1

# Ganzen Ordner freigeben
Get-ChildItem C:\\Skripte -Filter *.ps1 -Recurse | Unblock-File
</x-term>
<p>Damit wird auch klar, warum ein Skript aus einer E-Mail oder einem heruntergeladenen ZIP-Archiv scheitert, während dieselbe Datei nach dem Kopieren über eine Netzwerkfreigabe anstandslos läuft: Der Datenstrom wandert nicht überall mit. Wichtig ist, dass <code>Unblock-File</code> eine bewusste Entscheidung ist - erst den Inhalt lesen, dann entsperren.</p>

<h4>Unrestricted im Detail</h4>
<p>Unrestricted führt alles aus. Bei Dateien mit Herkunftsmarkierung erscheint noch eine Rückfrage, die sich mit <em>Immer ausführen</em> dauerhaft abschalten lässt - danach gibt es keine Hürde mehr. Auf Linux und macOS ist Unrestricted die Voreinstellung, weil es dort keine Zonen-Datenströme und damit keine sinnvolle Unterscheidung gibt.</p>
<div class="note stop"><b>Warum Unrestricted auf Windows-Arbeitsplätzen nichts zu suchen hat</b>Der Unterschied zu RemoteSigned ist genau der Schutz, der zählt: Ein per Mail hereingereichtes Skript läuft unter RemoteSigned nicht, unter Unrestricted nach einem einzigen Klick. Wer nur ein eigenes Skript testen will, braucht dafür kein Unrestricted - dafür gibt es <code>-Scope Process</code> oder den einmaligen Aufruf mit <code>-ExecutionPolicy Bypass</code>.</div>

<h4>Die Bereiche und ihre Rangfolge</h4>
<p>Es gibt nicht eine Richtlinie, sondern fünf - und sie gewinnen von oben nach unten. Deshalb kann <code>Set-ExecutionPolicy</code> scheinbar wirkungslos bleiben: Eine Gruppenrichtlinie steht darüber.</p>
<div class="tblwrap"><table>
<tr><th>Rang</th><th>Bereich</th><th>Gilt für</th></tr>
<tr><td>1</td><td><code>MachinePolicy</code></td><td>Per Gruppenrichtlinie für den Computer gesetzt - schlägt alles darunter</td></tr>
<tr><td>2</td><td><code>UserPolicy</code></td><td>Per Gruppenrichtlinie für den Benutzer gesetzt</td></tr>
<tr><td>3</td><td><code>Process</code></td><td>Nur diese eine Sitzung, verschwindet beim Schließen</td></tr>
<tr><td>4</td><td><code>CurrentUser</code></td><td>Registrierung unter HKCU, keine Administratorrechte nötig</td></tr>
<tr><td>5</td><td><code>LocalMachine</code></td><td>Registrierung unter HKLM, gilt für alle Benutzer, erfordert Administratorrechte</td></tr>
</table></div>
<x-term data-k="ps">
# Alle fünf Bereiche auf einen Blick - hier steht, wer gerade gewinnt
Get-ExecutionPolicy -List

# Der übliche Weg: nur für den eigenen Benutzer, ohne Adminrechte
Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser

# Nur für diese eine Konsole, wirkt sofort und ist beim Schließen wieder weg
Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope Process

# Eine eigene Festlegung wieder entfernen
Set-ExecutionPolicy -ExecutionPolicy Undefined -Scope CurrentUser
</x-term>
<div class="note warn"><b>Wenn Set-ExecutionPolicy nichts bewirkt</b>Zeigt <code>Get-ExecutionPolicy -List</code> bei <code>MachinePolicy</code> oder <code>UserPolicy</code> einen anderen Wert als Undefined, kommt die Vorgabe aus einer Gruppenrichtlinie. Sie steht unter <em>Computerkonfiguration, Administrative Vorlagen, Windows-Komponenten, Windows PowerShell</em> und lässt sich lokal nicht überschreiben. In der Domäne ist das der Normalfall und beabsichtigt.</div>
<div class="note"><b>Windows PowerShell und PowerShell 7 zählen getrennt</b>Beide führen eigene Einstellungen in der Registrierung. Eine in <code>powershell.exe</code> gesetzte Richtlinie gilt nicht automatisch in <code>pwsh.exe</code> - ein Fehler, der beim Umstieg regelmäßig Zeit kostet.</div>
<x-term data-k="ps">
Get-ExecutionPolicy -List
Set-ExecutionPolicy RemoteSigned -Scope CurrentUser

# Einmalig für einen Aufruf, ohne dauerhafte Änderung
powershell.exe -ExecutionPolicy Bypass -File C:\\skripte\\wartung.ps1
</x-term>

<h3>Ein Skript mit Parametern</h3>
<x-term data-k="ps">
[CmdletBinding()]
param(
    [Parameter(Mandatory)][string]$Abteilung,
    [string]$Ausgabe = "C:\\Berichte\\bericht.csv"
)

Import-Module ActiveDirectory

try {
    $benutzer = Get-ADUser -Filter "Department -eq '$Abteilung'" -Properties Department, Mail, LastLogonDate -ErrorAction Stop

    if (-not $benutzer) {
        Write-Warning "Keine Konten in Abteilung $Abteilung gefunden."
        return
    }

    $benutzer |
        Select-Object Name, SamAccountName, Mail, LastLogonDate |
        Export-Csv $Ausgabe -NoTypeInformation -Delimiter ';' -Encoding UTF8

    Write-Host "$($benutzer.Count) Konten nach $Ausgabe geschrieben." -ForegroundColor Green
}
catch {
    Write-Error "Abfrage fehlgeschlagen: $($_.Exception.Message)"
}
</x-term>
<p>Drei Dinge daran sind wichtiger als der Rest: <code>[CmdletBinding()]</code> schaltet <code>-Verbose</code> und <code>-WhatIf</code> frei, <code>Mandatory</code> erzwingt eine Eingabe, und lange Befehle lassen sich nach einem Pipe-Zeichen oder einem Komma umbrechen - oder mit einem Gravis-Zeichen am Zeilenende, das aber als fehleranfällig gilt.</p>

<h3>Fehlerbehandlung</h3>
<div class="note warn"><b>Der Stolperstein</b><code>try/catch</code> fängt nur <em>abbrechende</em> Fehler. Die meisten Cmdlets erzeugen aber nicht abbrechende Fehler und laufen einfach weiter - der Catch-Block wird dann nie erreicht. Deshalb gehört an jeden kritischen Aufruf <code>-ErrorAction Stop</code>.</div>
<div class="tblwrap"><table>
<tr><th>Wert für -ErrorAction</th><th>Verhalten</th></tr>
<tr><td><code>Continue</code></td><td>Fehler anzeigen, weiterlaufen (Standard)</td></tr>
<tr><td><code>SilentlyContinue</code></td><td>Fehler unterdrücken, weiterlaufen</td></tr>
<tr><td><code>Stop</code></td><td>Abbrechen - macht try/catch erst wirksam</td></tr>
<tr><td><code>Inquire</code></td><td>Nachfragen</td></tr>
</table></div>
<x-term data-k="ps">
# Testlauf vor der echten Änderung
Get-ADUser -Filter "Enabled -eq $false" | Remove-ADUser -WhatIf

# Einzelbestätigung erzwingen
Remove-ADUser m.mustermann -Confirm
</x-term>
<p><code>-WhatIf</code> ist die wichtigste Angewohnheit überhaupt: Es zeigt, was passieren <em>würde</em>, ohne etwas zu tun. Vor jedem Massenlöschen gehört es in die Zeile.</p>

<h3>Remoting: ein Befehl, viele Rechner</h3>
<p>PowerShell-Remoting nutzt WinRM über HTTP auf Port 5985 oder HTTPS auf 5986. In der Domäne wird es meist per Gruppenrichtlinie aktiviert und über Kerberos authentifiziert.</p>
<x-term data-k="ps">
# Einmalig auf dem Ziel aktivieren
Enable-PSRemoting -Force

# Interaktiv auf einem Server arbeiten
Enter-PSSession -ComputerName srv01

# Denselben Befehl auf vielen Rechnern parallel ausführen
Invoke-Command -ComputerName (Get-Content C:\\server.txt) -ScriptBlock {
    Get-Service Spooler | Select-Object @{n='Host';e={$env:COMPUTERNAME}}, Status
}

# Eine lokale Variable in den entfernten Block mitgeben
$dienst = 'Spooler'
Invoke-Command -ComputerName srv01 -ScriptBlock { Get-Service $using:dienst }
</x-term>
<div class="note"><b>Der Vergleich zu CMD</b>Für entfernte Rechner bot die Eingabeaufforderung nur Einzelwerkzeuge mit <code>/s</code>-Parameter wie <code>tasklist /s</code> oder <code>sc \\\\server</code>. Ein allgemeines Verfahren, beliebigen Code auf beliebigen Rechnern auszuführen, gab es nicht. Genau das ist Remoting - und der Hauptgrund, warum in Firmennetzen kein Weg an PowerShell vorbeiführt.</div>

<h3>Nachvollziehbarkeit</h3>
<x-term data-k="ps">
Start-Transcript -Path "C:\\Protokoll\\$(Get-Date -f yyyyMMdd-HHmm).txt"
# ... Arbeit ...
Stop-Transcript
</x-term>
<p>Bei Änderungen an Produktivsystemen ist ein Mitschnitt kein Luxus, sondern die Grundlage dafür, im Zweifel belegen zu können, was gemacht wurde.</p>
`}

,
{id:"ps-getcommand", grp:"PowerShell", nav:"Get-Command", title:"Get-Command in ganzer Breite",
lede:"Ein einziges Cmdlet beantwortet die Frage, die am Anfang jeder Aufgabe steht: Gibt es dafür überhaupt einen Befehl - und wie heißt er?",
html:`
<p>Auf einem gewöhnlichen Windows-Arbeitsplatz liefert <code>Get-Command</code> je nach installierten Modulen zwischen 1.500 und 2.500 Einträge, auf einem Domänencontroller deutlich mehr. Diese Menge lernt niemand auswendig. Man lernt stattdessen, sie zu durchsuchen.</p>
<x-term data-k="ps">
# Wie viele Befehle kennt diese Sitzung überhaupt?
(Get-Command).Count

# Aufgeschlüsselt nach Art
Get-Command | Group-Object CommandType | Sort-Object Count -Descending

# Die zehn Module mit den meisten Befehlen
Get-Command | Group-Object Source | Sort-Object Count -Descending | Select-Object -First 10
</x-term>

<h3>Was zurückkommt</h3>
<p>Get-Command gibt keine Zeichenketten aus, sondern <code>CommandInfo</code>-Objekte. Die vier Spalten der Standardansicht sind nur ein Ausschnitt davon.</p>
<div class="tblwrap"><table>
<tr><th>Eigenschaft</th><th>Inhalt</th></tr>
<tr><td><code>Name</code></td><td>Der Befehlsname, bei Programmen mit Dateiendung</td></tr>
<tr><td><code>CommandType</code></td><td>Art des Befehls - siehe Tabelle unten</td></tr>
<tr><td><code>Version</code></td><td>Modulversion, bei Programmen die Dateiversion</td></tr>
<tr><td><code>Source</code></td><td>Das Modul, aus dem der Befehl stammt, oder der Pfad zur Datei</td></tr>
<tr><td><code>Parameters</code></td><td>Alle Parameter als Wörterbuch, samt Typ und Aliasen</td></tr>
<tr><td><code>ParameterSets</code></td><td>Die zulässigen Parameterkombinationen</td></tr>
<tr><td><code>Definition</code></td><td>Bei Aliasen und Funktionen der dahinterliegende Code</td></tr>
<tr><td><code>Module</code></td><td>Das Modulobjekt selbst, mit Pfad und exportierten Befehlen</td></tr>
</table></div>
<x-term data-k="ps">
Get-Command Get-Service | Format-List *
(Get-Command Get-ChildItem).Parameters.Keys
(Get-Command dir).Definition
</x-term>

<h3>Die Befehlsarten</h3>
<div class="tblwrap"><table>
<tr><th>CommandType</th><th>Was es ist</th><th>Beispiel</th></tr>
<tr><td><code>Cmdlet</code></td><td>In .NET kompilierter Befehl aus einem Modul</td><td>Get-Service</td></tr>
<tr><td><code>Function</code></td><td>In PowerShell geschriebener Befehl - aus einem Modul, einem Skript oder dem Profil</td><td>Get-NetIPAddress</td></tr>
<tr><td><code>Alias</code></td><td>Kurzname, der auf etwas anderes zeigt</td><td>dir, ls, gci</td></tr>
<tr><td><code>Application</code></td><td>Ausführbare Datei aus dem PATH - jedes klassische Werkzeug</td><td>ping.exe, ipconfig.exe</td></tr>
<tr><td><code>ExternalScript</code></td><td>Eine .ps1-Datei, die über den PATH erreichbar ist</td><td>wartung.ps1</td></tr>
<tr><td><code>Filter</code></td><td>Sonderform einer Funktion, die nur den Prozessblock kennt</td><td>selten</td></tr>
<tr><td><code>Configuration</code></td><td>DSC-Konfiguration</td><td>nur mit DSC</td></tr>
<tr><td><code>All</code></td><td>Kein eigener Typ, sondern der Sammelwert für die Suche</td><td>-CommandType All</td></tr>
</table></div>
<div class="note"><b>Der praktische Nutzen</b>Mit <code>-CommandType Application</code> wird Get-Command zum vollwertigen Ersatz für <code>where.exe</code> - und es findet zusätzlich Aliase und Funktionen, die denselben Namen belegen. Genau daran scheitern sonst Skripte, in denen etwa <code>curl</code> oder <code>where</code> etwas anderes trifft als erwartet.</div>
<x-term data-k="ps">
# Wo liegt das echte Programm?
Get-Command ping -CommandType Application | Select-Object Name, Source

# Alle .exe-Dateien im PATH, die mit net beginnen
Get-Command net* -CommandType Application
</x-term>

<h3>Die Parameter</h3>
<div class="tblwrap"><table>
<tr><th>Parameter</th><th>Wirkung</th></tr>
<tr><td><code>-Name</code></td><td>Positionsparameter, Platzhalter erlaubt. <code>Get-Command Get-AD*</code> reicht.</td></tr>
<tr><td><code>-Verb</code></td><td>Sucht nach dem Tätigkeitsteil: alle Get-, alle Remove-Befehle.</td></tr>
<tr><td><code>-Noun</code></td><td>Sucht nach dem Gegenstand - meist der nützlichere der beiden.</td></tr>
<tr><td><code>-Module</code></td><td>Beschränkt auf ein oder mehrere Module. Der erste Griff bei einem unbekannten Modul.</td></tr>
<tr><td><code>-CommandType</code></td><td>Filtert nach Art, mehrere Werte durch Komma getrennt.</td></tr>
<tr><td><code>-ParameterName</code></td><td>Findet alle Befehle, die einen bestimmten Parameter besitzen.</td></tr>
<tr><td><code>-ParameterType</code></td><td>Findet Befehle, die einen bestimmten Objekttyp entgegennehmen - so findet man Pipeline-Partner.</td></tr>
<tr><td><code>-Syntax</code></td><td>Gibt nur die Aufrufsyntax aus, ohne die Hilfe zu laden. Schnellste Erinnerungsstütze.</td></tr>
<tr><td><code>-All</code></td><td>Zeigt alle gleichnamigen Befehle statt nur des gewinnenden. Entscheidend bei Namenskonflikten.</td></tr>
<tr><td><code>-ListImported</code></td><td>Nur das, was bereits geladen ist - ohne das Durchsuchen aller Modulpfade.</td></tr>
<tr><td><code>-TotalCount</code></td><td>Begrenzt die Anzahl der Treffer.</td></tr>
<tr><td><code>-ShowCommandInfo</code></td><td>Liefert die Angaben als strukturiertes Objekt für Werkzeuge und Oberflächen.</td></tr>
<tr><td><code>-UseFuzzyMatching</code></td><td>Findet auch bei Tippfehlern. Erst ab PowerShell 7.</td></tr>
</table></div>

<h3>Suchmuster, die man wirklich braucht</h3>
<x-term data-k="ps">
# Was gibt es rund um einem Gegenstand? Der beste Einstieg überhaupt.
Get-Command -Noun Service
Get-Command -Noun NetFirewall*

# Was kann ein unbekanntes Modul?
Get-Command -Module ActiveDirectory | Sort-Object Noun, Verb

# Welche Befehle ändern etwas? Vor Wartungsarbeiten hilfreich.
Get-Command -Module NetTCPIP -Verb Set, New, Remove

# Welcher Befehl versteht überhaupt einen Computernamen?
Get-Command -ParameterName ComputerName | Select-Object Name, Source

# Welcher Befehl nimmt ein Dienstobjekt entgegen? So findet man Pipeline-Partner.
Get-Command -ParameterType System.ServiceProcess.ServiceController

# Syntax auf die Schnelle, ohne Hilfedateien
Get-Command New-ADUser -Syntax
</x-term>

<h3>Namenskonflikte und die Rangfolge</h3>
<p>Wenn zwei Dinge denselben Namen tragen, gewinnt nicht das Naheliegende, sondern eine feste Reihenfolge:</p>
<div class="card">
<pre style="font-family:var(--mono);font-size:.82rem;line-height:1.9;margin:0;overflow-x:auto;color:#cfe7ef">
 1. Alias
 2. Funktion
 3. Cmdlet
 4. Externes Programm oder Skript aus dem PATH
</pre>
</div>
<p>Deshalb landet <code>where</code> in Windows PowerShell bei Where-Object und nicht bei <code>where.exe</code>, und deshalb traf <code>curl</code> dort Invoke-WebRequest statt des echten curl. Wer den Konflikt sehen will, nimmt <code>-All</code>; wer ihn umgehen will, schreibt die Dateiendung mit.</p>
<x-term data-k="ps">
# Alle Kandidaten in der Reihenfolge ihres Vorrangs
Get-Command where -All

# Eindeutig das Programm ansprechen
where.exe ping
& "$env:SystemRoot\\System32\\where.exe" ping
</x-term>

<h3>Die Erkundungskette</h3>
<p>Drei Befehle, immer in derselben Reihenfolge - damit erschließt man jedes fremde Modul ohne Dokumentation:</p>
<div class="tblwrap"><table>
<tr><th>Frage</th><th>Befehl</th></tr>
<tr><td>Gibt es dafür einen Befehl?</td><td><code>Get-Command -Noun ...</code> oder <code>-Module ...</code></td></tr>
<tr><td>Wie rufe ich ihn auf?</td><td><code>Get-Help &lt;Name&gt; -Examples</code></td></tr>
<tr><td>Was kommt zurück, und wie geht es weiter?</td><td><code>&lt;Befehl&gt; | Get-Member</code></td></tr>
</table></div>
<x-term data-k="ps">
# Beispiel: Alles über Freigaben herausfinden, ohne etwas nachzuschlagen
Get-Command -Noun Smb* | Group-Object Noun
Get-Help Get-SmbShare -Examples
Get-SmbShare | Get-Member -MemberType Property
</x-term>
<div class="note warn"><b>Wenn ein Befehl nicht gefunden wird</b>Drei Ursachen decken fast alle Fälle ab: Das Modul ist nicht installiert (bei AD-Befehlen fehlt meist RSAT), es liegt außerhalb von <code>$env:PSModulePath</code>, oder der Befehl existiert nur in einer der beiden PowerShell-Versionen. <code>Get-Module -ListAvailable</code> und <code>$env:PSModulePath -split ';'</code> klären das in zwei Zeilen.</div>
`}

,
{id:"ps-stil", grp:"PowerShell", nav:"Skriptaufbau", title:"Wie ein Skript aufgebaut sein soll",
lede:"Ein Skript wird einmal geschrieben und danach jahrelang gelesen - meistens von jemand anderem, meistens unter Zeitdruck. Deshalb gibt es für den Aufbau feste Vorgaben.",
html:`
<h3>Die Reihenfolge von oben nach unten</h3>
<p>Jede <code>.ps1</code>-Datei folgt derselben Gliederung. Wer sich daran hält, findet in einem fremden Skript alles dort, wo er es erwartet.</p>
<div class="card">
<pre style="font-family:var(--mono);font-size:.8rem;line-height:1.95;margin:0;overflow-x:auto;color:#cfe7ef">
 1.  #Requires          Mindestvoraussetzungen - Version, Module, Adminrechte
 2.  Kommentarhilfe     &lt;# .SYNOPSIS ... #&gt; direkt vor param
 3.  [CmdletBinding()]  schaltet -Verbose, -WhatIf, -ErrorAction frei
 4.  param( ... )       ALLE Eingaben, mit Validierung
 5.  Set-StrictMode     deckt Tippfehler in Variablennamen auf
 6.  begin { }          einmalige Vorbereitung: Module laden, Verbindung aufbauen
 7.  process { }        die eigentliche Arbeit, je Pipeline-Objekt
 8.  end { }            Zusammenfassung, Aufräumen, Rückgabe
</pre>
</div>
<div class="note"><b>Warum param ganz nach oben gehört</b>PowerShell erlaubt vor dem param-Block nur Kommentare und #Requires. Steht irgendetwas anderes davor - und sei es eine einzige Zuweisung - bricht das Skript mit einem Syntaxfehler ab. Das ist kein Stil, sondern eine Regel der Sprache.</div>

<h3>#Requires: Voraussetzungen erzwingen statt hoffen</h3>
<p>Diese Zeilen prüft PowerShell, bevor auch nur eine Zeile läuft. Das ist deutlich besser als ein Abbruch mitten in einer Massenänderung.</p>
<x-term data-k="ps">
#Requires -Version 5.1
#Requires -Modules ActiveDirectory, GroupPolicy
#Requires -RunAsAdministrator
</x-term>

<h3>Kommentarhilfe: das Skript erklärt sich selbst</h3>
<p>Ein Block in dieser Form sorgt dafür, dass <code>Get-Help .\\skript.ps1 -Examples</code> funktioniert - genau wie bei einem eingebauten Cmdlet. Das ist der Unterschied zwischen einem Skript, das jemand weiterverwenden kann, und einem, das niemand anzufassen wagt.</p>
<x-term data-k="ps">
&lt;#
.SYNOPSIS
    Erstellt Benutzerkonten aus einer CSV-Datei.

.DESCRIPTION
    Liest eine Semikolon-getrennte Liste ein, legt für jede Zeile ein
    Konto in der passenden Abteilungs-OU an und nimmt es in die
    zugehörige Rollengruppe auf. Bestehende Konten werden übersprungen.

.PARAMETER Pfad
    Vollständiger Pfad zur CSV-Datei mit den Spalten
    Vorname, Nachname, Kuerzel, Abteilung.

.PARAMETER Domaene
    DNS-Name der Zieldomäne. Standard ist die Domäne des ausführenden Rechners.

.EXAMPLE
    .\\Neue-Benutzer.ps1 -Pfad C:\\Import\\april.csv -WhatIf

    Zeigt, was angelegt würde, ohne etwas zu ändern.

.NOTES
    Autor:   A. Scherer
    Stand:   2026-09
    Version: 1.2
#&gt;
</x-term>

<h3>Der param-Block: Eingaben prüfen, bevor etwas passiert</h3>
<p>Validierungsattribute sind der wirksamste Schutz gegen Fehlbedienung. Sie greifen, bevor die erste Zeile Code läuft, und liefern eine verständliche Meldung statt eines Folgefehlers zwanzig Zeilen später.</p>
<x-term data-k="ps">
param(
    [Parameter(Mandatory, Position = 0,
               HelpMessage = 'Pfad zur CSV-Datei')]
    [ValidateScript({ Test-Path $_ -PathType Leaf })]
    [string]$Pfad,

    [Parameter(ValueFromPipeline, ValueFromPipelineByPropertyName)]
    [ValidateNotNullOrEmpty()]
    [string[]]$Kuerzel,

    [ValidateSet('Vertrieb', 'IT', 'Buchhaltung', 'Lager')]
    [string]$Abteilung = 'IT',

    [ValidatePattern('^[a-z]\\.[a-z]+$')]
    [string]$Namensschema,

    [ValidateRange(1, 500)]
    [int]$MaxAnzahl = 50,

    [switch]$Protokoll
)
</x-term>
<div class="tblwrap"><table>
<tr><th>Attribut</th><th>Wirkung</th></tr>
<tr><td><code>Mandatory</code></td><td>PowerShell fragt nach, wenn der Wert fehlt</td></tr>
<tr><td><code>ValidateSet</code></td><td>Nur die aufgezählten Werte - und die Tabulatortaste vervollständigt sie</td></tr>
<tr><td><code>ValidateRange</code></td><td>Zahlenbereich begrenzen</td></tr>
<tr><td><code>ValidatePattern</code></td><td>Prüfung gegen einen regulären Ausdruck</td></tr>
<tr><td><code>ValidateScript</code></td><td>Beliebige eigene Prüfung, etwa ob eine Datei existiert</td></tr>
<tr><td><code>ValidateNotNullOrEmpty</code></td><td>Leere Werte abweisen</td></tr>
<tr><td><code>ValueFromPipeline</code></td><td>Der Parameter nimmt Objekte aus der Pipeline entgegen</td></tr>
<tr><td><code>[switch]</code></td><td>Schalter ohne Wert, entweder gesetzt oder nicht</td></tr>
</table></div>

<h3>ShouldProcess: -WhatIf und -Confirm für eigene Skripte</h3>
<p>Alles, was löscht, ändert oder anlegt, gehört in eine ShouldProcess-Abfrage. Der Aufwand sind zwei Zeilen, der Gewinn ist ein Testlauf ohne Risiko - dieselbe Sicherheit, die die eingebauten Cmdlets bieten.</p>
<x-term data-k="ps">
[CmdletBinding(SupportsShouldProcess, ConfirmImpact = 'High')]
param(
    [Parameter(Mandatory)][string]$Konto
)

if ($PSCmdlet.ShouldProcess($Konto, 'Konto deaktivieren')) {
    Disable-ADAccount -Identity $Konto -ErrorAction Stop
}
</x-term>
<p>Ein Aufruf mit <code>-WhatIf</code> gibt danach von selbst aus, was geschehen würde. Ohne diese Konstruktion muss man die Testlogik von Hand nachbauen - und vergisst sie erfahrungsgemäß genau dort, wo sie gebraucht würde.</p>

<h3>Fehlerbehandlung, die wirklich greift</h3>
<x-term data-k="ps">
Set-StrictMode -Version Latest

try {
    $benutzer = Get-ADUser -Identity $Konto -ErrorAction Stop
}
catch [Microsoft.ActiveDirectory.Management.ADIdentityNotFoundException] {
    Write-Warning "Konto $Konto existiert nicht - übersprungen."
    return
}
catch {
    Write-Error "Unerwarteter Fehler bei $Konto : $($_.Exception.Message)"
    throw
}
finally {
    Write-Verbose 'Aufräumen abgeschlossen.'
}
</x-term>
<ul>
<li><code>Set-StrictMode -Version Latest</code> meldet unbekannte Variablen. Ein Tippfehler wird damit zum Fehler statt zu einem stillen leeren Wert - die Ursache unzähliger Skripte, die scheinbar durchlaufen und nichts tun.</li>
<li><code>-ErrorAction Stop</code> an jedem kritischen Aufruf. Ohne das erreicht der catch-Block die meisten Fehler nie.</li>
<li>Spezifische catch-Blöcke vor dem allgemeinen. Ein nicht gefundenes Konto behandelt man anders als einen Netzwerkausfall.</li>
<li><code>finally</code> läuft immer - der richtige Ort für Verbindungen schließen und Dateien freigeben.</li>
<li><code>$ErrorActionPreference = 'Stop'</code> am Skriptanfang setzt das global. Bequem, aber es ändert auch das Verhalten aller aufgerufenen Befehle - bewusst einsetzen.</li>
</ul>

<h3>Formvorgaben, auf die man sich geeinigt hat</h3>
<div class="tblwrap"><table>
<tr><th>Regel</th><th>Warum</th></tr>
<tr><td>Cmdlets ausschreiben, keine Aliase</td><td><code>Get-ChildItem</code> statt <code>gci</code> - Aliase können überschrieben sein und lesen sich für Dritte schlechter</td></tr>
<tr><td>Parameter ausschreiben</td><td><code>-Recurse</code> statt <code>-r</code>; Kurzformen brechen, sobald ein neuer Parameter dazukommt</td></tr>
<tr><td>Vier Leerzeichen einrücken, keine Tabulatoren</td><td>Einheitliche Darstellung in jedem Editor</td></tr>
<tr><td>Öffnende Klammer in derselben Zeile</td><td>Bei <code>if</code> und <code>foreach</code> zwingend, sonst gilt der Block als eigenständiger Ausdruck</td></tr>
<tr><td>PascalCase für Parameter und Funktionen</td><td><code>$MaxAnzahl</code>, <code>Get-BenutzerListe</code></td></tr>
<tr><td>Sprechende Variablennamen</td><td><code>$inaktiveKonten</code> statt <code>$x</code> oder <code>$temp</code></td></tr>
<tr><td>Kein Gravis-Zeichen zum Umbrechen</td><td>Ein unsichtbares Leerzeichen dahinter bricht das Skript. Stattdessen nach Pipe, Komma oder im Splatting umbrechen</td></tr>
<tr><td>Nur genehmigte Verben</td><td><code>Get-Verb</code> liefert die Liste; fremde Verben lösen beim Modulimport eine Warnung aus</td></tr>
<tr><td>Eine Aufgabe je Funktion</td><td>Was mehr als einen Zweck hat, gehört aufgeteilt</td></tr>
<tr><td>Ausgabe per Write-Output</td><td><code>Write-Host</code> schreibt am Rückgabewert vorbei und lässt sich nicht weiterverarbeiten</td></tr>
</table></div>

<h3>Splatting statt endloser Zeilen</h3>
<x-term data-k="ps">
# Schwer lesbar und kaum erweiterbar
New-ADUser -Name "Anna Berger" -GivenName Anna -Surname Berger -SamAccountName a.berger -UserPrincipalName a.berger@firma.local -Path "OU=Vertrieb,DC=firma,DC=local" -Enabled $true

# Splatting: übersichtlich, und Parameter lassen sich bedingt ergänzen
$neuerBenutzer = @{
    Name              = 'Anna Berger'
    GivenName         = 'Anna'
    Surname           = 'Berger'
    SamAccountName    = 'a.berger'
    UserPrincipalName = 'a.berger@firma.local'
    Path              = 'OU=Vertrieb,DC=firma,DC=local'
    Enabled           = $true
}
if ($Abteilung) { $neuerBenutzer.Department = $Abteilung }

New-ADUser @neuerBenutzer -ErrorAction Stop
</x-term>

<h3>Die drei Blöcke bei Pipeline-Eingabe</h3>
<p>Sobald ein Skript oder eine Funktion Objekte aus der Pipeline entgegennimmt, braucht es die Aufteilung. Ohne <code>process</code> verarbeitet die Funktion nur das letzte durchgereichte Objekt - ein Fehler, der lange unbemerkt bleibt, weil bei einem einzelnen Objekt alles stimmt.</p>
<x-term data-k="ps">
function Get-KontoBericht {
    [CmdletBinding()]
    param(
        [Parameter(Mandatory, ValueFromPipeline)]
        [string[]]$SamAccountName
    )

    begin {
        Import-Module ActiveDirectory
        $ergebnis = [System.Collections.Generic.List[object]]::new()
        Write-Verbose 'Start der Auswertung'
    }

    process {
        foreach ($konto in $SamAccountName) {
            try {
                $u = Get-ADUser $konto -Properties Department, LastLogonDate -ErrorAction Stop
                $ergebnis.Add([PSCustomObject]@{
                    Konto     = $u.SamAccountName
                    Name      = $u.Name
                    Abteilung = $u.Department
                    LetzteAnmeldung = $u.LastLogonDate
                })
            }
            catch {
                Write-Warning "Übersprungen: $konto"
            }
        }
    }

    end {
        Write-Verbose "$($ergebnis.Count) Konten ausgewertet"
        $ergebnis
    }
}
</x-term>
<div class="note warn"><b>Objekte zurückgeben, nicht Text</b>Eine Funktion sollte <code>[PSCustomObject]</code> ausgeben, nie fertig formatierten Text. Nur dann lässt sich das Ergebnis weiterfiltern, sortieren und exportieren. Die Formatierung ist Sache des Aufrufers - nicht der Funktion.</div>

<h3>Vor dem Ausliefern</h3>
<div class="tblwrap"><table>
<tr><th>Prüfung</th><th>Womit</th></tr>
<tr><td>Testlauf ohne Wirkung</td><td><code>-WhatIf</code> bei jedem ändernden Aufruf</td></tr>
<tr><td>Ausführlicher Durchlauf</td><td><code>-Verbose</code>, um die Zwischenschritte zu sehen</td></tr>
<tr><td>Stilprüfung</td><td><code>Invoke-ScriptAnalyzer -Path .\\skript.ps1</code> aus dem Modul PSScriptAnalyzer</td></tr>
<tr><td>Nachweis der Ausführung</td><td><code>Start-Transcript</code> bei Änderungen an Produktivsystemen</td></tr>
<tr><td>Rückgabewert für Aufrufer</td><td><code>exit 0</code> bei Erfolg, ein anderer Wert bei Fehlern - so kann eine Aufgabenplanung darauf reagieren</td></tr>
</table></div>
<div class="note stop"><b>Was niemals in ein Skript gehört</b>Kennwörter im Klartext, auch nicht in einer Variablen und erst recht nicht als Parameterstandard. Skripte landen in Sicherungen, Versionsverwaltungen und Ticketsystemen. Stattdessen <code>Get-Credential</code> abfragen, ein gruppenverwaltetes Dienstkonto verwenden oder die Anmeldedaten benutzergebunden verschlüsselt ablegen.</div>
`}

);

CHAPTERS.push(

{id:"ad-basis", grp:"Active Directory", nav:"Aufbau", title:"Was Active Directory eigentlich ist",
lede:"Ein Verzeichnisdienst ist eine Datenbank mit Netzwerkanschluss: Sie speichert, wer und was es im Netz gibt, und sie beantwortet die Frage, ob jemand hineindarf.",
html:`
<h3>Die Rollen im Überblick</h3>
<p>Active Directory ist ein Sammelbegriff. Gemeint ist meist AD DS, aber im Rollenkatalog von Windows Server stehen fünf Dienste nebeneinander:</p>
<div class="tblwrap"><table>
<tr><th>Kürzel</th><th>Name</th><th>Aufgabe</th></tr>
<tr><td><strong>AD DS</strong></td><td>Domain Services</td><td>Der Kern: Verzeichnisdatenbank, Anmeldung, Gruppenrichtlinien</td></tr>
<tr><td>AD CS</td><td>Certificate Services</td><td>Eigene Zertifizierungsstelle für die interne PKI</td></tr>
<tr><td>AD FS</td><td>Federation Services</td><td>Anmeldung an fremden Anwendungen ohne zweites Kennwort</td></tr>
<tr><td>AD LDS</td><td>Lightweight Directory Services</td><td>Schlankes Verzeichnis für Anwendungen, ohne Domänenfunktionen</td></tr>
<tr><td>AD RMS</td><td>Rights Management Services</td><td>Rechteschutz an Dokumenten selbst</td></tr>
</table></div>

<h3>Die logische Struktur</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.78rem;line-height:1.8;margin:0;overflow-x:auto;color:#cfe7ef">
GESAMTSTRUKTUR (Forest)  firma.local
  |   gemeinsames Schema, gemeinsamer globaler Katalog,
  |   automatische Vertrauensstellungen zwischen allen Domänen
  |
  +-- STRUKTUR / Tree  firma.local
  |     |
  |     +-- DOMÄNE  firma.local
  |     |     +-- OU=Abteilungen
  |     |     |     +-- OU=Vertrieb   -> GPO "Laufwerke Vertrieb"
  |     |     |     +-- OU=IT         -> GPO "Adminwerkzeuge"
  |     |     +-- OU=Clients
  |     |     +-- CN=Users   (Standardcontainer, KEINE OU!)
  |     |
  |     +-- UNTERDOMÄNE  berlin.firma.local
  |
  +-- zweite Struktur  andere-firma.local   (eigener Namensraum)
</pre>
</div>
<div class="note warn"><b>Container ist nicht gleich OU</b>Die vorgegebenen Behälter <code>CN=Users</code> und <code>CN=Computers</code> sind gewöhnliche Container, keine Organisationseinheiten. An sie lassen sich <strong>keine</strong> Gruppenrichtlinien binden. Deshalb gehört zu jeder sauberen Einrichtung eine eigene OU-Struktur und die Umleitung der Standardablage mit <code>redirusr</code> und <code>redircmp</code>.</div>

<h3>Domänencontroller und Datenbank</h3>
<ul>
<li>Ein <strong>Domänencontroller</strong> ist ein Windows Server mit der Rolle AD DS. Er beantwortet Anmeldungen und hält eine beschreibbare Kopie des Verzeichnisses.</li>
<li>Die Datenbank heißt <code>NTDS.dit</code> und liegt in <code>C:\\Windows\\NTDS</code>.</li>
<li><strong>SYSVOL</strong> ist eine Freigabe auf jedem DC und enthält Gruppenrichtlinienvorlagen und Anmeldeskripte. Sie wird per DFSR zwischen den DCs abgeglichen.</li>
<li>Ein <strong>RODC</strong> ist ein schreibgeschützter DC für unsichere Standorte - er speichert standardmäßig keine Kennwörter.</li>
