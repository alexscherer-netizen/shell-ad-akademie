<li><strong>Mindestens zwei DCs</strong> gehören zum Standard. Fällt der einzige aus, kann sich niemand mehr anmelden.</li>
</ul>

<h3>Das Schema</h3>
<p>Das Schema definiert, welche Objektklassen es gibt und welche Attribute sie haben dürfen. Es gilt für die gesamte Gesamtstruktur und lässt sich erweitern - aber nicht zurücknehmen. Deshalb ist eine Schemaerweiterung, wie sie etwa Exchange mitbringt, eine Entscheidung ohne Rückweg.</p>

<h3>Funktionsebenen</h3>
<p>Domänen- und Gesamtstrukturfunktionsebene bestimmen, welche Merkmale nutzbar sind und welche Betriebssystemversionen als DC erlaubt bleiben. Sie richten sich nach dem ältesten DC und lassen sich nur nach oben ändern.</p>
<x-term data-k="ps">
Get-ADDomain | Select-Object DNSRoot, DomainMode, PDCEmulator
Get-ADForest | Select-Object Name, ForestMode, SchemaMaster, GlobalCatalogs
</x-term>

<h3>Verwaltungswerkzeuge auf dem Arbeitsplatz</h3>
<p>Auf einem Client stehen die AD-Werkzeuge erst nach der Installation von RSAT zur Verfügung. Danach existieren sowohl die Konsolen als auch das PowerShell-Modul.</p>
<x-term data-k="ps">
# Verfügbare RSAT-Bestandteile anzeigen
Get-WindowsCapability -Online -Name RSAT*

# Nur die AD-Werkzeuge nachinstallieren
Add-WindowsCapability -Online -Name Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0

# Prüfen, ob das Modul da ist
Get-Module -ListAvailable ActiveDirectory
</x-term>
<div class="tblwrap"><table>
<tr><th>Konsole</th><th>Aufruf</th><th>Zweck</th></tr>
<tr><td>Benutzer und Computer</td><td><code>dsa.msc</code></td><td>Tägliche Objektverwaltung</td></tr>
<tr><td>Verwaltungscenter</td><td><code>dsac.exe</code></td><td>Modernere Oberfläche, Papierkorb, PowerShell-Verlauf</td></tr>
<tr><td>Standorte und Dienste</td><td><code>dssite.msc</code></td><td>Subnetze, Standorte, Replikation</td></tr>
<tr><td>Domänen und Vertrauensstellungen</td><td><code>domain.msc</code></td><td>Trusts, Funktionsebenen</td></tr>
<tr><td>Gruppenrichtlinienverwaltung</td><td><code>gpmc.msc</code></td><td>GPOs, Vererbung, Modellierung</td></tr>
<tr><td>Attribut-Editor</td><td><code>adsiedit.msc</code></td><td>Rohzugriff auf Attribute - mit Vorsicht</td></tr>
</table></div>
`},

{id:"ad-objekte", grp:"Active Directory", nav:"Objekte &amp; Gruppen", title:"Benutzer, Gruppen und Berechtigungen",
lede:"Jedes Objekt hat einen eindeutigen Namen, eine unveränderliche SID und einen Platz in der Struktur. Wer diese drei Dinge auseinanderhält, versteht auch AGDLP.",
html:`
<h3>Namen und Kennungen</h3>
<div class="tblwrap"><table>
<tr><th>Bezeichnung</th><th>Beispiel</th><th>Eigenschaft</th></tr>
<tr><td>Distinguished Name (DN)</td><td><code>CN=Max Mustermann,OU=Vertrieb,DC=firma,DC=local</code></td><td>Eindeutiger Pfad, ändert sich beim Verschieben</td></tr>
<tr><td>sAMAccountName</td><td><code>m.mustermann</code></td><td>Klassischer Anmeldename, maximal 20 Zeichen</td></tr>
<tr><td>UserPrincipalName (UPN)</td><td><code>m.mustermann@firma.local</code></td><td>Moderner Anmeldename im Mailformat</td></tr>
<tr><td>SID</td><td><code>S-1-5-21-...-1108</code></td><td>Unveränderlich, daran hängen alle Berechtigungen</td></tr>
<tr><td>GUID</td><td><code>objectGUID</code></td><td>Weltweit eindeutig, bleibt über alle Umzüge hinweg gleich</td></tr>
</table></div>
<div class="note"><b>Warum die SID so wichtig ist</b>NTFS-Berechtigungen speichern keine Namen, sondern SIDs. Ein gelöschtes und namensgleich neu angelegtes Konto bekommt eine neue SID - und verliert damit sämtliche Zugriffe. Deshalb gilt beim Austritt eines Mitarbeiters: deaktivieren, nicht löschen. Das Konto lässt sich später einem Nachfolger zuweisen oder sauber archivieren.</div>

<h3>Gruppentypen und Gültigkeitsbereiche</h3>
<p>Zwei Merkmale werden häufig verwechselt. Der <strong>Typ</strong> entscheidet, ob die Gruppe Rechte vergeben kann. Der <strong>Bereich</strong> entscheidet, wer Mitglied sein darf und wo die Gruppe verwendbar ist.</p>
<div class="tblwrap"><table>
<tr><th>Bereich</th><th>Mitglieder aus</th><th>Verwendbar in</th></tr>
<tr><td>Lokal in Domäne</td><td>Gesamter Gesamtstruktur</td><td>Nur in der eigenen Domäne - typisch für Ressourcenrechte</td></tr>
<tr><td>Global</td><td>Nur eigene Domäne</td><td>Gesamte Gesamtstruktur - typisch für Rollen und Abteilungen</td></tr>
<tr><td>Universal</td><td>Gesamter Gesamtstruktur</td><td>Gesamte Gesamtstruktur - Mitgliedschaften liegen im globalen Katalog</td></tr>
</table></div>
<ul>
<li><strong>Sicherheitsgruppe:</strong> bekommt eine SID, kann in Berechtigungen stehen.</li>
<li><strong>Verteilergruppe:</strong> dient ausschließlich als E-Mail-Verteiler. Sie ist kein Sicherheitsprinzipal, taucht deshalb nicht im Zugriffstoken auf und kann <em>keine</em> Berechtigungen erhalten.</li>
</ul>

<h3>AGDLP - das Berechtigungsmuster</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.8rem;line-height:1.85;margin:0;overflow-x:auto;color:#cfe7ef">
 A ccount          Max Mustermann
    |  kommt in
 G lobal Group     G-Vertrieb            (die Rolle: "wer ist das")
    |  wird Mitglied von
 D omain L ocal    FS-Vertrieb-Aendern   (die Ressource: "worauf")
    |  erhält
 P ermission       NTFS: Ändern auf D:\\Daten\\Vertrieb
</pre>
</div>
<p>Der Sinn dahinter: Auf dem Ordner steht nur <em>eine</em> Berechtigung, die sich nie mehr ändert. Wer künftig Zugriff bekommt, wird in die globale Gruppe aufgenommen - am Dateisystem muss niemand mehr etwas anfassen. In Gesamtstrukturen mit mehreren Domänen kommt eine universelle Gruppe dazwischen, daraus wird AGUDLP.</p>
<x-term data-k="ps">
# Die beiden Gruppen anlegen
New-ADGroup -Name "G-Vertrieb"          -GroupScope Global      -GroupCategory Security -Path "OU=Gruppen,DC=firma,DC=local"
New-ADGroup -Name "FS-Vertrieb-Aendern" -GroupScope DomainLocal -GroupCategory Security -Path "OU=Gruppen,DC=firma,DC=local"

# Verschachteln und Benutzer aufnehmen
Add-ADGroupMember "FS-Vertrieb-Aendern" -Members "G-Vertrieb"
Add-ADGroupMember "G-Vertrieb"          -Members m.mustermann

# Prüfen, wer am Ende tatsächlich berechtigt ist
Get-ADGroupMember "FS-Vertrieb-Aendern" -Recursive | Select-Object Name, objectClass
</x-term>
<x-term data-k="cmd">
:: Die Ressourcengruppe auf den Ordner berechtigen
icacls D:\\Daten\\Vertrieb /grant "FIRMA\\FS-Vertrieb-Aendern":(OI)(CI)M /t
</x-term>

<h3>NTFS und Freigabe greifen zusammen</h3>
<p>Bei einem Netzwerkzugriff gelten beide Berechtigungsebenen. Das Ergebnis ist immer die <strong>restriktivere</strong> der beiden. Lokal am Rechner zählt dagegen nur NTFS.</p>
<div class="tblwrap"><table>
<tr><th>Freigabe</th><th>NTFS</th><th>Effektiv über das Netz</th></tr>
<tr><td>Vollzugriff</td><td>Lesen</td><td>Lesen</td></tr>
<tr><td>Lesen</td><td>Vollzugriff</td><td>Lesen</td></tr>
<tr><td>Ändern</td><td>Ändern</td><td>Ändern</td></tr>
</table></div>
<p>Die verbreitete Praxis: Auf der Freigabe wird großzügig berechtigt, die Feinsteuerung passiert vollständig über NTFS. Ein ausdrückliches Verweigern schlägt übrigens jedes Erlauben - auch das aus einer anderen Gruppe.</p>

<h3>Wichtige Benutzerattribute</h3>
<div class="tblwrap"><table>
<tr><th>Attribut</th><th>Bedeutung</th></tr>
<tr><td><code>userAccountControl</code></td><td>Bitfeld: aktiviert, Kennwort läuft nie ab, Smartcard erforderlich</td></tr>
<tr><td><code>pwdLastSet</code></td><td>Zeitpunkt der letzten Kennwortänderung</td></tr>
<tr><td><code>lastLogonTimestamp</code></td><td>Letzte Anmeldung, wird nur alle 9 bis 14 Tage repliziert</td></tr>
<tr><td><code>lockoutTime</code></td><td>Zeitpunkt der Sperrung</td></tr>
<tr><td><code>memberOf</code></td><td>Gruppenmitgliedschaften, ohne die primäre Gruppe</td></tr>
<tr><td><code>proxyAddresses</code></td><td>Alle E-Mail-Adressen, von Exchange genutzt</td></tr>
<tr><td><code>manager</code></td><td>Vorgesetzter als DN - Basis für Organigramme</td></tr>
</table></div>
<div class="note warn"><b>Achtung bei lastLogon</b><code>lastLogon</code> wird gar nicht repliziert und ist auf jedem DC unterschiedlich. Verwertbar ist nur <code>lastLogonTimestamp</code> beziehungsweise die davon abgeleitete Eigenschaft <code>LastLogonDate</code> - und selbst die ist bis zu zwei Wochen ungenau.</div>
`},

{id:"ad-technik", grp:"Active Directory", nav:"Technik darunter", title:"DNS, Kerberos, Ports und Replikation",
lede:"Fast jede AD-Störung lässt sich auf drei Ursachen zurückführen: falsches DNS, abweichende Uhrzeit oder blockierte Ports. Diese Seite erklärt, warum.",
html:`
<h3>Ohne DNS kein Active Directory</h3>
<p>Ein Client weiß nicht, wo sein Domänencontroller steht. Er fragt DNS - genauer gesagt nach SRV-Einträgen unterhalb von <code>_msdcs</code>. Zeigt ein Mitgliedsrechner auf einen öffentlichen DNS-Server statt auf den internen, findet er den DC nicht und die Anmeldung an der Domäne scheitert, obwohl das Internet funktioniert.</p>
<x-term data-k="cmd">
:: Welche Domänencontroller kennt das DNS?
nslookup -type=SRV _ldap._tcp.dc._msdcs.firma.local

:: Welchen DC benutzt dieser Rechner gerade?
nltest /dsgetdc:firma.local
echo %LOGONSERVER%
</x-term>
<x-term data-k="ps">
Resolve-DnsName _ldap._tcp.dc._msdcs.firma.local -Type SRV
Get-DnsClientServerAddress -AddressFamily IPv4
</x-term>

<h3>Kerberos und die Uhrzeit</h3>
<p>Die Anmeldung läuft über Kerberos. Der DC ist gleichzeitig Schlüsselverteilungscenter: Er stellt beim Anmelden ein Ticket-Granting-Ticket aus, mit dem der Client später Diensttickets für Dateiserver und Anwendungen abholt.</p>
<ul>
<li>Kerberos-Tickets enthalten einen Zeitstempel. Weicht die Uhr um mehr als <strong>5 Minuten</strong> ab, wird das Ticket abgelehnt.</li>
<li>Die Zeitquelle der Domäne ist der <strong>PDC-Emulator</strong> der Stammdomäne. Alle anderen DCs und alle Clients richten sich daran aus.</li>
<li>Das Ticket enthält die Gruppenmitgliedschaften. Deshalb wirken neue Gruppen erst nach einer neuen Anmeldung.</li>
<li>NTLM existiert noch als Rückfallebene, gilt aber als veraltet und wird schrittweise zurückgedrängt.</li>
</ul>
<x-term data-k="cmd">
w32tm /query /status
w32tm /resync /force
klist
klist purge
</x-term>

<h3>Die Ports, die man kennen muss</h3>
<div class="tblwrap"><table>
<tr><th>Port</th><th>Protokoll</th><th>Wofür</th></tr>
<tr><td>53</td><td>DNS (TCP/UDP)</td><td>Auffinden der Domänencontroller</td></tr>
<tr><td>88</td><td>Kerberos</td><td>Authentifizierung</td></tr>
<tr><td>135</td><td>RPC Endpoint Mapper</td><td>Replikation, Verwaltungswerkzeuge</td></tr>
<tr><td>389</td><td>LDAP</td><td>Verzeichnisabfragen im Klartext bzw. signiert</td></tr>
<tr><td>636</td><td>LDAPS</td><td>LDAP über TLS</td></tr>
<tr><td>445</td><td>SMB</td><td>SYSVOL, Gruppenrichtlinien, Dateifreigaben</td></tr>
<tr><td>464</td><td>kpasswd</td><td>Kennwortänderungen</td></tr>
<tr><td>3268 / 3269</td><td>Globaler Katalog</td><td>Gesamtstrukturweite Suche, mit und ohne TLS</td></tr>
<tr><td>5985 / 5986</td><td>WinRM</td><td>PowerShell-Remoting über HTTP bzw. HTTPS</td></tr>
<tr><td>9389</td><td>ADWS</td><td>Active Directory Web Services - Basis des PowerShell-Moduls</td></tr>
</table></div>
<x-term data-k="ps">
389,636,88,445,9389 | ForEach-Object {
    Test-NetConnection dc01 -Port $_ |
        Select-Object @{n='Port';e={$_.RemotePort}}, TcpTestSucceeded
}
</x-term>

<h3>Die fünf FSMO-Rollen</h3>
<p>Manche Aufgaben verträgt kein verteiltes System. Sie liegen deshalb bei genau einem DC.</p>
<div class="tblwrap"><table>
<tr><th>Rolle</th><th>Ebene</th><th>Aufgabe</th><th>Wenn sie ausfällt</th></tr>
<tr><td>Schemamaster</td><td>Gesamtstruktur</td><td>Einzige Stelle für Schemaänderungen</td><td>Nur bei Schemaerweiterungen spürbar</td></tr>
<tr><td>Domänennamenmaster</td><td>Gesamtstruktur</td><td>Hinzufügen und Entfernen von Domänen</td><td>Nur bei Strukturänderungen spürbar</td></tr>
<tr><td>RID-Master</td><td>Domäne</td><td>Verteilt Blöcke relativer Kennungen für neue SIDs</td><td>Irgendwann lassen sich keine neuen Objekte mehr anlegen</td></tr>
<tr><td>PDC-Emulator</td><td>Domäne</td><td>Zeitquelle, Kennwortänderungen, Kontosperrungen, GPO-Bearbeitung</td><td>Sofort spürbar: Anmeldeprobleme, Zeitabweichung</td></tr>
<tr><td>Infrastrukturmaster</td><td>Domäne</td><td>Pflegt Verweise auf Objekte anderer Domänen</td><td>Nur in Umgebungen mit mehreren Domänen relevant</td></tr>
</table></div>
<x-term data-k="cmd">
netdom query fsmo
</x-term>
<x-term data-k="ps">
Get-ADForest | Select-Object SchemaMaster, DomainNamingMaster
Get-ADDomain | Select-Object PDCEmulator, RIDMaster, InfrastructureMaster
</x-term>
<div class="note warn"><b>Übertragen oder entreißen</b>Solange beide DCs erreichbar sind, wird eine Rolle sauber <em>übertragen</em> (transfer). Ist der Rolleninhaber endgültig verloren, wird sie <em>entrissen</em> (seize) - danach darf der alte DC nie wieder ins Netz, sonst entsteht ein Konflikt.</div>

<h3>Globaler Katalog</h3>
<p>Ein globaler Katalog enthält alle Objekte der gesamten Gesamtstruktur, aber nur mit einer Teilmenge der Attribute. Er beantwortet strukturweite Suchen und wird bei der Anmeldung gebraucht, um universelle Gruppen aufzulösen. In Umgebungen mit mehreren Standorten gehört an jeden Standort mindestens einer.</p>

<h3>Replikation</h3>
<ul>
<li><strong>Innerhalb eines Standorts</strong> wird nahezu sofort repliziert, unkomprimiert, angestoßen durch Änderungsbenachrichtigungen.</li>
<li><strong>Zwischen Standorten</strong> läuft die Replikation nach Zeitplan und komprimiert - üblich sind 180 Minuten.</li>
<li>Kritische Änderungen wie Kontosperrungen werden <strong>dringend</strong> repliziert und warten nicht auf den Zeitplan.</li>
<li>Der Knowledge Consistency Checker baut die Replikationstopologie automatisch auf.</li>
</ul>
<x-term data-k="cmd">
repadmin /replsummary
repadmin /showrepl dc02
dcdiag /test:replications
</x-term>
<p>Wenn ein frisch zurückgesetztes Kennwort auf einem Rechner funktioniert und auf einem anderen nicht, lohnt fast immer ein Blick hierher - der zweite Rechner hat einen anderen DC erwischt.</p>
`},

{id:"ad-gpo", grp:"Active Directory", nav:"Gruppenrichtlinien", title:"Gruppenrichtlinien",
lede:"Mit GPOs wird zentral festgelegt, wie Rechner und Benutzer sich verhalten. Die Kunst liegt weniger in den Einstellungen als in der Frage, welches Objekt am Ende gewinnt.",
html:`
<h3>Aufbau eines GPO</h3>
<p>Ein Gruppenrichtlinienobjekt besteht aus zwei Teilen: dem Container im Verzeichnis und der Vorlage im SYSVOL. Es enthält zwei Konfigurationszweige:</p>
<ul>
<li><strong>Computerkonfiguration</strong> - wird beim Systemstart angewendet und gilt für den Rechner, unabhängig davon, wer sich anmeldet.</li>
<li><strong>Benutzerkonfiguration</strong> - wird bei der Anmeldung angewendet und folgt dem Benutzer auf jeden Rechner.</li>
</ul>
<p>Verknüpft wird ein GPO mit einem Standort, einer Domäne oder einer OU - niemals mit einer Gruppe. Gruppen kommen nur in der Sicherheitsfilterung ins Spiel.</p>

<h3>Die Verarbeitungsreihenfolge: LSDOU</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.82rem;line-height:1.9;margin:0;overflow-x:auto;color:#cfe7ef">
 L  Lokale Richtlinie        zuerst
 S  Standort (Site)
 D  Domäne
 O  OU                       von oben nach unten
 U  untergeordnete OU        zuletzt - und gewinnt damit
</pre>
</div>
<p>Wer zuletzt schreibt, gewinnt. Widersprechen sich zwei Einstellungen, setzt sich also die am tiefsten verknüpfte durch. Innerhalb derselben Ebene entscheidet die Verknüpfungsreihenfolge - dort gewinnt die <strong>niedrigste</strong> Nummer.</p>
<div class="tblwrap"><table>
<tr><th>Sonderfall</th><th>Wirkung</th></tr>
<tr><td>Vererbung deaktivieren</td><td>An einer OU werden alle Richtlinien von oben ignoriert</td></tr>
<tr><td>Erzwungen (Enforced)</td><td>Schlägt die Blockade und kehrt die Reihenfolge um - das erzwungene GPO gewinnt gegen alles Tiefere</td></tr>
<tr><td>Sicherheitsfilterung</td><td>GPO gilt nur für bestimmte Gruppen, erfordert das Recht "Gruppenrichtlinie übernehmen"</td></tr>
<tr><td>WMI-Filter</td><td>GPO gilt nur, wenn eine Abfrage zutrifft, etwa nur auf Notebooks</td></tr>
<tr><td>Loopbackverarbeitung</td><td>Benutzereinstellungen richten sich nach dem Rechner statt nach dem Benutzer - typisch für Terminalserver und Kioskrechner</td></tr>
</table></div>

<h3>Wann Richtlinien greifen</h3>
<ul>
<li>Computerrichtlinien beim Start, Benutzerrichtlinien bei der Anmeldung.</li>
<li>Im laufenden Betrieb alle <strong>90 Minuten</strong> plus einem Zufallswert von bis zu 30 Minuten, damit nicht alle Clients gleichzeitig anfragen.</li>
<li>Auf Domänencontrollern alle 5 Minuten.</li>
<li>Manche Erweiterungen - etwa Softwareinstallation, Ordnerumleitung oder Laufwerkszuordnung - greifen nur beim Start oder bei der Anmeldung. Deshalb reicht <code>gpupdate /force</code> nicht immer aus.</li>
</ul>
<x-term data-k="cmd">
gpupdate /force
gpupdate /target:user /force /logoff

:: Der wichtigste Diagnosebefehl überhaupt
gpresult /h C:\\gpo-bericht.html /f
gpresult /r /scope:computer
</x-term>
<x-term data-k="ps">
# Bericht für eine Kombination aus Benutzer und Rechner
Get-GPResultantSetOfPolicy -User FIRMA\\m.mustermann -Computer PC-042 -ReportType Html -Path C:\\rsop.html

# Richtlinien im ganzen Netz aktualisieren
Get-ADComputer -Filter "OperatingSystem -like '*Windows 1*'" |
    ForEach-Object { Invoke-GPUpdate -Computer $_.Name -Force -RandomDelayInMinutes 5 }

# GPOs sichern - die einzige eingebaute Versionierung
Backup-GPO -All -Path C:\\GPO-Backup
</x-term>

<h3>Häufige Störungsbilder</h3>
<div class="tblwrap"><table>
<tr><th>Symptom</th><th>Wahrscheinliche Ursache</th><th>Prüfen mit</th></tr>
<tr><td>GPO wirkt gar nicht</td><td>Objekt liegt in <code>CN=Users</code> statt in einer OU</td><td><code>Get-ADUser x -Properties DistinguishedName</code></td></tr>
<tr><td>GPO wirkt bei einem Benutzer nicht</td><td>Sicherheitsfilterung schließt ihn aus</td><td><code>gpresult /r</code> - Abschnitt "Herausgefilterte GPOs"</td></tr>
<tr><td>Falsche Einstellung gewinnt</td><td>Tiefere OU oder ein erzwungenes GPO überschreibt</td><td>RSoP-Bericht in der GPMC</td></tr>
<tr><td>Laufwerk fehlt</td><td>Einstellung wirkt nur bei der Anmeldung</td><td>Ab- und wieder anmelden, dann <code>net use</code></td></tr>
<tr><td>Nichts kommt an</td><td>SYSVOL nicht erreichbar oder Replikation gestört</td><td><code>dcdiag /test:sysvolcheck</code>, <code>repadmin /replsummary</code></td></tr>
</table></div>
`},

{id:"sicherheit", grp:"Anwenden", nav:"Sicherheit &amp; Rechte", title:"Sicherheit im Alltagsbetrieb",
lede:"Die meisten Sicherheitsvorfälle in Firmennetzen beginnen nicht mit einem raffinierten Angriff, sondern mit einem zu weitreichenden Konto, einem Kennwort im Skript und einem Protokoll, in das nie jemand geschaut hat.",
html:`
<h3>Das Prinzip der geringsten Rechte</h3>
<p>Jedes Konto bekommt genau die Rechte, die es für seine Aufgabe braucht - nicht mehr, und nicht auf Vorrat. In der Praxis heißt das vor allem: getrennte Konten für getrennte Aufgaben.</p>
<div class="tblwrap"><table>
<tr><th>Konto</th><th>Zweck</th><th>Womit angemeldet</th></tr>
<tr><td><code>m.mustermann</code></td><td>Tägliche Arbeit: Mail, Dokumente, Internet</td><td>Am eigenen Arbeitsplatz</td></tr>
<tr><td><code>adm.mustermann</code></td><td>Serververwaltung</td><td>Nur über <code>runas</code> oder eine Verwaltungssitzung</td></tr>
<tr><td><code>da.mustermann</code></td><td>Domänenverwaltung</td><td>Nur an einem gesonderten Verwaltungsrechner</td></tr>
</table></div>
<p>Der Grund ist nüchtern: Wer mit einem Domänenadministrator-Konto im Internet surft oder eine Mail öffnet, gibt einem Schadprogramm im selben Moment die gesamte Domäne. Genau deshalb sollte sich ein Domänenadmin niemals an einem normalen Arbeitsplatz anmelden - seine Anmeldedaten bleiben sonst auf diesem Rechner angreifbar zurück.</p>
<x-term data-k="cmd">
:: Verwaltungskonsole mit dem Adminkonto starten, ohne sich abzumelden
runas /user:FIRMA\\adm.mustermann "mmc dsa.msc"
</x-term>
<x-term data-k="ps">
# Erhöhte PowerShell starten
Start-Process powershell -Verb RunAs

# Prüfen, ob die aktuelle Sitzung erhöht läuft
([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
    [Security.Principal.WindowsBuiltInRole]::Administrator)
</x-term>

<h3>Die Gruppen, die man im Blick behalten muss</h3>
<div class="tblwrap"><table>
<tr><th>Gruppe</th><th>Reichweite</th><th>Anmerkung</th></tr>
<tr><td>Schema-Admins</td><td>Gesamtstruktur</td><td>Sollte im Normalbetrieb leer sein - nur für Schemaerweiterungen befüllen</td></tr>
<tr><td>Organisations-Admins</td><td>Gesamtstruktur</td><td>Nur das eingebaute Administratorkonto der Stammdomäne gehört hier hinein</td></tr>
<tr><td>Domänen-Admins</td><td>Domäne</td><td>Die kleinste vertretbare Anzahl, jedes Mitglied namentlich begründet</td></tr>
<tr><td>Administratoren</td><td>Domäne</td><td>Enthält die beiden vorigen - wird beim Prüfen gern übersehen</td></tr>
<tr><td>Konten-Operatoren</td><td>Domäne</td><td>Gilt als kritisch, weil Mitglieder Konten verändern können. Besser leer lassen und stattdessen delegieren</td></tr>
<tr><td>Geschützte Benutzer</td><td>Domäne</td><td>Schutzgruppe: Mitglieder können nur Kerberos nutzen, ihre Anmeldedaten werden nicht zwischengespeichert</td></tr>
</table></div>
<x-term data-k="ps">
# Wer steckt tatsächlich in den privilegierten Gruppen, auch verschachtelt?
'Schema-Admins','Organisations-Admins','Domänen-Admins','Administratoren' | ForEach-Object {
    $gruppe = $_
    Get-ADGroupMember $gruppe -Recursive -ErrorAction SilentlyContinue |
        Select-Object @{n='Gruppe'; e={$gruppe}}, Name, SamAccountName, objectClass
}
</x-term>
<div class="note"><b>Delegieren statt befördern</b>Wenn der Helpdesk nur Kennwörter zurücksetzen und Konten entsperren soll, gehört er nicht in die Domänen-Admins. In der Verwaltungskonsole übernimmt das der Assistent zum Zuweisen der Objektverwaltung, gebunden an eine OU und eine einzige Aufgabe. Das ist der eigentliche Zweck der OU-Struktur.</div>

<h3>Anmeldedaten in Skripten</h3>
<x-term data-k="ps">
# Richtig: abfragen und nur im Arbeitsspeicher halten
$cred = Get-Credential FIRMA\\adm.mustermann
Get-ADUser -Filter * -Credential $cred

# Für wiederkehrende Aufgaben: benutzer- und rechnergebunden verschlüsselt ablegen
$cred | Export-Clixml -Path C:\\Skripte\\dienst.cred.xml
$cred = Import-Clixml -Path C:\\Skripte\\dienst.cred.xml
</x-term>
<p>Die Datei aus <code>Export-Clixml</code> ist über die Windows-Datenschutz-API an <em>genau dieses</em> Benutzerkonto auf <em>genau diesem</em> Rechner gebunden. Kopiert jemand sie weg, ist sie wertlos. Das ist kein Ersatz für ein Kennworttresorsystem, aber deutlich besser als Klartext - und für geplante Aufgaben oft die praktikabelste Lösung.</p>
<div class="note stop"><b>Was trotzdem falsch bleibt</b>Ein SecureString schützt nicht vor jemandem, der den Code liest: <code>ConvertTo-SecureString 'Sommer2026!' -AsPlainText -Force</code> steht genauso im Klartext in der Datei wie vorher. Die saubere Lösung für Dienste ist ein gruppenverwaltetes Dienstkonto - dort verwaltet Active Directory das Kennwort selbst und wechselt es automatisch.</div>
<x-term data-k="ps">
# Gruppenverwaltetes Dienstkonto einrichten und prüfen
New-ADServiceAccount -Name gmsa-backup -DNSHostName gmsa-backup.firma.local -PrincipalsAllowedToRetrieveManagedPassword 'G-Backupserver'
Install-ADServiceAccount -Identity gmsa-backup
Test-ADServiceAccount -Identity gmsa-backup
</x-term>

<h3>Nachvollziehbarkeit: die Ereignis-IDs, die zählen</h3>
<div class="tblwrap"><table>
<tr><th>ID</th><th>Bedeutung</th><th>Wofür man sie braucht</th></tr>
<tr><td>4624</td><td>Anmeldung erfolgreich</td><td>Wer war wann auf welchem System - der Anmeldetyp verrät, ob lokal, über Netz oder per RDP</td></tr>
<tr><td>4625</td><td>Anmeldung fehlgeschlagen</td><td>Häufung deutet auf falsch gespeicherte Kennwörter oder einen Angriffsversuch</td></tr>
<tr><td>4634 / 4647</td><td>Abmeldung</td><td>Sitzungsdauer nachvollziehen</td></tr>
<tr><td>4648</td><td>Anmeldung mit ausdrücklichen Anmeldedaten</td><td>Zeigt <code>runas</code>-Vorgänge und damit Rechteausweitung</td></tr>
<tr><td>4720</td><td>Benutzerkonto erstellt</td><td>Unerwartete neue Konten sind ein Alarmzeichen</td></tr>
<tr><td>4726</td><td>Benutzerkonto gelöscht</td><td>Nachvollzug beim Austrittsprozess</td></tr>
<tr><td>4728 / 4732 / 4756</td><td>Mitglied zu globaler, lokaler bzw. universeller Gruppe hinzugefügt</td><td>Die wichtigste Meldung überhaupt bei privilegierten Gruppen</td></tr>
<tr><td>4740</td><td>Konto gesperrt</td><td>Ausgangspunkt jeder Sperrungsanalyse - steht auf dem PDC-Emulator</td></tr>
<tr><td>4768 / 4769 / 4771</td><td>Kerberos: TGT angefordert, Ticket angefordert, Vorauthentifizierung fehlgeschlagen</td><td>4771 zeigt falsche Kennwörter auf Domänenebene</td></tr>
<tr><td>1102</td><td>Sicherheitsprotokoll geleert</td><td>Passiert im Normalbetrieb nie und gehört immer geprüft</td></tr>
</table></div>
<x-term data-k="ps">
# Fehlgeschlagene Anmeldungen des letzten Tages, nach Konto gezählt
Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddDays(-1)} |
    ForEach-Object { $_.Properties[5].Value } |
    Group-Object | Sort-Object Count -Descending | Select-Object Count, Name

# Wo wurde ein Konto gesperrt? Auf dem PDC-Emulator nachsehen.
$pdc = (Get-ADDomain).PDCEmulator
Get-WinEvent -ComputerName $pdc -FilterHashtable @{LogName='Security'; Id=4740} -MaxEvents 20 |
    Select-Object TimeCreated, @{n='Konto'; e={$_.Properties[0].Value}}, @{n='Quelle'; e={$_.Properties[1].Value}}
</x-term>

<h3>PowerShell selbst protokollieren</h3>
<p>Drei Einstellungen, die per Gruppenrichtlinie ausgerollt werden und im Ernstfall den Unterschied machen:</p>
<div class="tblwrap"><table>
<tr><th>Einstellung</th><th>Was aufgezeichnet wird</th><th>Ereignis-ID</th></tr>
<tr><td>Skriptblockprotokollierung</td><td>Der tatsächlich ausgeführte Code, auch wenn er verschleiert war</td><td>4104</td></tr>
<tr><td>Modulprotokollierung</td><td>Aufgerufene Befehle samt Parametern</td><td>4103</td></tr>
<tr><td>Transkription</td><td>Vollständiger Mitschnitt jeder Sitzung in Textdateien</td><td>-</td></tr>
</table></div>
<x-term data-k="ps">
# Für die eigene Arbeit an einem Produktivsystem: immer mitschneiden
Start-Transcript -Path "C:\\Protokoll\\$env:USERNAME-$(Get-Date -f yyyyMMdd-HHmm).txt"
# ... Änderungen ...
Stop-Transcript
</x-term>

<h3>Härtung, die schnell erledigt ist</h3>
<div class="tblwrap"><table>
<tr><th>Maßnahme</th><th>Warum</th><th>Prüfen mit</th></tr>
<tr><td>SMBv1 entfernen</td><td>Veraltet, unverschlüsselt, Einfallstor bekannter Schadsoftware</td><td><code>Get-SmbServerConfiguration | Select EnableSMB1Protocol</code></td></tr>
<tr><td>AD-Papierkorb aktivieren</td><td>Macht versehentliches Löschen rückholbar - nicht umkehrbar, aber ohne Nachteil</td><td><code>Get-ADOptionalFeature -Filter *</code></td></tr>
<tr><td>Löschschutz an OUs</td><td>Verhindert, dass eine ganze Abteilung mit einem Klick verschwindet</td><td>Attribut <code>ProtectedFromAccidentalDeletion</code></td></tr>

{id:"praxis", grp:"Anwenden", nav:"Praxisszenarien", title:"Vier Abläufe von Anfang bis Ende",
lede:"Jetzt greifen die drei Welten ineinander. Diese Abläufe entsprechen dem, was im ersten Jahr im Betrieb tatsächlich auf dem Tisch landet.",
html:`
<h3>1. Neuer Mitarbeiter, vollständig eingerichtet</h3>
<x-term data-k="ps">
Import-Module ActiveDirectory

$vorname = 'Anna'; $nachname = 'Berger'
$sam     = 'a.berger'
$ou      = 'OU=Vertrieb,OU=Abteilungen,DC=firma,DC=local'

New-ADUser -Name "$vorname $nachname" -GivenName $vorname -Surname $nachname &#96;
    -DisplayName "$nachname, $vorname" -SamAccountName $sam &#96;
    -UserPrincipalName "$sam@firma.local" -Path $ou &#96;
    -AccountPassword (Read-Host 'Startkennwort' -AsSecureString) &#96;
    -ChangePasswordAtLogon $true -Enabled $true &#96;
    -Department 'Vertrieb' -Title 'Sachbearbeiterin' -Office 'Berlin'

Add-ADGroupMember 'G-Vertrieb' -Members $sam
Add-ADGroupMember 'G-Drucker-EG' -Members $sam

# Kontrolle
Get-ADUser $sam -Properties Department,Title,MemberOf |
    Select-Object Name,Department,Title,@{n='Gruppen';e={($_.MemberOf | ForEach-Object {($_ -split ',')[0] -replace 'CN='}) -join ', '}}
</x-term>

<h3>2. Zwanzig Konten aus einer Tabelle anlegen</h3>
<p>Die CSV enthält die Spalten <code>Vorname;Nachname;Kuerzel;Abteilung</code>. Erst ein Testlauf, dann der Ernstfall.</p>
<x-term data-k="ps">
$start = Read-Host 'Startkennwort' -AsSecureString

Import-Csv C:\\neu.csv -Delimiter ';' -Encoding UTF8 | ForEach-Object {
    $params = @{
        Name              = "$($_.Vorname) $($_.Nachname)"
        GivenName         = $_.Vorname
        Surname           = $_.Nachname
        SamAccountName    = $_.Kuerzel
        UserPrincipalName = "$($_.Kuerzel)@firma.local"
        Department        = $_.Abteilung
        Path              = "OU=$($_.Abteilung),OU=Abteilungen,DC=firma,DC=local"
        AccountPassword   = $start
        ChangePasswordAtLogon = $true
        Enabled           = $true
    }
    try   { New-ADUser @params -ErrorAction Stop; Write-Host "OK  $($_.Kuerzel)" -ForegroundColor Green }
    catch { Write-Warning "FEHLER $($_.Kuerzel): $($_.Exception.Message)" }
}
</x-term>
<p>Die Technik mit der Hashtabelle heißt Splatting. Sie hält lange Befehle lesbar und erlaubt es, Parameter abhängig von Bedingungen zu setzen.</p>

<h3>3. Störung: Benutzer kommt nicht mehr auf sein Laufwerk</h3>
<div class="tblwrap"><table>
<tr><th>Schritt</th><th>Befehl</th><th>Was die Antwort bedeutet</th></tr>
<tr><td>1. Konto gesperrt?</td><td><code>Search-ADAccount -LockedOut</code></td><td>Treffer: entsperren mit <code>Unlock-ADAccount</code></td></tr>
<tr><td>2. Konto aktiv?</td><td><code>Get-ADUser a.berger -Properties Enabled,LockedOut</code></td><td>Enabled False: der Austrittsprozess hat zugeschlagen</td></tr>
<tr><td>3. Gruppe vorhanden?</td><td><code>Get-ADPrincipalGroupMembership a.berger</code></td><td>Fehlt die Gruppe, hier ergänzen</td></tr>
<tr><td>4. Im Token angekommen?</td><td><code>whoami /groups</code> am Client</td><td>Fehlt sie hier trotz AD-Eintrag: neu anmelden oder <code>klist purge</code></td></tr>
<tr><td>5. Erreicht er den Server?</td><td><code>Test-NetConnection srv01 -Port 445</code></td><td>False: Netz, Firewall oder Namensauflösung</td></tr>
<tr><td>6. Richtige Berechtigung?</td><td><code>Get-ADGroupMember 'FS-...' -Recursive</code></td><td>Zeigt, wer tatsächlich Zugriff hat</td></tr>
<tr><td>7. GPO-Laufwerk da?</td><td><code>gpresult /h bericht.html</code></td><td>Zeigt, ob die Zuordnung überhaupt angekommen ist</td></tr>
</table></div>

<h3>4. Bestandsaufnahme für die Dokumentation</h3>
<x-term data-k="ps">
$datum = Get-Date -Format 'yyyy-MM-dd'

# Inaktive Konten der letzten 90 Tage
Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly |
    Where-Object Enabled -eq $true |
    Select-Object Name, SamAccountName, LastLogonDate |
    Export-Csv "C:\\Doku\\inaktiv_$datum.csv" -NoTypeInformation -Delimiter ';' -Encoding UTF8

# Betriebssysteme im Netz zählen
Get-ADComputer -Filter * -Properties OperatingSystem |
    Group-Object OperatingSystem |
    Sort-Object Count -Descending |
    Select-Object Count, Name

# Mitglieder aller administrativen Gruppen
'Domänen-Admins','Organisations-Admins','Schema-Admins' | ForEach-Object {
    Get-ADGroupMember $_ -Recursive |
        Select-Object @{n='Gruppe';e={$_}}, Name, SamAccountName
}
</x-term>
<x-term data-k="cmd">
:: Schnelle Hardware- und Systemübersicht eines Clients
systeminfo > C:\\Doku\\pc042.txt
ipconfig /all >> C:\\Doku\\pc042.txt
gpresult /h C:\\Doku\\pc042-gpo.html /f
</x-term>

<div class="note"><b>Gewohnheit, die sich auszahlt</b>Vor jeder Massenänderung ein Durchlauf mit <code>-WhatIf</code> und ein Export des Ist-Zustands nach CSV. Das kostet zwei Minuten und ist im Zweifel die einzige Möglichkeit, den Zustand vor der Änderung zu rekonstruieren.</div>

  datei:"Test-Erreichbarkeit.ps1", module:[], admin:false,

      '',
      '    $erreichbar = Test-Connection -ComputerName $ziel -Count $Versuche -Quiet -ErrorAction SilentlyContinue',

      '    $dns = try { (Resolve-DnsName $ziel -ErrorAction Stop | Where-Object Type -eq "A" |',

      '    }',
      '}',
      '',
      '$ergebnis | Sort-Object Erreichbar, Ziel',
      '',
      '$aus = $ergebnis | Where-Object { -not $_.Erreichbar }',
      'if ($aus) { Write-Warning "Nicht erreichbar: $($aus.Ziel -join \', \')" }'

    schritte:[
      ["Liste zerlegen und säubern","-split liefert auch leere Einträge, wenn jemand ein Komma zu viel setzt. Trim und Where fangen das ab."],

{

{
  id:"dienst-pruefen", bereich:"Dienste & Berichte", name:"Gestoppte Dienste prüfen",
  zweck:"Findet Dienste mit automatischem Start, die nicht laufen, und startet sie auf Wunsch.",
  datei:"Repair-Dienste.ps1", module:[], admin:true,
  felder:[
    {k:"Rechner",  l:"Rechner, durch Komma getrennt (leer = lokal)", t:"text", v:""},
    {k:"Starten",  l:"Gefundene Dienste starten", t:"switch", v:"false"}
  ],
  rumpf:function(){ return {
    code:[
      '$ziele = if ($Rechner) { $Rechner -split "," | ForEach-Object { $_.Trim() } } else { $env:COMPUTERNAME }',
      '',
      '$pruefung = {',
      '    Get-Service | Where-Object {',
      '        $_.StartType -eq "Automatic" -and $_.Status -ne "Running"',
      '    } | Select-Object @{n="Rechner"; e={$env:COMPUTERNAME}}, Name, DisplayName, Status, StartType',
      '}',
      '',
      '$gefunden = if ($ziele -contains $env:COMPUTERNAME -and $ziele.Count -eq 1) {',
      '    & $pruefung',
      '} else {',
      '    Invoke-Command -ComputerName $ziele -ScriptBlock $pruefung -ErrorAction Stop',
      '}',
      '',
      'if (-not $gefunden) {',
      '    Write-Host "Alle automatischen Dienste laufen." -ForegroundColor Green',
      '    return',
      '}',
      '',
      '$gefunden | Sort-Object Rechner, Name',
      '',
      'if ($Starten) {',
      '    foreach ($d in $gefunden) {',
      '        if ($PSCmdlet.ShouldProcess("$($d.Rechner)\\$($d.Name)", "Dienst starten")) {',
      '            Invoke-Command -ComputerName $d.Rechner -ScriptBlock {',
      '                Start-Service -Name $using:d.Name -ErrorAction Stop',
      '            }',
      '        }',
      '    }',
      '}'
    ],
    schritte:[
      ["Skriptblock in einer Variablen","Derselbe Code läuft lokal und entfernt - einmal geschrieben, zweimal verwendet."],
      ["Rechnername mitgeben","Bei mehreren Zielen wäre sonst nicht erkennbar, von welchem Server ein Eintrag stammt."],
      ["Lokal ohne Remoting","Für den eigenen Rechner braucht es kein WinRM. Der Aufrufoperator & führt den Block direkt aus."],
      ["$using: für lokale Variablen","Innerhalb von Invoke-Command sind lokale Variablen unbekannt. $using: reicht ihren Wert an die Gegenstelle durch."],
      ["Verzögerter Start beachten","Dienste mit Starttyp Automatisch (verzögerter Start) können kurz nach dem Hochfahren noch zu Recht stehen."]
    ]
  };}
},

{

{
  id:"sys-platz", bereich:"System & Wartung", name:"Speicherplatz überwachen",
  zweck:"Prüft alle Laufwerke gegen einen Schwellwert und meldet, was knapp wird.",

    {k:"SchwelleGB", l:"Warnung ab weniger als (GB)", t:"int", v:"20"},

  ],
  rumpf:function(){ return {
    code:[
      '$ziele = if ($Rechner) { $Rechner -split "," | ForEach-Object { $_.Trim() } } else { $env:COMPUTERNAME }',
      '',
      '$ergebnis = foreach ($ziel in $ziele) {',
      '',
      '    if (-not (Test-Connection $ziel -Count 1 -Quiet)) {',
      '        Write-Warning "Nicht erreichbar: $ziel"',
      '        continue',
      '    }',
      '',
      '    Get-CimInstance Win32_LogicalDisk -ComputerName $ziel -Filter "DriveType=3" | ForEach-Object {',
      '',
      '        $freiGB      = [math]::Round($_.FreeSpace/1GB, 1)',
      '        $gesamtGB    = [math]::Round($_.Size/1GB, 1)',
      '        $freiProzent = if ($_.Size) { [math]::Round($_.FreeSpace/$_.Size*100, 1) } else { 0 }',

      '        }',
      '    }',
      '}',
      '',
      '$ergebnis | Sort-Object FreiProzent',
      '',
      '$knapp = $ergebnis | Where-Object Status -eq "KNAPP"',

  datei:"Get-Autostart.ps1", module:[], admin:false,
  felder:[],
  rumpf:function(){ return {
    code:[
      '$eintraege = [System.Collections.Generic.List[object]]::new()',
      '',
      '# 1. Registrierung: Run-Schlüssel für Computer und Benutzer',
      '$runPfade = @(',
      '    "HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"',
      '    "HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run"',
      '    "HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"',
      ')',
      '',
      'foreach ($pfad in $runPfade) {',
      '    if (-not (Test-Path $pfad)) { continue }',
      '    $werte = Get-Item $pfad',
      '    foreach ($name in $werte.GetValueNames()) {',
      '        $eintraege.Add([PSCustomObject]@{',
      '            Quelle  = "Registrierung"',
      '            Bereich = if ($pfad -like "HKLM*") { "Alle Benutzer" } else { "Nur $env:USERNAME" }',
      '            Name    = $name',
      '            Befehl  = $werte.GetValue($name)',
      '        })',
      '    }',
      '}',
      '',
      '# 2. Autostart-Ordner',
      '$ordner = @(',
      '    [Environment]::GetFolderPath("Startup")',
      '    [Environment]::GetFolderPath("CommonStartup")',
      ')',
      '',
      'foreach ($o in $ordner) {',
      '    Get-ChildItem $o -File -ErrorAction SilentlyContinue | ForEach-Object {',
      '        $eintraege.Add([PSCustomObject]@{',
      '            Quelle  = "Autostart-Ordner"',
      '            Bereich = $o',
      '            Name    = $_.Name',
      '            Befehl  = $_.FullName',
      '        })',
      '    }',
      '}',
      '',
      '# 3. Geplante Aufgaben, die bei der Anmeldung starten',
      'Get-ScheduledTask -ErrorAction SilentlyContinue |',
      '    Where-Object { $_.Triggers.CimClass.CimClassName -contains "MSFT_TaskLogonTrigger" -and $_.State -ne "Disabled" } |',
      '    ForEach-Object {',
      '        $eintraege.Add([PSCustomObject]@{',
      '            Quelle  = "Geplante Aufgabe"',
      '            Bereich = $_.TaskPath',
      '            Name    = $_.TaskName',
      '            Befehl  = ($_.Actions.Execute -join " ")',
      '        })',
      '    }',
      '',
      '$eintraege | Sort-Object Quelle, Name'
    ],
    schritte:[
      ["Drei verschiedene Quellen","Autostart ist nicht ein Ort, sondern mindestens drei: Registrierung, Autostart-Ordner und geplante Aufgaben mit Anmeldeauslöser."],
      ["HKLM gegen HKCU","Einträge unter HKLM gelten für alle Benutzer, unter HKCU nur für den angemeldeten. Das entscheidet darüber, wo man ansetzen muss."],
      ["GetValueNames","Die Run-Schlüssel enthalten beliebig viele Werte. Über die Methode lassen sie sich aufzählen, ohne die Namen zu kennen."],
      ["Environment statt fester Pfad","Der Autostart-Ordner liegt je nach Windows-Sprache und Version woanders. GetFolderPath liefert immer den richtigen."],
      ["Anmeldeauslöser filtern","Nur Aufgaben mit einem Logon-Trigger gehören in die Liste - nicht die hunderte zeitgesteuerten Wartungsaufgaben."]
    ]
  };}
},
{
  id:"sys-temp", bereich:"System & Wartung", name:"Temporäre Dateien aufräumen",
  zweck:"Leert die Temp-Ordner und zeigt, wie viel Platz dabei frei wird.",
  datei:"Clear-TempDateien.ps1", module:[], admin:true,
  felder:[
    {k:"AelterAlsTage", l:"Nur Dateien älter als (Tage)", t:"int", v:"7"},
    {k:"MitWindowsTemp", l:"Auch C:\\Windows\\Temp einbeziehen", t:"switch", v:"true"}
  ],
  rumpf:function(){ return {
    code:[
      '$ordner = @($env:TEMP)',
      'if ($MitWindowsTemp) { $ordner += "$env:SystemRoot\\Temp" }',
      '',
      '$stichtag = (Get-Date).AddDays(-$AelterAlsTage)',
      '$bericht  = [System.Collections.Generic.List[object]]::new()',
      '',
      'foreach ($o in $ordner) {',
      '',
      '    if (-not (Test-Path $o)) { continue }',
      '',
      '    $dateien = Get-ChildItem $o -Recurse -File -Force -ErrorAction SilentlyContinue |',
      '        Where-Object { $_.LastWriteTime -lt $stichtag }',
      '',
      '    $groesse = ($dateien | Measure-Object Length -Sum).Sum',
      '    $weg     = 0',
      '    $bleibt  = 0',
      '',
      '    foreach ($d in $dateien) {',
      '        if ($PSCmdlet.ShouldProcess($d.FullName, "Löschen")) {',
      '            try   { Remove-Item $d.FullName -Force -ErrorAction Stop; $weg++ }',
      '            catch { $bleibt++ }',
      '        }',
      '    }',
      '',
      '    $bericht.Add([PSCustomObject]@{',
      '        Ordner     = $o',
      '        Gefunden   = $dateien.Count',
      '        Geloescht  = $weg',
      '        Gesperrt   = $bleibt',
      '        FreiMB     = [math]::Round($groesse/1MB, 1)',
      '    })',
      '}',
      '',
      '$bericht'
    ],
    schritte:[
      ["Zwei Temp-Orte","$env:TEMP gehört dem angemeldeten Benutzer, C:\\Windows\\Temp dem System. Für den zweiten braucht es Administratorrechte."],
      ["Altersgrenze statt alles","Dateien, die gerade in Benutzung sind, haben ein aktuelles Änderungsdatum. Die Grenze von einigen Tagen verhindert, dass laufenden Programmen etwas weggezogen wird."],
      ["Gesperrte Dateien zählen","In Temp-Ordnern ist immer etwas in Benutzung. Statt den Lauf abzubrechen, wird mitgezählt und weitergemacht."],
      ["-Force beim Auflisten","Ohne diesen Schalter übersieht Get-ChildItem versteckte Dateien - in Temp-Ordnern sind das nicht wenige."]
    ]
  };}
},
{
  id:"sys-zertifikate", bereich:"System & Wartung", name:"Ablaufende Zertifikate finden",
  zweck:"Listet Zertifikate des Rechners, die demnächst ablaufen - bevor ein Dienst ausfällt.",
  datei:"Get-AblaufendeZertifikate.ps1", module:[], admin:false,
  felder:[
    {k:"Tage",   l:"Ablauf innerhalb der nächsten (Tage)", t:"int", v:"60"},
    {k:"Speicher", l:"Zertifikatspeicher", t:"select", v:"LocalMachine\\My", opt:["LocalMachine\\My","LocalMachine\\WebHosting","CurrentUser\\My","LocalMachine\\Root"]}
  ],
  rumpf:function(){ return {
    code:[
      '$grenze = (Get-Date).AddDays($Tage)',
      '',
      '$zertifikate = Get-ChildItem "Cert:\\$Speicher" -ErrorAction Stop |',
      '    Where-Object { $_.NotAfter -lt $grenze } |',
      '    ForEach-Object {',
      '        [PSCustomObject]@{',
      '            Antragsteller = $_.Subject',

      '            GueltigBis    = $_.NotAfter',

      '    return',
      '}',
      '',
      '$zertifikate | Sort-Object RestTage'
    ],
    schritte:[
      ["Cert: ist ein Laufwerk","Der Zertifikatspeicher wird über einen Provider angesprochen. Deshalb funktioniert hier dasselbe Get-ChildItem wie im Dateisystem."],
      ["LocalMachine gegen CurrentUser","Dienste und Webserver nutzen den Computerspeicher, Anwendungen oft den Benutzerspeicher. Wer am falschen Ort sucht, findet nichts."],
      ["Reststand in Tagen","Eine Zahl lässt sich auswerten und überwachen, ein Datum muss man erst lesen."],
      ["Bereits abgelaufene mitnehmen","Die Bedingung NotAfter kleiner als Grenze schließt abgelaufene Zertifikate mit ein - genau die sucht man im Störungsfall."]
    ]
  };}
}

{

  zweck:"Findet verwaiste Profile auf einem Rechner und entfernt sie sauber über WMI.",
  datei:"Remove-AlteProfile.ps1", module:[], admin:true,
  felder:[
    {k:"Tage",    l:"Unbenutzt seit (Tage)",  t:"int",  v:"90"},

      'if (-not $profile) {',

{
  id:"sys-aufgabe", bereich:"System & Wartung", name:"Geplante Aufgabe anlegen",
  zweck:"Richtet eine wiederkehrende Aufgabe ein, die ein Skript zu einer festen Uhrzeit ausführt.",
  datei:"Register-Wartungsaufgabe.ps1", module:[], admin:true,
  felder:[
    {k:"AufgabenName", l:"Name der Aufgabe",     t:"text", v:"IT-Wartung-Nacht"},
    {k:"SkriptPfad",   l:"Auszuführendes Skript", t:"text", v:"C:\\Skripte\\wartung.ps1"},
    {k:"Uhrzeit",      l:"Startzeit (HH:mm)",     t:"text", v:"22:00"},
    {k:"Rhythmus",     l:"Wiederholung",          t:"select", v:"Taeglich", opt:["Taeglich","Woechentlich","BeimStart"]},
    {k:"AlsSystem",    l:"Als SYSTEM ausführen",  t:"switch", v:"true"}
  ],
  rumpf:function(){ return {
    code:[
      'if (-not (Test-Path $SkriptPfad)) {',
      '    throw "Skript nicht gefunden: $SkriptPfad"',
      '}',
      '',
      '$argumente = \'-NoProfile -ExecutionPolicy Bypass -File "\' + $SkriptPfad + \'"\'',
      '$aktion    = New-ScheduledTaskAction -Execute "powershell.exe" -Argument $argumente',
      '',
      '$ausloeser = switch ($Rhythmus) {',
      '    "Taeglich"      { New-ScheduledTaskTrigger -Daily -At $Uhrzeit }',
      '    "Woechentlich"  { New-ScheduledTaskTrigger -Weekly -DaysOfWeek Monday -At $Uhrzeit }',
      '    "BeimStart"     { New-ScheduledTaskTrigger -AtStartup }',
      '}',
      '',
      '$konto = if ($AlsSystem) {',
      '    New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest',
      '} else {',
      '    New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\\$env:USERNAME" -LogonType Interactive -RunLevel Highest',
      '}',
      '',
      '$einstellungen = @{',
      '    StartWhenAvailable        = $true',
      '    DontStopIfGoingOnBatteries = $true',
      '    AllowStartIfOnBatteries    = $true',
      '    ExecutionTimeLimit         = (New-TimeSpan -Hours 2)',
      '}',
      '$optionen = New-ScheduledTaskSettingsSet @einstellungen',
      '',
      'if (Get-ScheduledTask -TaskName $AufgabenName -ErrorAction SilentlyContinue) {',
      '    Write-Warning "Aufgabe existiert bereits und wird ersetzt."',
      '    Unregister-ScheduledTask -TaskName $AufgabenName -Confirm:$false',
      '}',
      '',
      'if ($PSCmdlet.ShouldProcess($AufgabenName, "Geplante Aufgabe registrieren")) {',
      '    $aufgabe = @{',
      '        TaskName    = $AufgabenName',
      '        Action      = $aktion',
      '        Trigger     = $ausloeser',
      '        Principal   = $konto',
      '        Settings    = $optionen',
      '        Description = "Angelegt per Skript"',
      '    }',
      '    Register-ScheduledTask @aufgabe | Out-Null',
      '}',
      '',
      'Get-ScheduledTask -TaskName $AufgabenName |',
      '    Select-Object TaskName, State, @{n="NaechsterLauf"; e={(Get-ScheduledTaskInfo $_.TaskName).NextRunTime}}'
    ],
    schritte:[
      ["Vier Bausteine","Eine Aufgabe besteht aus Aktion, Auslöser, Konto und Einstellungen. Jeder Teil wird einzeln erzeugt und erst am Ende zusammengesetzt."],
      ["-ExecutionPolicy Bypass","Die Aufgabe läuft in einer eigenen Sitzung. Der Schalter umgeht die Richtlinie für genau diesen Aufruf, ohne sie systemweit zu ändern."],

REZEPTE.push(
{
  id:"datei-duplikate", bereich:"Dateien & Backup", name:"Doppelte Dateien finden",
  zweck:"Findet inhaltsgleiche Dateien über Prüfsummen - unabhängig vom Dateinamen.",
  datei:"Find-Duplikate.ps1", module:[], admin:false,
  felder:[
    {k:"Ordner", l:"Zu durchsuchender Ordner", t:"text", v:"D:\\Ablage"},
    {k:"MinKB",  l:"Nur Dateien ab (KB)",      t:"int",  v:"100"},
    {k:"Muster", l:"Dateimuster",              t:"text", v:"*"}
  ],
  rumpf:function(){ return {
    code:[
      '$dateien = Get-ChildItem -Path $Ordner -Filter $Muster -File -Recurse -ErrorAction SilentlyContinue |',
      '    Where-Object { $_.Length -gt ($MinKB * 1KB) }',
      '',
      'Write-Verbose "$($dateien.Count) Dateien in der Vorauswahl"',
      '',
      '# Erst nach Größe gruppieren - nur gleich große Dateien können gleich sein',
      '$kandidaten = $dateien | Group-Object Length | Where-Object Count -gt 1',
      '',
      'Write-Verbose "$(($kandidaten | Measure-Object Count -Sum).Sum) Dateien müssen gehasht werden"',
      '',
      '$treffer = foreach ($gruppe in $kandidaten) {',
      '',
      '    $gruppe.Group |',
      '        ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 -ErrorAction SilentlyContinue } |',
      '        Group-Object Hash |',
      '        Where-Object Count -gt 1 |',
      '        ForEach-Object {',
      '            $pfade = $_.Group.Path',
      '            [PSCustomObject]@{',
      '                GroesseMB = [math]::Round(($gruppe.Group[0].Length)/1MB, 2)',
      '                Anzahl    = $_.Count',
      '                VerschwendetMB = [math]::Round(($gruppe.Group[0].Length * ($_.Count - 1))/1MB, 2)',
      '                Original  = $pfade[0]',
      '                Kopien    = ($pfade | Select-Object -Skip 1) -join " | "',
      '            }',
      '        }',
      '}',
      '',
      'if (-not $treffer) {',
      '    Write-Host "Keine Duplikate gefunden." -ForegroundColor Green',
      '    return',
      '}',
      '',
      '$treffer | Sort-Object VerschwendetMB -Descending',
      'Write-Host "Insgesamt verschwendet: $([math]::Round((($treffer | Measure-Object VerschwendetMB -Sum).Sum),1)) MB" -ForegroundColor Cyan'
    ],
    schritte:[
      ["Erst Größe, dann Hash","Prüfsummen zu berechnen heißt, jede Datei vollständig zu lesen. Die Vorgruppierung nach Größe reduziert die Menge oft um mehr als 90 Prozent - zwei verschieden große Dateien können nie gleich sein."],
      ["SHA256 statt Dateiname","Zwei Dateien mit unterschiedlichem Namen können identisch sein, zwei gleichnamige völlig verschieden. Nur der Inhalt zählt."],
      ["Erste Datei als Original","Die Reihenfolge ergibt sich aus dem Durchlauf, nicht aus einer inhaltlichen Wertung. Vor dem Löschen prüfen, welche Kopie wirklich bleiben soll."],
      ["Verschwendeter Platz","Bei drei gleichen Dateien sind zwei überflüssig - deshalb Anzahl minus eins."],
      ["Nichts wird gelöscht","Das Skript berichtet nur. Löschen ist bei Duplikaten immer eine Einzelfallentscheidung."]
    ]
  };}
},
{
  id:"datei-archiv", bereich:"Dateien & Backup", name:"Archiv mit Datum erstellen",
  zweck:"Packt einen Ordner in ein ZIP mit Zeitstempel und räumt alte Archive auf.",
  datei:"New-DatiertesArchiv.ps1", module:[], admin:false,
  felder:[
    {k:"Quelle",     l:"Zu sicherndes Verzeichnis", t:"text", v:"C:\\Daten\\Projekte"},
    {k:"Ablage",     l:"Ablageordner für Archive",  t:"text", v:"D:\\Archive"},
    {k:"BehalteAnzahl", l:"Wie viele Archive behalten", t:"int", v:"7"}
  ],
  rumpf:function(){ return {
    code:[
      'if (-not (Test-Path $Quelle)) { throw "Quelle nicht gefunden: $Quelle" }',
      'if (-not (Test-Path $Ablage)) { New-Item $Ablage -ItemType Directory | Out-Null }',
      '',
      '$name    = Split-Path $Quelle -Leaf',
      '$stempel = Get-Date -Format "yyyy-MM-dd_HHmm"',
      '$ziel    = Join-Path $Ablage "$name`_$stempel.zip"',
      '',
      'Write-Verbose "Packe $Quelle nach $ziel"',
      '',
      'if ($PSCmdlet.ShouldProcess($ziel, "Archiv erstellen")) {',
      '    Compress-Archive -Path (Join-Path $Quelle "*") -DestinationPath $ziel -CompressionLevel Optimal -ErrorAction Stop',
      '}',
      '',
      '$archiv = Get-Item $ziel -ErrorAction SilentlyContinue',
      '$quellGroesse = (Get-ChildItem $Quelle -Recurse -File | Measure-Object Length -Sum).Sum',
      '',
      '[PSCustomObject]@{',
      '    Archiv      = $ziel',
      '    QuelleMB    = [math]::Round($quellGroesse/1MB, 1)',
      '    ArchivMB    = if ($archiv) { [math]::Round($archiv.Length/1MB, 1) } else { 0 }',
      '    Ersparnis   = if ($archiv -and $quellGroesse) { "$([math]::Round((1 - $archiv.Length/$quellGroesse)*100))%" } else { "-" }',
      '}',
      '',
      '# Alte Archive entfernen, die jüngsten behalten',
      '$alte = Get-ChildItem $Ablage -Filter "$name`_*.zip" |',
      '    Sort-Object LastWriteTime -Descending |',
      '    Select-Object -Skip $BehalteAnzahl',
      '',
      'foreach ($a in $alte) {',
      '    if ($PSCmdlet.ShouldProcess($a.FullName, "Altes Archiv löschen")) {',
      '        Remove-Item $a.FullName -Force',
      '        Write-Verbose "Entfernt: $($a.Name)"',
      '    }',
      '}'
    ],
    schritte:[
      ["Zeitstempel im Namen","Das Format Jahr-Monat-Tag sortiert sich im Explorer von selbst richtig - anders als das deutsche Datumsformat."],
      ["Gravis vor dem Unterstrich","In einer Zeichenkette leitet der Unterstrich nach einer Variablen sonst einen längeren Variablennamen ein. Das Gravis-Zeichen trennt sauber ab."],
      ["Join-Path Quelle *","Ohne den Stern landet der Quellordner selbst als oberste Ebene im Archiv. Mit Stern liegt der Inhalt direkt in der ZIP-Wurzel."],
      ["Ersparnis ausweisen","Der Vergleich zeigt, ob sich das Packen lohnt - bei bereits komprimierten Dateien wie Bildern oder Videos kaum."],
      ["Aufbewahrung begrenzen","Sortiert nach Datum, die jüngsten überspringen, den Rest löschen. So wächst die Ablage nicht unbegrenzt."]
    ]
  };}
},
{
  id:"datei-ersetzen", bereich:"Dateien & Backup", name:"Text in Dateien ersetzen",
  zweck:"Sucht eine Zeichenkette in allen Dateien eines Ordners und ersetzt sie - mit Sicherung vorab.",
  datei:"Update-TextInDateien.ps1", module:[], admin:false,
  felder:[
    {k:"Ordner",  l:"Ordner",              t:"text", v:"C:\\Konfiguration"},
    {k:"Muster",  l:"Dateimuster",         t:"text", v:"*.config"},
    {k:"Suchen",  l:"Zu ersetzender Text", t:"text", v:"srv-alt.firma.local"},
    {k:"Ersetzen",l:"Neuer Text",          t:"text", v:"srv-neu.firma.local"},
    {k:"Sicherung", l:"Sicherungskopie anlegen", t:"switch", v:"true"}
  ],
  rumpf:function(){ return {
    code:[
      '$dateien = Get-ChildItem -Path $Ordner -Filter $Muster -File -Recurse -ErrorAction Stop',
      '',
      '$bericht = foreach ($d in $dateien) {',
      '',
      '    $inhalt = Get-Content $d.FullName -Raw -Encoding UTF8',
      '',
      '    if ($inhalt -notlike "*$Suchen*") { continue }',
      '',
      '    $anzahl = ([regex]::Matches($inhalt, [regex]::Escape($Suchen))).Count',
      '    $neu    = $inhalt.Replace($Suchen, $Ersetzen)',
      '',
      '    if ($PSCmdlet.ShouldProcess($d.FullName, "$anzahl Vorkommen ersetzen")) {',
      '',
      '        if ($Sicherung) {',
      '            Copy-Item $d.FullName "$($d.FullName).bak" -Force',
      '        }',
      '',
      '        Set-Content -Path $d.FullName -Value $neu -Encoding UTF8 -NoNewline',
      '    }',
      '',
      '    [PSCustomObject]@{',
      '        Datei      = $d.FullName',
      '        Vorkommen  = $anzahl',
      '        Sicherung  = if ($Sicherung) { "$($d.Name).bak" } else { "keine" }',
      '    }',
      '}',
      '',
      'if (-not $bericht) {',
      '    Write-Host "Der Text wurde in keiner Datei gefunden." -ForegroundColor Yellow',
      '    return',
      '}',
      '',
      '$bericht',
      'Write-Host "$(($bericht | Measure-Object Vorkommen -Sum).Sum) Ersetzungen in $($bericht.Count) Dateien" -ForegroundColor Cyan'
    ],
    schritte:[
      ["-Raw beim Lesen","Ohne diesen Schalter liefert Get-Content ein Array aus Einzelzeilen. Für eine Ersetzung über die ganze Datei braucht es den Inhalt als eine Zeichenkette."],
      ["Replace statt -replace","Die .NET-Methode ersetzt Text wörtlich. Der Operator -replace würde die Eingabe als regulären Ausdruck deuten - ein Punkt oder eine Klammer im Suchtext hätte dann eine ganz andere Bedeutung."],
      ["regex::Escape zum Zählen","Nur fürs Zählen wird ein regulärer Ausdruck gebraucht. Escape entschärft Sonderzeichen im Suchtext."],
      ["Sicherung vor dem Schreiben","Eine .bak-Datei neben dem Original ist die einfachste Rückfallebene. Vor Massenersetzungen in Konfigurationsdateien Pflicht."],
      ["-NoNewline","Set-Content hängt sonst einen Zeilenumbruch an. Bei Konfigurationsdateien kann das in seltenen Fällen stören."],
      ["-WhatIf nutzen","Der Probelauf zeigt Datei für Datei, wie viele Vorkommen betroffen wären - ohne eine einzige zu ändern."]
    ]
  };}
},
{
  id:"datei-rechte", bereich:"Dateien & Backup", name:"NTFS-Berechtigungen berichten",

  datei:"Get-Berechtigungen.ps1", module:[], admin:false,

    {k:"OhneVererbte",l:"Nur direkt gesetzte Rechte", t:"switch", v:"true"}
  ],
  rumpf:function(){ return {
    code:[
      '$ordner = @(Get-Item $Startordner -ErrorAction Stop)',
      '$ordner += Get-ChildItem $Startordner -Directory -Recurse -Depth ($Tiefe - 1) -ErrorAction SilentlyContinue',
      '',
      'Write-Verbose "$($ordner.Count) Ordner werden geprüft"',
      '',
      '$ergebnis = foreach ($o in $ordner) {',
      '',
      '    $acl = Get-Acl $o.FullName -ErrorAction SilentlyContinue',
      '    if (-not $acl) { continue }',
      '',
      '    $regeln = $acl.Access',
      '    if ($OhneVererbte) { $regeln = $regeln | Where-Object { -not $_.IsInherited } }',
      '',
      '    foreach ($r in $regeln) {',
      '        [PSCustomObject]@{',
      '            Ordner     = $o.FullName',
      '            Ebene      = ($o.FullName -split "\\\\").Count - ($Startordner -split "\\\\").Count',
      '            Berechtigt = $r.IdentityReference',
      '            Rechte     = $r.FileSystemRights',
      '            Typ        = $r.AccessControlType',
      '            Vererbt    = $r.IsInherited',
      '            Besitzer   = $acl.Owner',
      '        }',
      '    }',
      '}',
      '',
      '$ergebnis | Sort-Object Ordner, Berechtigt',
      '',
      '# Auffälligkeiten hervorheben',
      '$jeder = $ergebnis | Where-Object { $_.Berechtigt -match "Jeder|Everyone|Authentifizierte Benutzer|Authenticated Users" }',
      'if ($jeder) {',
      '    Write-Warning "Weit gefasste Berechtigung gefunden auf: $(($jeder.Ordner | Select-Object -Unique) -join ", ")"',
      '}'
    ],
    schritte:[
      ["-Depth begrenzt den Aufwand","Eine vollständige Rekursion über eine Dateiablage kann Stunden dauern. Zwei Ebenen reichen für die meisten Prüfungen, weil dort die Freigabestruktur liegt."],

      ["Besitzer mitführen","Ein unerwarteter Besitzer deutet darauf hin, dass jemand den Besitz übernommen hat - etwa nach einem takeown."],
      ["Warnung bei Jeder","Die Gruppe Jeder auf einer Datenablage ist fast immer ein Fehler. Die Prüfung deckt beide Sprachvarianten ab."]

  };}
},

{

      '',

      '        @{n="Frei%";    e={[math]::Round($_.FreeSpace/$_.Size*100)}} |',
      '        ConvertTo-Html -Fragment',
      '',
      '    "<h3>Gestoppte automatische Dienste</h3>"',
      '    if ($dien) { $dien | Select-Object Name, DisplayName | ConvertTo-Html -Fragment }',
      '    else       { "<p>Keine Auffälligkeiten.</p>" }',
      '}',
      '',
      '$kopf = "<h1>Statusbericht</h1><p>Erstellt am $(Get-Date -Format \'dd.MM.yyyy HH:mm\') von $env:USERNAME</p>"',
      '$fuss = "<p class=\'fuss\'>Automatisch erzeugt - keine manuelle Prüfung.</p>"',
      '',
      'if (-not (Test-Path (Split-Path $Zieldatei))) {',
      '    New-Item (Split-Path $Zieldatei) -ItemType Directory | Out-Null',
      '}',
      '',
      'ConvertTo-Html -Head $stil -Body ($kopf + ($teile -join "`n") + $fuss) |',
      '    Out-File $Zieldatei -Encoding UTF8',

      'Write-Host "Bericht geschrieben: $Zieldatei" -ForegroundColor Green',

      ["-As List","Für Einzelwerte eines Rechners ist die Listendarstellung lesbarer als eine Tabelle mit einer Zeile."],
      ["Ausgabe im Schleifenrumpf","Alles, was in der Schleife ohne Zuweisung ausgegeben wird, sammelt sich in $teile - Zeichenketten und Tabellen gemischt."],

    ]
  };}

{
  id:"ber-csv", bereich:"Dienste & Berichte", name:"CSV-Dateien zusammenführen",
  zweck:"Fügt mehrere gleich aufgebaute CSV-Dateien zu einer zusammen und ergänzt die Herkunft.",
  datei:"Merge-CsvDateien.ps1", module:[], admin:false,
  felder:[
    {k:"Ordner",    l:"Ordner mit den CSV-Dateien", t:"text", v:"C:\\Export"},
    {k:"Muster",    l:"Dateimuster",                t:"text", v:"*.csv"},
    {k:"Trenner",   l:"Trennzeichen",               t:"select", v:";", opt:[";",","]},
    {k:"Zieldatei", l:"Zieldatei",                  t:"text", v:"C:\\Export\\gesamt.csv"},
    {k:"OhneDoppel",l:"Doppelte Zeilen entfernen",  t:"switch", v:"true"}
  ],
  rumpf:function(){ return {
    code:[
      '$dateien = Get-ChildItem -Path $Ordner -Filter $Muster -File |',
      '    Where-Object { $_.FullName -ne $Zieldatei }',
      '',
      'if (-not $dateien) { throw "Keine passenden Dateien in $Ordner" }',
      '',
      'Write-Verbose "$($dateien.Count) Dateien werden zusammengeführt"',
      '',
      '$alle = foreach ($d in $dateien) {',
      '',
      '    $zeilen = Import-Csv $d.FullName -Delimiter $Trenner -Encoding UTF8',
      '',
      '    Write-Verbose "$($d.Name): $(@($zeilen).Count) Zeilen"',
      '',
      '    $zeilen | ForEach-Object {',
      '        $_ | Add-Member -NotePropertyName Herkunft -NotePropertyValue $d.Name -PassThru',
      '    }',
      '}',
      '',
      '# Spaltenprüfung: unterschiedliche Kopfzeilen fallen sonst erst im Ergebnis auf',
      '$spalten = $dateien | ForEach-Object {',
      '    ((Import-Csv $_.FullName -Delimiter $Trenner | Select-Object -First 1).PSObject.Properties.Name | Sort-Object) -join "|"',
      '} | Select-Object -Unique',
      '',
      'if (@($spalten).Count -gt 1) {',
      '    Write-Warning "Die Dateien haben unterschiedliche Spalten - das Ergebnis kann Lücken enthalten."',
      '}',
      '',
      'if ($OhneDoppel) {',
      '    $vorher = @($alle).Count',
      '    $alle = $alle | Sort-Object * -Unique',
      '    Write-Verbose "$($vorher - @($alle).Count) doppelte Zeilen entfernt"',
      '}',
      '',
      '$alle | Export-Csv -Path $Zieldatei -NoTypeInformation -Delimiter $Trenner -Encoding UTF8',
      '',
      '[PSCustomObject]@{',
      '    Dateien   = $dateien.Count',
      '    Zeilen    = @($alle).Count',
      '    Ziel      = $Zieldatei',
      '}'
    ],
    schritte:[
      ["Zieldatei ausschließen","Liegt das Ergebnis im selben Ordner, würde es beim nächsten Lauf mit eingelesen und die Zeilen verdoppeln sich."],
      ["Herkunft ergänzen","Add-Member mit -PassThru hängt eine Spalte an und gibt das Objekt weiter. Ohne die Herkunft ist im Ergebnis nicht mehr nachvollziehbar, aus welcher Datei eine Zeile stammt."],
      ["Spalten vergleichen","Import-Csv füllt fehlende Spalten stillschweigend mit leeren Werten. Die Prüfung macht abweichende Kopfzeilen sichtbar, bevor jemand mit lückenhaften Daten weiterarbeitet."],
      ["Sort-Object * -Unique","Vergleicht über alle Eigenschaften hinweg. Achtung: Die Herkunftsspalte zählt dabei mit - identische Zeilen aus zwei Dateien bleiben deshalb erhalten."],
      ["Trennzeichen durchreichen","Ein- und Ausgabe nutzen dasselbe Zeichen. Deutsches Excel erwartet das Semikolon."]
    ]
  };}
}
);

{id:"s-filter", typ:"schritt", name:"Filtern", module:[], admin:false,
 kurz:"Nur behalten, was zutrifft",

   {k:"FilterWert",     l:"Vergleichswert", t:"text", v:"Running"}],
 code:function(n){ return [
   '$daten = $daten | Where-Object {',
   '    $wert = $_.' + n.FilterFeld,
   '    switch (' + n.FilterOperator + ') {',
   '        "gleich"          { $wert -eq ' + n.FilterWert + ' }',
   '        "ungleich"        { $wert -ne ' + n.FilterWert + ' }',
   '        "enthält"         { $wert -like "*' + n.FilterWert + '*" }',
   '        "beginnt mit"     { $wert -like "' + n.FilterWert + '*" }',
   '        "größer"          { $wert -gt ' + n.FilterWert + ' }',
   '        "kleiner"         { $wert -lt ' + n.FilterWert + ' }',
   '        "ist leer"        { -not $wert }',
   '        "ist nicht leer"  { [bool]$wert }',
   '    }',
   '}'
 ];},
 erklaerung:"Der Vergleich wird über ein switch gewählt, weil ein Operator sich nicht aus einer Variablen einsetzen lässt. Die Schreibweise $_.$(...) greift eine Eigenschaft ab, deren Name erst zur Laufzeit feststeht."},
