{id:"start", grp:"Einstieg", nav:"Landkarte", title:"Drei Werkzeuge, eine Windows-Welt",
lede:"CMD, PowerShell und Active Directory werden oft in einem Atemzug genannt, sind aber drei völlig verschiedene Dinge: ein Interpreter, eine Automatisierungsumgebung und ein Verzeichnisdienst.",
html:`
<p>Bevor irgendein Befehl Sinn ergibt, muss die Rollenverteilung sitzen. Wer sie einmal sauber trennt, verwechselt danach nie wieder eine Shell mit einem Dienst.</p>

<div class="tblwrap"><table>
<tr><th></th><th>Was es ist</th><th>Womit es arbeitet</th><th>Typischer Einsatz</th></tr>
<tr><td><strong>CMD</strong><br><code>cmd.exe</code></td><td>Befehlsinterpreter seit Windows NT, Nachfolger von COMMAND.COM</td><td>Text: jede Ausgabe ist eine Zeichenkette</td><td>Schnelle Einzelbefehle, Batchdateien, Anmeldeskripte, Notfallkonsole in WinRE</td></tr>
<tr><td><strong>PowerShell</strong><br><code>powershell.exe</code> / <code>pwsh.exe</code></td><td>Shell <em>und</em> Skriptsprache auf .NET-Basis</td><td>Objekte: jede Ausgabe hat Eigenschaften und Methoden</td><td>Automatisierung, Massenänderungen, Auswertungen, Verwaltung aus der Ferne</td></tr>
<tr><td><strong>Active Directory</strong><br><code>NTDS.dit</code> auf einem DC</td><td>Verzeichnisdienst, also eine verteilte Datenbank plus Authentifizierung</td><td>Objekte im Verzeichnis: Benutzer, Gruppen, Computer, Richtlinien</td><td>Zentrale Anmeldung, Berechtigungen, Gruppenrichtlinien in Firmennetzen</td></tr>
</table></div>

<div class="note"><b>Der entscheidende Unterschied</b>CMD und PowerShell sind <em>Werkzeuge</em>, mit denen du etwas bedienst. Active Directory ist das <em>Etwas</em>, das bedient wird. Es läuft auf einem Server, nicht in deiner Konsole. Beide Shells können mit ihm sprechen - nur auf verschiedenen Wegen.</div>

<h3>Wo die Programme tatsächlich liegen</h3>
<p>Das ist kein Detailwissen für Sammler: Es erklärt, warum drei verschiedene blaue oder schwarze Fenster auf demselben Rechner existieren können.</p>
<div class="tblwrap"><table>
<tr><th>Programm</th><th>Pfad</th><th>Version</th></tr>
<tr><td>cmd.exe</td><td><code>%SystemRoot%\\System32\\cmd.exe</code></td><td>Teil von Windows, keine eigene Versionspflege</td></tr>
<tr><td>powershell.exe</td><td><code>%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\</code></td><td>Windows PowerShell 5.1, fest im Betriebssystem, erhält nur noch Sicherheitsupdates</td></tr>
<tr><td>pwsh.exe</td><td><code>%ProgramFiles%\\PowerShell\\7\\</code></td><td>PowerShell 7.x, plattformübergreifend, separat installiert, läuft parallel zu 5.1</td></tr>
</table></div>
<p>Windows PowerShell 5.1 und PowerShell 7 sind <strong>keine</strong> konkurrierenden Installationen - sie existieren absichtlich nebeneinander. Der Grund ist Kompatibilität: Manche älteren Module laufen nur unter 5.1 auf dem .NET Framework.</p>

<x-term data-k="ps">
# Welche Version läuft hier gerade?
$PSVersionTable.PSVersion

# Wo liegt die ausführbare Datei?
(Get-Process -Id $PID).Path
</x-term>

<h3>Ein Befehl, drei Wege</h3>
<p>Die Aufgabe: Alle gestoppten Dienste anzeigen, die eigentlich automatisch starten sollten.</p>
<x-term data-k="cmd">
:: CMD - nur Text, Filtern ist Zeichenkettensuche
sc query state= all | findstr /i "STOPPED"
</x-term>
<x-term data-k="ps">
# PowerShell - Objekte mit echten Eigenschaften
Get-Service | Where-Object {$_.Status -eq 'Stopped' -and $_.StartType -eq 'Automatic'}
</x-term>
<p>Der CMD-Weg findet das Wort STOPPED irgendwo im Text und weiß nichts vom Starttyp - dafür gibt es dort schlicht keine Eigenschaft. Der PowerShell-Weg fragt zwei tatsächliche Merkmale des Objekts ab. Das ist der ganze Unterschied zwischen Text und Objekt, an einem einzigen Beispiel.</p>

<div class="note warn"><b>Nicht verwechseln</b>Die Windows-Konsolenanwendung, in der alles läuft, ist wieder etwas anderes: früher <code>conhost.exe</code>, heute meist Windows Terminal. Das ist nur das Fenster - CMD, PowerShell und pwsh sind die Programme darin.</div>
`},

{id:"zusammenhang", grp:"Einstieg", nav:"Zusammenhänge", title:"Wie die drei zusammenarbeiten",
lede:"Die spannenden Fragen liegen nicht in den Einzelbefehlen, sondern an den Übergängen: Was ruft was auf, welches Protokoll läuft darunter, und warum liefern zwei Wege zum selben Ziel manchmal unterschiedliche Ergebnisse.",
html:`
<h3>Die Schichten von unten nach oben</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.78rem;line-height:1.75;margin:0;overflow-x:auto;color:#cfe7ef">
 DU
  |
  +-- cmd.exe ----------------+          +-- powershell.exe / pwsh.exe
  |   startet .exe-Programme  |          |   lädt Module mit Cmdlets
  |   und Batchdateien        |          |   und kann ebenfalls .exe starten
  |                           |          |
  v                           v          v
 net.exe  dsquery.exe  ping.exe      ActiveDirectory-Modul
  |            |                          |
  | SMB/RPC    | LDAP 389                 | ADWS 9389
  v            v                          v
 +---------------------------------------------------+
 |        DOMÄNENCONTROLLER (Windows Server)          |
 |   AD DS  ->  NTDS.dit  +  SYSVOL  +  DNS  + KDC    |
 +---------------------------------------------------+
</pre>
</div>

<p>Drei Beobachtungen daraus, die in Prüfungen und in der Praxis immer wieder auftauchen:</p>
<ul>
<li><strong>PowerShell ersetzt CMD nicht, es umfasst es.</strong> Jedes <code>.exe</code>-Werkzeug aus der CMD-Welt lässt sich aus PowerShell heraus aufrufen - <code>ipconfig</code>, <code>robocopy</code>, <code>dsquery</code> funktionieren dort genauso. Umgekehrt geht es nicht: CMD kennt keine Cmdlets.</li>
<li><strong>Der Zugriffsweg aufs AD unterscheidet sich.</strong> Die klassischen Werkzeuge sprechen LDAP auf Port 389 oder RPC. Das PowerShell-Modul <code>ActiveDirectory</code> spricht dagegen mit den <em>Active Directory Web Services</em> auf TCP 9389. Ist dieser Dienst auf dem DC gestoppt oder der Port gesperrt, scheitert <code>Get-ADUser</code>, während <code>dsquery user</code> weiterhin funktioniert. Genau dieser Fall verwirrt im Störungsfall am meisten.</li>
<li><strong>Beide Wege ändern dieselbe Datenbank.</strong> Ob du einen Benutzer in der grafischen Konsole, per <code>dsadd</code> oder per <code>New-ADUser</code> anlegst - am Ende landet ein Objekt in derselben <code>NTDS.dit</code> und wird an alle anderen Domänencontroller repliziert.</li>
</ul>

<h3>Dieselbe Aufgabe in drei Sprachen</h3>
<div class="tblwrap"><table>
<tr><th>Aufgabe</th><th>CMD</th><th>PowerShell</th></tr>
<tr><td>Benutzer im AD suchen</td><td><code>net user max /domain</code><br><code>dsquery user -name "Max*"</code></td><td><code>Get-ADUser max -Properties *</code></td></tr>
<tr><td>Gruppenmitglied hinzufügen</td><td><code>net group "Vertrieb" max /add /domain</code></td><td><code>Add-ADGroupMember Vertrieb -Members max</code></td></tr>
<tr><td>Konto entsperren</td><td>nur über die GUI oder <code>net user max /active:yes</code> (nicht identisch!)</td><td><code>Unlock-ADAccount max</code></td></tr>
<tr><td>Richtlinien aktualisieren</td><td><code>gpupdate /force</code> (nur lokal)</td><td><code>Invoke-GPUpdate -Computer PC01 -Force</code> (auch entfernt)</td></tr>
<tr><td>Richtlinienbericht</td><td><code>gpresult /h bericht.html</code></td><td><code>Get-GPResultantSetOfPolicy -ReportType Html</code></td></tr>
<tr><td>Dienste prüfen</td><td><code>sc query</code> / <code>net start</code></td><td><code>Get-Service</code></td></tr>
<tr><td>Port testen</td><td><code>telnet dc01 389</code></td><td><code>Test-NetConnection dc01 -Port 389</code></td></tr>
<tr><td>DC finden</td><td><code>nltest /dsgetdc:firma.local</code></td><td><code>Get-ADDomainController -Discover</code></td></tr>
</table></div>

<div class="note"><b>Warum es die alten Werkzeuge noch gibt</b>Sie sind auf jedem Windows vorhanden, auch ohne nachinstallierte Verwaltungswerkzeuge, und sie laufen in Umgebungen ohne PowerShell-Remoting. Auf einem frisch aufgesetzten Client ohne RSAT ist <code>net user /domain</code> unter Umständen der einzige Weg, überhaupt etwas über ein Konto zu erfahren.</div>

<h3>Die Brücke: Textausgaben in PowerShell weiterverarbeiten</h3>
<p>Ein <code>.exe</code>-Werkzeug liefert an PowerShell nur Zeichenketten, keine Objekte. Damit die Pipeline trotzdem funktioniert, muss der Text zerlegt werden.</p>
<x-term data-k="ps">
# ipconfig liefert Text - PowerShell filtert ihn wie CMD es täte
ipconfig /all | Select-String "DNS-Server"

# Besser: das native Cmdlet nutzen und echte Objekte bekommen
Get-DnsClientServerAddress -AddressFamily IPv4 |
    Select-Object InterfaceAlias, ServerAddresses
</x-term>
<p>Die Faustregel lautet: Wenn es ein Cmdlet gibt, nimm das Cmdlet. Externe Werkzeuge nur dort, wo kein Cmdlet existiert - und dann bewusst mit der Einschränkung leben, dass die Ausgabe reiner Text ist.</p>

<h3>Der Lebenszyklus eines Mitarbeiterkontos durch alle drei Schichten</h3>
<div class="tblwrap"><table>
<tr><th>Schritt</th><th>Passiert im AD</th><th>Spürbar auf dem Client</th></tr>
<tr><td>Konto angelegt</td><td>Objekt in einer OU, SID vergeben, Kennwort gesetzt</td><td>Anmeldung möglich, sobald die Replikation durch ist</td></tr>
<tr><td>Gruppe zugewiesen</td><td>Eintrag im Attribut <code>member</code> der Gruppe</td><td>Wirkt erst nach neuer Anmeldung - das Kerberos-Ticket enthält die Gruppen</td></tr>
<tr><td>GPO verknüpft</td><td>Verknüpfung an der OU, Dateien im SYSVOL</td><td><code>gpupdate /force</code> oder nächster Aktualisierungszyklus (90 Minuten plus Versatz)</td></tr>
<tr><td>Laufwerk verbunden</td><td>GPO-Einstellung oder Anmeldeskript</td><td><code>net use</code> zeigt die Verbindung</td></tr>
<tr><td>Konto deaktiviert</td><td><code>userAccountControl</code> geändert</td><td>Anmeldung schlägt fehl, bestehende Sitzung läuft weiter bis zum Ticketablauf</td></tr>
</table></div>
<p>Die dritte Spalte enthält die Erklärung für den häufigsten Helpdesk-Satz überhaupt: <em>Ich habe die Gruppe doch eben hinzugefügt, warum kommt er nicht auf das Laufwerk?</em> Weil das Zugriffstoken bei der Anmeldung gebaut wird und die neue Gruppe darin schlicht noch nicht steht.</p>
<x-term data-k="cmd">
:: Prüfen, was tatsächlich im Token steckt
whoami /groups

:: Kerberos-Tickets verwerfen, damit neue ausgestellt werden
klist purge
</x-term>
`},

{id:"cmd-basis", grp:"Eingabeaufforderung", nav:"CMD verstehen", title:"Die Eingabeaufforderung",
lede:"cmd.exe ist alt, simpel und begrenzt - und genau deshalb überall verfügbar und in Notfällen unersetzlich.",
html:`
<h3>Interne und externe Befehle</h3>
<p>Ein Teil der Befehle steckt direkt in <code>cmd.exe</code> - <code>dir</code>, <code>cd</code>, <code>copy</code>, <code>echo</code>, <code>set</code>, <code>if</code>, <code>for</code>. Sie existieren nicht als eigene Datei auf der Platte. Alles andere sind eigenständige Programme in <code>System32</code>: <code>ping.exe</code>, <code>ipconfig.exe</code>, <code>robocopy.exe</code>, <code>net.exe</code>.</p>
<x-term data-k="cmd">
:: Interne Befehle auflisten
help

:: Zeigt nichts - dir ist kein eigenes Programm
where dir

:: Zeigt den Pfad - ping schon
where ping
</x-term>
<p>Diese Unterscheidung ist der Grund dafür, dass <code>help</code> nur eine kurze Liste ausgibt, während die offizielle Windows-Befehlsreferenz über 250 Einträge umfasst. Die Referenz zählt beides zusammen.</p>

<h3>Umgebungsvariablen</h3>
<p>Variablen werden in Prozentzeichen eingeschlossen. Sie gelten nur für die aktuelle Sitzung und alle davon gestarteten Prozesse - deshalb kennt ein bereits geöffnetes Fenster eine neu gesetzte Variable nicht.</p>
<div class="tblwrap"><table>
<tr><th>Variable</th><th>Inhalt</th></tr>
<tr><td><code>%USERNAME%</code></td><td>Angemeldeter Benutzer</td></tr>
<tr><td><code>%USERDOMAIN%</code></td><td>Domäne oder Computername bei lokaler Anmeldung</td></tr>
<tr><td><code>%COMPUTERNAME%</code></td><td>Name des Rechners</td></tr>
<tr><td><code>%USERPROFILE%</code></td><td>Profilordner, meist C:\\Users\\name</td></tr>
<tr><td><code>%APPDATA%</code> / <code>%LOCALAPPDATA%</code></td><td>Anwendungsdaten, roaming bzw. lokal</td></tr>
<tr><td><code>%SystemRoot%</code> / <code>%WINDIR%</code></td><td>Windows-Verzeichnis</td></tr>
<tr><td><code>%PATH%</code></td><td>Suchpfade für ausführbare Dateien</td></tr>
<tr><td><code>%TEMP%</code></td><td>Temporärer Ordner</td></tr>
<tr><td><code>%LOGONSERVER%</code></td><td>Domänencontroller, der die Anmeldung bearbeitet hat</td></tr>
<tr><td><code>%ERRORLEVEL%</code></td><td>Rückgabewert des letzten Befehls, 0 heißt Erfolg</td></tr>
</table></div>
<x-term data-k="cmd">
echo %USERDOMAIN%\\%USERNAME% an %COMPUTERNAME%
echo Anmeldeserver: %LOGONSERVER%

:: Nur für diese Sitzung
set PROJEKT=Migration2026

:: Dauerhaft in der Registrierung, wirkt erst in neuen Prozessen
setx PROJEKT "Migration2026"
</x-term>
<div class="note warn"><b>ERRORLEVEL richtig lesen</b><code>if errorlevel 1</code> bedeutet <em>größer oder gleich 1</em>, nicht <em>gleich 1</em>. Wer exakt vergleichen will, schreibt <code>if "%ERRORLEVEL%"=="1"</code>. Bei robocopy ist außerdem alles unter 8 ein Erfolg - eine 1 heißt dort nur, dass Dateien kopiert wurden.</div>

<h3>Groß- und Kleinschreibung, Pfade, Anführungszeichen</h3>
<ul>
<li>CMD unterscheidet <strong>nicht</strong> zwischen Groß- und Kleinschreibung, weder bei Befehlen noch bei Dateinamen.</li>
<li>Pfade mit Leerzeichen gehören in doppelte Anführungszeichen: <code>cd "C:\\Program Files"</code>.</li>
<li>Der Backslash trennt Verzeichnisse, der Schrägstrich leitet Optionen ein - umgekehrt als unter Linux.</li>
<li><code>.</code> ist das aktuelle, <code>..</code> das übergeordnete Verzeichnis.</li>
</ul>

<h3>Warum CMD in der Praxis überlebt</h3>
<ul>
<li><strong>Wiederherstellungsumgebung:</strong> In WinRE, bei <code>bootrec</code>, <code>diskpart</code> oder <code>bcdedit</code> gibt es oft nur eine Eingabeaufforderung.</li>
<li><strong>Anmeldeskripte:</strong> Unzählige gewachsene <code>.cmd</code>-Dateien laufen noch in produktiven Netzen.</li>
<li><strong>Keine Ausführungsrichtlinie:</strong> Batchdateien starten ohne die Hürde der PowerShell-ExecutionPolicy.</li>
<li><strong>Geschwindigkeit:</strong> Für einen einzelnen <code>ipconfig</code> braucht niemand eine Laufzeitumgebung.</li>
</ul>
`},

{id:"cmd-syntax", grp:"Eingabeaufforderung", nav:"Operatoren &amp; Batch", title:"Umleitung, Verkettung und Batchdateien",
lede:"Hier wird aus einzelnen Befehlen ein Ablauf. Die Operatoren sind wenige, aber sie tauchen in jedem Skript und jeder Prüfung wieder auf.",
html:`
<h3>Umleitungsoperatoren</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Wirkung</th><th>Beispiel</th></tr>
<tr><td><code>&gt;</code></td><td>Ausgabe in Datei, überschreibt</td><td><code>dir &gt; liste.txt</code></td></tr>
<tr><td><code>&gt;&gt;</code></td><td>Ausgabe anhängen</td><td><code>echo Ende &gt;&gt; log.txt</code></td></tr>
<tr><td><code>&lt;</code></td><td>Eingabe aus Datei lesen</td><td><code>sort &lt; unsortiert.txt</code></td></tr>
<tr><td><code>2&gt;</code></td><td>Nur Fehlerausgabe umleiten</td><td><code>befehl 2&gt; fehler.txt</code></td></tr>
<tr><td><code>2&gt;&amp;1</code></td><td>Fehler in die normale Ausgabe mischen</td><td><code>befehl &gt; alles.txt 2&gt;&amp;1</code></td></tr>
<tr><td><code>2&gt;nul</code></td><td>Fehlermeldungen verwerfen</td><td><code>del *.tmp 2&gt;nul</code></td></tr>
<tr><td><code>|</code></td><td>Ausgabe als Eingabe weitergeben</td><td><code>tasklist | findstr chrome</code></td></tr>
</table></div>
<div class="note"><b>Wichtig für das Verständnis der Pipe</b>In CMD fließt durch die Pipe reiner Text. In PowerShell fließen Objekte. Derselbe senkrechte Strich, zwei völlig verschiedene Konzepte - das ist die meistgestellte Verständnisfrage beim Umstieg.</div>

<h3>Verkettungsoperatoren</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Bedeutung</th></tr>
<tr><td><code>&amp;</code></td><td>Nacheinander ausführen, unabhängig vom Ergebnis</td></tr>
<tr><td><code>&amp;&amp;</code></td><td>Zweiten Befehl nur bei Erfolg (ERRORLEVEL 0) ausführen</td></tr>
<tr><td><code>||</code></td><td>Zweiten Befehl nur bei Fehler ausführen</td></tr>
<tr><td><code>^</code></td><td>Sonderzeichen entwerten oder Zeile umbrechen</td></tr>
</table></div>
<x-term data-k="cmd">
:: Ordner nur anlegen, wenn der Wechsel scheitert
cd C:\\Backup || md C:\\Backup

:: Kopieren und nur bei Erfolg protokollieren
copy quelle.txt ziel.txt &amp;&amp; echo OK &gt;&gt; log.txt
</x-term>

<h3>Eine Batchdatei mit Substanz</h3>
<p>Die Endung ist <code>.cmd</code> oder <code>.bat</code> - funktional praktisch identisch, <code>.cmd</code> ist die neuere Variante. Innerhalb einer Batchdatei werden Schleifenvariablen mit doppeltem Prozentzeichen geschrieben.</p>
<x-term data-k="cmd">
@echo off
setlocal enabledelayedexpansion
title Log-Archivierung

set QUELLE=C:\\Logs
set ZIEL=D:\\Archiv\\%DATE:~-4%-%DATE:~3,2%

if not exist "%ZIEL%" md "%ZIEL%"

for %%F in ("%QUELLE%\\*.log") do (
    echo Verarbeite %%~nxF
    copy "%%F" "%ZIEL%\\" &gt;nul
    if errorlevel 1 (
        echo FEHLER bei %%~nxF &gt;&gt; "%ZIEL%\\fehler.txt"
    )
)

echo Fertig: %DATE% %TIME%
endlocal
</x-term>
<p>Die Tilden-Modifizierer bei <code>%%~nxF</code> sind eine Eigenheit, die man einmal gesehen haben muss: <code>~n</code> liefert den Dateinamen ohne Endung, <code>~x</code> die Endung, <code>~dp</code> Laufwerk und Pfad, <code>~f</code> den vollständigen Pfad.</p>

<h3>for /f - das schärfste Werkzeug in CMD</h3>
<p>Damit lassen sich Textausgaben anderer Programme zerlegen. Das ist der Ersatz für alles, was PowerShell mit Objekten erledigt.</p>
<x-term data-k="cmd">
:: Jede Zeile einer Datei, aufgeteilt am Semikolon
for /f "usebackq tokens=1,2 delims=;" %%A in ("benutzer.csv") do (
    echo Konto: %%A   Abteilung: %%B
)

:: Ausgabe eines Befehls zerlegen, Kopfzeile überspringen
for /f "skip=1 tokens=2" %%S in ('sc query Spooler ^| findstr STATE') do echo Status: %%S
</x-term>
<div class="note warn"><b>Verzögerte Erweiterung</b>Innerhalb von Klammerblöcken wird <code>%var%</code> <em>einmal beim Einlesen</em> ersetzt, nicht bei jedem Durchlauf. Wer Variablen in einer Schleife setzt und liest, braucht <code>setlocal enabledelayedexpansion</code> und schreibt dann <code>!var!</code>. Ohne diese Zeile scheitern unzählige Batchskripte auf immer dieselbe Art.</div>
`}
];

CHAPTERS.push(

{id:"ps-basis", grp:"PowerShell", nav:"Grundlagen", title:"PowerShell verstehen",
lede:"PowerShell wirkt zunächst geschwätzig - bis klar wird, dass die langen Namen ein System haben, das man erraten kann statt auswendig zu lernen.",
html:`
<h3>Verb-Substantiv: das ganze Namenssystem</h3>
<p>Jedes Cmdlet heißt <code>Verb-Substantiv</code>, immer im Singular. Das Verb stammt aus einer festen, von Microsoft gepflegten Liste. Wer das Schema kennt, rät neue Befehle richtig.</p>
<div class="tblwrap"><table>
<tr><th>Verb</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><code>Get</code></td><td>Abfragen, ändert nichts</td><td>Get-Service, Get-ADUser</td></tr>
<tr><td><code>Set</code></td><td>Bestehendes ändern</td><td>Set-ADUser, Set-Service</td></tr>
<tr><td><code>New</code></td><td>Neu erzeugen</td><td>New-ADUser, New-Item</td></tr>
<tr><td><code>Remove</code></td><td>Löschen</td><td>Remove-Item, Remove-ADGroupMember</td></tr>
<tr><td><code>Add</code></td><td>Zu etwas Bestehendem hinzufügen</td><td>Add-ADGroupMember</td></tr>
<tr><td><code>Start</code> / <code>Stop</code></td><td>Starten und anhalten</td><td>Start-Service, Stop-Process</td></tr>
<tr><td><code>Test</code></td><td>Prüfen, liefert meist True/False</td><td>Test-Path, Test-NetConnection</td></tr>
<tr><td><code>Invoke</code></td><td>Etwas ausführen lassen</td><td>Invoke-Command, Invoke-WebRequest</td></tr>
<tr><td><code>Export</code> / <code>Import</code></td><td>In ein Format schreiben und zurücklesen</td><td>Export-Csv, Import-Csv</td></tr>
<tr><td><code>Enable</code> / <code>Disable</code></td><td>Aktivieren, deaktivieren</td><td>Enable-ADAccount</td></tr>
</table></div>
<x-term data-k="ps">
# Alle genehmigten Verben ansehen
Get-Verb | Sort-Object Verb

# Was gibt es rund um Netzwerkadapter?
Get-Command -Noun NetAdapter*
</x-term>

<h3>Die drei Befehle, mit denen man alles selbst herausfindet</h3>
<x-term data-k="ps">
Get-Command -Module ActiveDirectory   # Was kann dieses Modul?
Get-Help New-ADUser -Examples         # Wie sieht ein Aufruf aus?
Get-ADUser max -Properties * | Get-Member   # Welche Eigenschaften hat das Ergebnis?
</x-term>
<p>Diese Dreierkette ersetzt das Auswendiglernen. <code>Get-Member</code> ist dabei der unterschätzte Teil: Es zeigt, woran die Pipeline im nächsten Schritt überhaupt andocken kann.</p>

<h3>Aliase: bequem in der Konsole, schädlich im Skript</h3>
<div class="tblwrap"><table>
<tr><th>Alias</th><th>Eigentliches Cmdlet</th><th>Herkunft</th></tr>
<tr><td><code>dir</code>, <code>ls</code>, <code>gci</code></td><td>Get-ChildItem</td><td>CMD, Unix, PowerShell-Kurzform</td></tr>
<tr><td><code>cd</code>, <code>sl</code></td><td>Set-Location</td><td>CMD</td></tr>
<tr><td><code>cat</code>, <code>type</code>, <code>gc</code></td><td>Get-Content</td><td>Unix, CMD</td></tr>
<tr><td><code>cp</code>, <code>copy</code></td><td>Copy-Item</td><td>Unix, CMD</td></tr>
<tr><td><code>rm</code>, <code>del</code></td><td>Remove-Item</td><td>Unix, CMD</td></tr>
<tr><td><code>?</code>, <code>where</code></td><td>Where-Object</td><td>PowerShell</td></tr>
<tr><td><code>%</code>, <code>foreach</code></td><td>ForEach-Object</td><td>PowerShell</td></tr>
<tr><td><code>select</code></td><td>Select-Object</td><td>PowerShell</td></tr>
<tr><td><code>ft</code>, <code>fl</code></td><td>Format-Table, Format-List</td><td>PowerShell</td></tr>
</table></div>
<div class="note warn"><b>Falle beim Umstieg</b>Die Aliase sehen aus wie die alten Befehle, verhalten sich aber anders. <code>ls -l</code> scheitert, weil Get-ChildItem keinen Parameter <code>-l</code> kennt. Und <code>where</code> ist in PowerShell Where-Object, in CMD dagegen where.exe zum Finden von Programmen - dieselbe Eingabe, zwei verschiedene Dinge.</div>

<h3>Provider: dasselbe Cmdlet für ganz verschiedene Datenquellen</h3>
<p>PowerShell behandelt Registrierung, Zertifikatsspeicher, Umgebungsvariablen und sogar das Active Directory wie ein Dateisystem. Deshalb funktionieren <code>Get-ChildItem</code> und <code>Set-Location</code> überall gleich.</p>
<x-term data-k="ps">
Get-PSDrive                       # Alle verfügbaren Laufwerke, auch virtuelle

Get-ChildItem Env:                # Umgebungsvariablen
Get-ChildItem HKLM:\\SOFTWARE      # Registrierung
Get-ChildItem Cert:\\LocalMachine\\My   # Zertifikate
Set-Location AD:                  # Verzeichnis, wenn das AD-Modul geladen ist
</x-term>

<h3>Operatoren, die man täglich braucht</h3>
<div class="tblwrap"><table>
<tr><th>Operator</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><code>-eq</code> / <code>-ne</code></td><td>gleich / ungleich</td><td><code>$_.Status -eq 'Running'</code></td></tr>
<tr><td><code>-gt</code> <code>-ge</code> <code>-lt</code> <code>-le</code></td><td>größer, kleiner mit Gleich-Varianten</td><td><code>$_.Length -gt 1MB</code></td></tr>
<tr><td><code>-like</code> / <code>-notlike</code></td><td>Platzhaltervergleich mit * und ?</td><td><code>$_.Name -like 'srv*'</code></td></tr>
<tr><td><code>-match</code></td><td>Regulärer Ausdruck</td><td><code>$_.Name -match '^PC-\\d{3}$'</code></td></tr>
<tr><td><code>-contains</code> / <code>-in</code></td><td>Prüft Listenmitgliedschaft</td><td><code>'IT' -in $abteilungen</code></td></tr>
<tr><td><code>-and</code> <code>-or</code> <code>-not</code></td><td>Logische Verknüpfung</td><td><code>A -and -not B</code></td></tr>
</table></div>
<p>Größenangaben versteht PowerShell direkt: <code>1KB</code>, <code>1MB</code>, <code>1GB</code>, <code>1TB</code> werden automatisch in Bytes umgerechnet. Das spart in Filterausdrücken viel Rechnerei.</p>
`},

{id:"ps-pipeline", grp:"PowerShell", nav:"Pipeline &amp; Objekte", title:"Die Pipeline",
lede:"Der eine Gedanke, der PowerShell von jeder anderen Shell unterscheidet: Durch die Pipe fließt kein Text, sondern strukturierte Objekte.",
html:`
<h3>Was in der Pipe passiert</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.8rem;line-height:1.8;margin:0;overflow-x:auto;color:#cfe7ef">
Get-ADUser -Filter *   |   Where-Object ...   |   Select-Object ...   |   Export-Csv
      |                        |                       |                     |
  liefert Objekte          filtert sie            wählt Spalten         schreibt Datei
  mit Eigenschaften        anhand echter          und benennt um
  (Name, Enabled, ...)     Werte
</pre>
</div>
<p>Jede Stufe bekommt vollständige Objekte, keine abgeschnittenen Bildschirmzeilen. Deshalb geht in der Mitte nichts verloren - anders als bei CMD, wo nach dem ersten <code>findstr</code> nur noch die getroffene Textzeile übrig ist.</p>

<h3>Die sieben Arbeitspferde</h3>
<x-term data-k="ps">
Get-Service |
    Where-Object   { $_.Status -eq 'Stopped' } |   # filtern
    Sort-Object    DisplayName |                   # sortieren
    Select-Object  Name, DisplayName, StartType |  # Spalten wählen
    Export-Csv     C:\\dienste.csv -NoTypeInformation -Delimiter ';' -Encoding UTF8
</x-term>
<ul>
<li><strong>Where-Object</strong> filtert. Kurzform ohne Klammern seit Version 3: <code>Where-Object Status -eq 'Stopped'</code>.</li>
<li><strong>Select-Object</strong> wählt Eigenschaften oder begrenzt mit <code>-First</code> und <code>-Last</code>.</li>
<li><strong>Sort-Object</strong> sortiert, <code>-Descending</code> kehrt um.</li>
<li><strong>Group-Object</strong> gruppiert und zählt - die Basis jeder Auswertung.</li>
<li><strong>Measure-Object</strong> rechnet Summen, Durchschnitte, Maxima.</li>
<li><strong>ForEach-Object</strong> führt für jedes Objekt Code aus, Platzhalter ist <code>$_</code>.</li>
<li><strong>Export-Csv</strong> schreibt das Ergebnis weg - für den Chef, das Ticket oder die Doku.</li>
</ul>

<h3>Berechnete Eigenschaften</h3>
<p>Wenn eine Spalte so nicht existiert, wird sie in <code>Select-Object</code> erzeugt. Die Kurzschreibweise <code>n</code> steht für Name, <code>e</code> für Expression.</p>
<x-term data-k="ps">
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
    Select-Object DeviceID,
        @{n='GrößeGB'; e={[math]::Round($_.Size/1GB,1)}},
        @{n='FreiGB';  e={[math]::Round($_.FreeSpace/1GB,1)}},
        @{n='Frei%';   e={[math]::Round($_.FreeSpace/$_.Size*100,0)}}
</x-term>

<h3>Filtern links, nicht rechts</h3>
<p>Eine Regel, die bei großen Verzeichnissen den Unterschied zwischen Sekunden und Minuten ausmacht: Filter gehören in den Befehl selbst, nicht erst in ein nachgelagertes <code>Where-Object</code>.</p>
<x-term data-k="ps">
# Langsam: der DC liefert alle Konten, PowerShell wirft danach weg
Get-ADUser -Filter * -Properties Department | Where-Object Department -eq 'IT'

# Schnell: der DC filtert selbst und schickt nur die Treffer
Get-ADUser -Filter "Department -eq 'IT'" -Properties Department
</x-term>

<h3>Formatieren kommt immer zum Schluss</h3>
<div class="note stop"><b>Häufiger Fehler</b>Nach einem <code>Format-Table</code> sind es keine echten Objekte mehr, sondern Formatierungsanweisungen. Ein anschließendes <code>Export-Csv</code> liefert deshalb unbrauchbaren Inhalt. Merksatz: Format-Cmdlets nur ganz am Ende und nie vor einem Export.</div>

<h3>Die Ausgabe verlässt PowerShell</h3>
<div class="tblwrap"><table>
<tr><th>Ziel</th><th>Cmdlet</th><th>Wofür</th></tr>
<tr><td>Bildschirm, tabellarisch</td><td><code>Format-Table -AutoSize</code></td><td>Schneller Blick</td></tr>
<tr><td>Bildschirm, alle Felder</td><td><code>Format-List *</code></td><td>Ein Objekt vollständig erkunden</td></tr>
<tr><td>Sortierbares Fenster</td><td><code>Out-GridView -PassThru</code></td><td>Auswahl durch den Anwender</td></tr>
<tr><td>Tabellenkalkulation</td><td><code>Export-Csv -Delimiter ';'</code></td><td>Auswertung, Übergabe</td></tr>
<tr><td>Bericht</td><td><code>ConvertTo-Html</code></td><td>Dokumentation, Ticketanhang</td></tr>
<tr><td>Zwischenablage</td><td><code>Set-Clipboard</code></td><td>Schnelles Einfügen ins Ticket</td></tr>
</table></div>
`},

{id:"ps-skript", grp:"PowerShell", nav:"Skripte &amp; Remoting", title:"Skripte, Fehler und entfernte Rechner",
lede:"Ab hier wird aus der Konsole Automatisierung: eigene Dateien, kontrollierte Fehler und Befehle, die auf hundert Rechnern gleichzeitig laufen.",
html:`
<h3>Ausführungsrichtlinie</h3>
<p>Eine <code>.ps1</code>-Datei startet nicht per Doppelklick, sondern unterliegt der ExecutionPolicy. Sie ist ein Schutz vor Versehen, keine Sicherheitsgrenze - wer ein Skript ausführen will, kann sie immer umgehen.</p>
<div class="tblwrap"><table>
<tr><th>Einstellung</th><th>Lokal erstelltes Skript</th><th>Heruntergeladenes Skript</th><th>Einsatz</th></tr>
<tr><td><code>Restricted</code></td><td>blockiert</td><td>blockiert</td><td>Standard auf Windows-Clients. Einzelne Befehle gehen, Skriptdateien nicht.</td></tr>
<tr><td><code>AllSigned</code></td><td>nur signiert</td><td>nur signiert</td><td>Hohe Sicherheit, aber jedes eigene Skript braucht ein Codesignaturzertifikat.</td></tr>
<tr><td><code>RemoteSigned</code></td><td>läuft</td><td>nur signiert</td><td>Der übliche Kompromiss und Standard auf Windows Server.</td></tr>
<tr><td><code>Unrestricted</code></td><td>läuft</td><td>läuft nach Rückfrage</td><td>Standard auf Linux und macOS. Auf Windows nur in abgeschotteten Testumgebungen sinnvoll.</td></tr>
<tr><td><code>Bypass</code></td><td>läuft</td><td>läuft</td><td>Keine Prüfung, keine Warnung. Gedacht für einzelne Aufrufe aus anderen Programmen heraus.</td></tr>
<tr><td><code>Undefined</code></td><td colspan="2">keine eigene Festlegung</td><td>Der nächstniedrigere Bereich entscheidet. Sind alle undefiniert, gilt Restricted.</td></tr>
</table></div>

<h4>RemoteSigned im Detail</h4>
<p>Die Unterscheidung zwischen lokal und heruntergeladen ist keine Magie. Beim Download aus dem Internet legt Windows an der Datei einen zusätzlichen NTFS-Datenstrom namens <code>Zone.Identifier</code> an. Darin steht die Herkunftszone: 3 für Internet, 4 für nicht vertrauenswürdige Quellen. Genau daran erkennt RemoteSigned ein fremdes Skript.</p>
<x-term data-k="ps">
# Herkunftsmarkierung sichtbar machen
Get-Item .\\skript.ps1 -Stream *
Get-Content .\\skript.ps1 -Stream Zone.Identifier

# Markierung entfernen, damit das Skript unter RemoteSigned läuft
Unblock-File .\\skript.ps1

# Ganzen Ordner freigeben
Get-ChildItem C:\\Skripte -Filter *.ps1 -Recurse | Unblock-File
</x-term>
<p>Damit wird auch klar, warum ein Skript aus einer E-Mail oder einem heruntergeladenen ZIP-Archiv scheitert, während dieselbe Datei nach dem Kopieren über eine Netzwerkfreigabe anstandslos läuft: Der Datenstrom wandert nicht überall mit. Wichtig ist, dass <code>Unblock-File</code> eine bewusste Entscheidung ist - erst den Inhalt lesen, dann entsperren.</p>

<h4>Unrestricted im Detail</h4>
<p>Unrestricted führt alles aus. Bei Dateien mit Herkunftsmarkierung erscheint noch eine Rückfrage, die sich mit <em>Immer ausführen</em> dauerhaft abschalten lässt - danach gibt es keine Hürde mehr. Auf Linux und macOS ist Unrestricted die Voreinstellung, weil es dort keine Zonen-Datenströme und damit keine sinnvolle Unterscheidung gibt.</p>
<div class="note stop"><b>Warum Unrestricted auf Windows-Arbeitsplätzen nichts zu suchen hat</b>Der Unterschied zu RemoteSigned ist genau der Schutz, der zählt: Ein per Mail hereingereichtes Skript läuft unter RemoteSigned nicht, unter Unrestricted nach einem einzigen Klick. Wer nur ein eigenes Skript testen will, braucht dafür kein Unrestricted - dafür gibt es <code>-Scope Process</code> oder den einmaligen Aufruf mit <code>-ExecutionPolicy Bypass</code>.</div>

<h4>Die Bereiche und ihre Rangfolge</h4>
<p>Es gibt nicht eine Richtlinie, sondern fünf - und sie gewinnen von oben nach unten. Deshalb kann <code>Set-ExecutionPolicy</code> scheinbar wirkungslos bleiben: Eine Gruppenrichtlinie steht darüber.</p>
<div class="tblwrap"><table>
<tr><th>Rang</th><th>Bereich</th><th>Gilt für</th></tr>
<tr><td>1</td><td><code>MachinePolicy</code></td><td>Per Gruppenrichtlinie für den Computer gesetzt - schlägt alles darunter</td></tr>
<tr><td>2</td><td><code>UserPolicy</code></td><td>Per Gruppenrichtlinie für den Benutzer gesetzt</td></tr>
<tr><td>3</td><td><code>Process</code></td><td>Nur diese eine Sitzung, verschwindet beim Schließen</td></tr>
<tr><td>4</td><td><code>CurrentUser</code></td><td>Registrierung unter HKCU, keine Administratorrechte nötig</td></tr>
<tr><td>5</td><td><code>LocalMachine</code></td><td>Registrierung unter HKLM, gilt für alle Benutzer, erfordert Administratorrechte</td></tr>
</table></div>
<x-term data-k="ps">
# Alle fünf Bereiche auf einen Blick - hier steht, wer gerade gewinnt
Get-ExecutionPolicy -List

# Der übliche Weg: nur für den eigenen Benutzer, ohne Adminrechte
Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser

# Nur für diese eine Konsole, wirkt sofort und ist beim Schließen wieder weg
Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope Process

# Eine eigene Festlegung wieder entfernen
Set-ExecutionPolicy -ExecutionPolicy Undefined -Scope CurrentUser
</x-term>
<div class="note warn"><b>Wenn Set-ExecutionPolicy nichts bewirkt</b>Zeigt <code>Get-ExecutionPolicy -List</code> bei <code>MachinePolicy</code> oder <code>UserPolicy</code> einen anderen Wert als Undefined, kommt die Vorgabe aus einer Gruppenrichtlinie. Sie steht unter <em>Computerkonfiguration, Administrative Vorlagen, Windows-Komponenten, Windows PowerShell</em> und lässt sich lokal nicht überschreiben. In der Domäne ist das der Normalfall und beabsichtigt.</div>
<div class="note"><b>Windows PowerShell und PowerShell 7 zählen getrennt</b>Beide führen eigene Einstellungen in der Registrierung. Eine in <code>powershell.exe</code> gesetzte Richtlinie gilt nicht automatisch in <code>pwsh.exe</code> - ein Fehler, der beim Umstieg regelmäßig Zeit kostet.</div>
<x-term data-k="ps">
Get-ExecutionPolicy -List
Set-ExecutionPolicy RemoteSigned -Scope CurrentUser

# Einmalig für einen Aufruf, ohne dauerhafte Änderung
powershell.exe -ExecutionPolicy Bypass -File C:\\skripte\\wartung.ps1
</x-term>

<h3>Ein Skript mit Parametern</h3>
<x-term data-k="ps">
[CmdletBinding()]
param(
    [Parameter(Mandatory)][string]$Abteilung,
    [string]$Ausgabe = "C:\\Berichte\\bericht.csv"
)

Import-Module ActiveDirectory

try {
    $benutzer = Get-ADUser -Filter "Department -eq '$Abteilung'" -Properties Department, Mail, LastLogonDate -ErrorAction Stop

    if (-not $benutzer) {
        Write-Warning "Keine Konten in Abteilung $Abteilung gefunden."
        return
    }

    $benutzer |
        Select-Object Name, SamAccountName, Mail, LastLogonDate |
        Export-Csv $Ausgabe -NoTypeInformation -Delimiter ';' -Encoding UTF8

    Write-Host "$($benutzer.Count) Konten nach $Ausgabe geschrieben." -ForegroundColor Green
}
catch {
    Write-Error "Abfrage fehlgeschlagen: $($_.Exception.Message)"
}
</x-term>
<p>Drei Dinge daran sind wichtiger als der Rest: <code>[CmdletBinding()]</code> schaltet <code>-Verbose</code> und <code>-WhatIf</code> frei, <code>Mandatory</code> erzwingt eine Eingabe, und lange Befehle lassen sich nach einem Pipe-Zeichen oder einem Komma umbrechen - oder mit einem Gravis-Zeichen am Zeilenende, das aber als fehleranfällig gilt.</p>

<h3>Fehlerbehandlung</h3>
<div class="note warn"><b>Der Stolperstein</b><code>try/catch</code> fängt nur <em>abbrechende</em> Fehler. Die meisten Cmdlets erzeugen aber nicht abbrechende Fehler und laufen einfach weiter - der Catch-Block wird dann nie erreicht. Deshalb gehört an jeden kritischen Aufruf <code>-ErrorAction Stop</code>.</div>
<div class="tblwrap"><table>
<tr><th>Wert für -ErrorAction</th><th>Verhalten</th></tr>
<tr><td><code>Continue</code></td><td>Fehler anzeigen, weiterlaufen (Standard)</td></tr>
<tr><td><code>SilentlyContinue</code></td><td>Fehler unterdrücken, weiterlaufen</td></tr>
<tr><td><code>Stop</code></td><td>Abbrechen - macht try/catch erst wirksam</td></tr>
<tr><td><code>Inquire</code></td><td>Nachfragen</td></tr>
</table></div>
<x-term data-k="ps">
# Testlauf vor der echten Änderung
Get-ADUser -Filter "Enabled -eq $false" | Remove-ADUser -WhatIf

# Einzelbestätigung erzwingen
Remove-ADUser m.mustermann -Confirm
</x-term>
<p><code>-WhatIf</code> ist die wichtigste Angewohnheit überhaupt: Es zeigt, was passieren <em>würde</em>, ohne etwas zu tun. Vor jedem Massenlöschen gehört es in die Zeile.</p>

<h3>Remoting: ein Befehl, viele Rechner</h3>
<p>PowerShell-Remoting nutzt WinRM über HTTP auf Port 5985 oder HTTPS auf 5986. In der Domäne wird es meist per Gruppenrichtlinie aktiviert und über Kerberos authentifiziert.</p>
<x-term data-k="ps">
# Einmalig auf dem Ziel aktivieren
Enable-PSRemoting -Force

# Interaktiv auf einem Server arbeiten
Enter-PSSession -ComputerName srv01

# Denselben Befehl auf vielen Rechnern parallel ausführen
Invoke-Command -ComputerName (Get-Content C:\\server.txt) -ScriptBlock {
    Get-Service Spooler | Select-Object @{n='Host';e={$env:COMPUTERNAME}}, Status
}

# Eine lokale Variable in den entfernten Block mitgeben
$dienst = 'Spooler'
Invoke-Command -ComputerName srv01 -ScriptBlock { Get-Service $using:dienst }
</x-term>
<div class="note"><b>Der Vergleich zu CMD</b>Für entfernte Rechner bot die Eingabeaufforderung nur Einzelwerkzeuge mit <code>/s</code>-Parameter wie <code>tasklist /s</code> oder <code>sc \\\\server</code>. Ein allgemeines Verfahren, beliebigen Code auf beliebigen Rechnern auszuführen, gab es nicht. Genau das ist Remoting - und der Hauptgrund, warum in Firmennetzen kein Weg an PowerShell vorbeiführt.</div>

<h3>Nachvollziehbarkeit</h3>
<x-term data-k="ps">
Start-Transcript -Path "C:\\Protokoll\\$(Get-Date -f yyyyMMdd-HHmm).txt"
# ... Arbeit ...
Stop-Transcript
</x-term>
<p>Bei Änderungen an Produktivsystemen ist ein Mitschnitt kein Luxus, sondern die Grundlage dafür, im Zweifel belegen zu können, was gemacht wurde.</p>
`}

);

CHAPTERS.push(

{id:"ad-basis", grp:"Active Directory", nav:"Aufbau", title:"Was Active Directory eigentlich ist",
lede:"Ein Verzeichnisdienst ist eine Datenbank mit Netzwerkanschluss: Sie speichert, wer und was es im Netz gibt, und sie beantwortet die Frage, ob jemand hineindarf.",
html:`
<h3>Die Rollen im Überblick</h3>
<p>Active Directory ist ein Sammelbegriff. Gemeint ist meist AD DS, aber im Rollenkatalog von Windows Server stehen fünf Dienste nebeneinander:</p>
<div class="tblwrap"><table>
<tr><th>Kürzel</th><th>Name</th><th>Aufgabe</th></tr>
<tr><td><strong>AD DS</strong></td><td>Domain Services</td><td>Der Kern: Verzeichnisdatenbank, Anmeldung, Gruppenrichtlinien</td></tr>
<tr><td>AD CS</td><td>Certificate Services</td><td>Eigene Zertifizierungsstelle für die interne PKI</td></tr>
<tr><td>AD FS</td><td>Federation Services</td><td>Anmeldung an fremden Anwendungen ohne zweites Kennwort</td></tr>
<tr><td>AD LDS</td><td>Lightweight Directory Services</td><td>Schlankes Verzeichnis für Anwendungen, ohne Domänenfunktionen</td></tr>
<tr><td>AD RMS</td><td>Rights Management Services</td><td>Rechteschutz an Dokumenten selbst</td></tr>
</table></div>

<h3>Die logische Struktur</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.78rem;line-height:1.8;margin:0;overflow-x:auto;color:#cfe7ef">
GESAMTSTRUKTUR (Forest)  firma.local
  |   gemeinsames Schema, gemeinsamer globaler Katalog,
  |   automatische Vertrauensstellungen zwischen allen Domänen
  |
  +-- STRUKTUR / Tree  firma.local
  |     |
  |     +-- DOMÄNE  firma.local
  |     |     +-- OU=Abteilungen
  |     |     |     +-- OU=Vertrieb   -> GPO "Laufwerke Vertrieb"
  |     |     |     +-- OU=IT         -> GPO "Adminwerkzeuge"
  |     |     +-- OU=Clients
  |     |     +-- CN=Users   (Standardcontainer, KEINE OU!)
  |     |
  |     +-- UNTERDOMÄNE  berlin.firma.local
  |
  +-- zweite Struktur  andere-firma.local   (eigener Namensraum)
</pre>
</div>
<div class="note warn"><b>Container ist nicht gleich OU</b>Die vorgegebenen Behälter <code>CN=Users</code> und <code>CN=Computers</code> sind gewöhnliche Container, keine Organisationseinheiten. An sie lassen sich <strong>keine</strong> Gruppenrichtlinien binden. Deshalb gehört zu jeder sauberen Einrichtung eine eigene OU-Struktur und die Umleitung der Standardablage mit <code>redirusr</code> und <code>redircmp</code>.</div>

<h3>Domänencontroller und Datenbank</h3>
<ul>
<li>Ein <strong>Domänencontroller</strong> ist ein Windows Server mit der Rolle AD DS. Er beantwortet Anmeldungen und hält eine beschreibbare Kopie des Verzeichnisses.</li>
<li>Die Datenbank heißt <code>NTDS.dit</code> und liegt in <code>C:\\Windows\\NTDS</code>.</li>
<li><strong>SYSVOL</strong> ist eine Freigabe auf jedem DC und enthält Gruppenrichtlinienvorlagen und Anmeldeskripte. Sie wird per DFSR zwischen den DCs abgeglichen.</li>
<li>Ein <strong>RODC</strong> ist ein schreibgeschützter DC für unsichere Standorte - er speichert standardmäßig keine Kennwörter.</li>
<li><strong>Mindestens zwei DCs</strong> gehören zum Standard. Fällt der einzige aus, kann sich niemand mehr anmelden.</li>
</ul>

<h3>Das Schema</h3>
<p>Das Schema definiert, welche Objektklassen es gibt und welche Attribute sie haben dürfen. Es gilt für die gesamte Gesamtstruktur und lässt sich erweitern - aber nicht zurücknehmen. Deshalb ist eine Schemaerweiterung, wie sie etwa Exchange mitbringt, eine Entscheidung ohne Rückweg.</p>

<h3>Funktionsebenen</h3>
<p>Domänen- und Gesamtstrukturfunktionsebene bestimmen, welche Merkmale nutzbar sind und welche Betriebssystemversionen als DC erlaubt bleiben. Sie richten sich nach dem ältesten DC und lassen sich nur nach oben ändern.</p>
<x-term data-k="ps">
Get-ADDomain | Select-Object DNSRoot, DomainMode, PDCEmulator
Get-ADForest | Select-Object Name, ForestMode, SchemaMaster, GlobalCatalogs
</x-term>

<h3>Verwaltungswerkzeuge auf dem Arbeitsplatz</h3>
<p>Auf einem Client stehen die AD-Werkzeuge erst nach der Installation von RSAT zur Verfügung. Danach existieren sowohl die Konsolen als auch das PowerShell-Modul.</p>
<x-term data-k="ps">
# Verfügbare RSAT-Bestandteile anzeigen
Get-WindowsCapability -Online -Name RSAT*

# Nur die AD-Werkzeuge nachinstallieren
Add-WindowsCapability -Online -Name Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0

# Prüfen, ob das Modul da ist
Get-Module -ListAvailable ActiveDirectory
</x-term>
<div class="tblwrap"><table>
<tr><th>Konsole</th><th>Aufruf</th><th>Zweck</th></tr>
<tr><td>Benutzer und Computer</td><td><code>dsa.msc</code></td><td>Tägliche Objektverwaltung</td></tr>
<tr><td>Verwaltungscenter</td><td><code>dsac.exe</code></td><td>Modernere Oberfläche, Papierkorb, PowerShell-Verlauf</td></tr>
<tr><td>Standorte und Dienste</td><td><code>dssite.msc</code></td><td>Subnetze, Standorte, Replikation</td></tr>
<tr><td>Domänen und Vertrauensstellungen</td><td><code>domain.msc</code></td><td>Trusts, Funktionsebenen</td></tr>
<tr><td>Gruppenrichtlinienverwaltung</td><td><code>gpmc.msc</code></td><td>GPOs, Vererbung, Modellierung</td></tr>
<tr><td>Attribut-Editor</td><td><code>adsiedit.msc</code></td><td>Rohzugriff auf Attribute - mit Vorsicht</td></tr>
</table></div>
`},

{id:"ad-objekte", grp:"Active Directory", nav:"Objekte &amp; Gruppen", title:"Benutzer, Gruppen und Berechtigungen",
lede:"Jedes Objekt hat einen eindeutigen Namen, eine unveränderliche SID und einen Platz in der Struktur. Wer diese drei Dinge auseinanderhält, versteht auch AGDLP.",
html:`
<h3>Namen und Kennungen</h3>
<div class="tblwrap"><table>
<tr><th>Bezeichnung</th><th>Beispiel</th><th>Eigenschaft</th></tr>
<tr><td>Distinguished Name (DN)</td><td><code>CN=Max Mustermann,OU=Vertrieb,DC=firma,DC=local</code></td><td>Eindeutiger Pfad, ändert sich beim Verschieben</td></tr>
<tr><td>sAMAccountName</td><td><code>m.mustermann</code></td><td>Klassischer Anmeldename, maximal 20 Zeichen</td></tr>
<tr><td>UserPrincipalName (UPN)</td><td><code>m.mustermann@firma.local</code></td><td>Moderner Anmeldename im Mailformat</td></tr>
<tr><td>SID</td><td><code>S-1-5-21-...-1108</code></td><td>Unveränderlich, daran hängen alle Berechtigungen</td></tr>
<tr><td>GUID</td><td><code>objectGUID</code></td><td>Weltweit eindeutig, bleibt über alle Umzüge hinweg gleich</td></tr>
</table></div>
<div class="note"><b>Warum die SID so wichtig ist</b>NTFS-Berechtigungen speichern keine Namen, sondern SIDs. Ein gelöschtes und namensgleich neu angelegtes Konto bekommt eine neue SID - und verliert damit sämtliche Zugriffe. Deshalb gilt beim Austritt eines Mitarbeiters: deaktivieren, nicht löschen. Das Konto lässt sich später einem Nachfolger zuweisen oder sauber archivieren.</div>

<h3>Gruppentypen und Gültigkeitsbereiche</h3>
<p>Zwei Merkmale werden häufig verwechselt. Der <strong>Typ</strong> entscheidet, ob die Gruppe Rechte vergeben kann. Der <strong>Bereich</strong> entscheidet, wer Mitglied sein darf und wo die Gruppe verwendbar ist.</p>
<div class="tblwrap"><table>
<tr><th>Bereich</th><th>Mitglieder aus</th><th>Verwendbar in</th></tr>
<tr><td>Lokal in Domäne</td><td>Gesamter Gesamtstruktur</td><td>Nur in der eigenen Domäne - typisch für Ressourcenrechte</td></tr>
<tr><td>Global</td><td>Nur eigene Domäne</td><td>Gesamte Gesamtstruktur - typisch für Rollen und Abteilungen</td></tr>
<tr><td>Universal</td><td>Gesamter Gesamtstruktur</td><td>Gesamte Gesamtstruktur - Mitgliedschaften liegen im globalen Katalog</td></tr>
</table></div>
<ul>
<li><strong>Sicherheitsgruppe:</strong> bekommt eine SID, kann in Berechtigungen stehen.</li>
<li><strong>Verteilergruppe:</strong> dient ausschließlich als E-Mail-Verteiler. Sie ist kein Sicherheitsprinzipal, taucht deshalb nicht im Zugriffstoken auf und kann <em>keine</em> Berechtigungen erhalten.</li>
</ul>

<h3>AGDLP - das Berechtigungsmuster</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.8rem;line-height:1.85;margin:0;overflow-x:auto;color:#cfe7ef">
 A ccount          Max Mustermann
    |  kommt in
 G lobal Group     G-Vertrieb            (die Rolle: "wer ist das")
    |  wird Mitglied von
 D omain L ocal    FS-Vertrieb-Aendern   (die Ressource: "worauf")
    |  erhält
 P ermission       NTFS: Ändern auf D:\\Daten\\Vertrieb
</pre>
</div>
<p>Der Sinn dahinter: Auf dem Ordner steht nur <em>eine</em> Berechtigung, die sich nie mehr ändert. Wer künftig Zugriff bekommt, wird in die globale Gruppe aufgenommen - am Dateisystem muss niemand mehr etwas anfassen. In Gesamtstrukturen mit mehreren Domänen kommt eine universelle Gruppe dazwischen, daraus wird AGUDLP.</p>
<x-term data-k="ps">
# Die beiden Gruppen anlegen
New-ADGroup -Name "G-Vertrieb"          -GroupScope Global      -GroupCategory Security -Path "OU=Gruppen,DC=firma,DC=local"
New-ADGroup -Name "FS-Vertrieb-Aendern" -GroupScope DomainLocal -GroupCategory Security -Path "OU=Gruppen,DC=firma,DC=local"

# Verschachteln und Benutzer aufnehmen
Add-ADGroupMember "FS-Vertrieb-Aendern" -Members "G-Vertrieb"
Add-ADGroupMember "G-Vertrieb"          -Members m.mustermann

# Prüfen, wer am Ende tatsächlich berechtigt ist
Get-ADGroupMember "FS-Vertrieb-Aendern" -Recursive | Select-Object Name, objectClass
</x-term>
<x-term data-k="cmd">
:: Die Ressourcengruppe auf den Ordner berechtigen
icacls D:\\Daten\\Vertrieb /grant "FIRMA\\FS-Vertrieb-Aendern":(OI)(CI)M /t
</x-term>

<h3>NTFS und Freigabe greifen zusammen</h3>
<p>Bei einem Netzwerkzugriff gelten beide Berechtigungsebenen. Das Ergebnis ist immer die <strong>restriktivere</strong> der beiden. Lokal am Rechner zählt dagegen nur NTFS.</p>
<div class="tblwrap"><table>
<tr><th>Freigabe</th><th>NTFS</th><th>Effektiv über das Netz</th></tr>
<tr><td>Vollzugriff</td><td>Lesen</td><td>Lesen</td></tr>
<tr><td>Lesen</td><td>Vollzugriff</td><td>Lesen</td></tr>
<tr><td>Ändern</td><td>Ändern</td><td>Ändern</td></tr>
</table></div>
<p>Die verbreitete Praxis: Auf der Freigabe wird großzügig berechtigt, die Feinsteuerung passiert vollständig über NTFS. Ein ausdrückliches Verweigern schlägt übrigens jedes Erlauben - auch das aus einer anderen Gruppe.</p>

<h3>Wichtige Benutzerattribute</h3>
<div class="tblwrap"><table>
<tr><th>Attribut</th><th>Bedeutung</th></tr>
<tr><td><code>userAccountControl</code></td><td>Bitfeld: aktiviert, Kennwort läuft nie ab, Smartcard erforderlich</td></tr>
<tr><td><code>pwdLastSet</code></td><td>Zeitpunkt der letzten Kennwortänderung</td></tr>
<tr><td><code>lastLogonTimestamp</code></td><td>Letzte Anmeldung, wird nur alle 9 bis 14 Tage repliziert</td></tr>
<tr><td><code>lockoutTime</code></td><td>Zeitpunkt der Sperrung</td></tr>
<tr><td><code>memberOf</code></td><td>Gruppenmitgliedschaften, ohne die primäre Gruppe</td></tr>
<tr><td><code>proxyAddresses</code></td><td>Alle E-Mail-Adressen, von Exchange genutzt</td></tr>
<tr><td><code>manager</code></td><td>Vorgesetzter als DN - Basis für Organigramme</td></tr>
</table></div>
<div class="note warn"><b>Achtung bei lastLogon</b><code>lastLogon</code> wird gar nicht repliziert und ist auf jedem DC unterschiedlich. Verwertbar ist nur <code>lastLogonTimestamp</code> beziehungsweise die davon abgeleitete Eigenschaft <code>LastLogonDate</code> - und selbst die ist bis zu zwei Wochen ungenau.</div>
`},

{id:"ad-technik", grp:"Active Directory", nav:"Technik darunter", title:"DNS, Kerberos, Ports und Replikation",
lede:"Fast jede AD-Störung lässt sich auf drei Ursachen zurückführen: falsches DNS, abweichende Uhrzeit oder blockierte Ports. Diese Seite erklärt, warum.",
html:`
<h3>Ohne DNS kein Active Directory</h3>
<p>Ein Client weiß nicht, wo sein Domänencontroller steht. Er fragt DNS - genauer gesagt nach SRV-Einträgen unterhalb von <code>_msdcs</code>. Zeigt ein Mitgliedsrechner auf einen öffentlichen DNS-Server statt auf den internen, findet er den DC nicht und die Anmeldung an der Domäne scheitert, obwohl das Internet funktioniert.</p>
<x-term data-k="cmd">
:: Welche Domänencontroller kennt das DNS?
nslookup -type=SRV _ldap._tcp.dc._msdcs.firma.local

:: Welchen DC benutzt dieser Rechner gerade?
nltest /dsgetdc:firma.local
echo %LOGONSERVER%
</x-term>
<x-term data-k="ps">
Resolve-DnsName _ldap._tcp.dc._msdcs.firma.local -Type SRV
Get-DnsClientServerAddress -AddressFamily IPv4
</x-term>

<h3>Kerberos und die Uhrzeit</h3>
<p>Die Anmeldung läuft über Kerberos. Der DC ist gleichzeitig Schlüsselverteilungscenter: Er stellt beim Anmelden ein Ticket-Granting-Ticket aus, mit dem der Client später Diensttickets für Dateiserver und Anwendungen abholt.</p>
<ul>
<li>Kerberos-Tickets enthalten einen Zeitstempel. Weicht die Uhr um mehr als <strong>5 Minuten</strong> ab, wird das Ticket abgelehnt.</li>
<li>Die Zeitquelle der Domäne ist der <strong>PDC-Emulator</strong> der Stammdomäne. Alle anderen DCs und alle Clients richten sich daran aus.</li>
<li>Das Ticket enthält die Gruppenmitgliedschaften. Deshalb wirken neue Gruppen erst nach einer neuen Anmeldung.</li>
<li>NTLM existiert noch als Rückfallebene, gilt aber als veraltet und wird schrittweise zurückgedrängt.</li>
</ul>
<x-term data-k="cmd">
w32tm /query /status
w32tm /resync /force
klist
klist purge
</x-term>

<h3>Die Ports, die man kennen muss</h3>
<div class="tblwrap"><table>
<tr><th>Port</th><th>Protokoll</th><th>Wofür</th></tr>
<tr><td>53</td><td>DNS (TCP/UDP)</td><td>Auffinden der Domänencontroller</td></tr>
<tr><td>88</td><td>Kerberos</td><td>Authentifizierung</td></tr>
<tr><td>135</td><td>RPC Endpoint Mapper</td><td>Replikation, Verwaltungswerkzeuge</td></tr>
<tr><td>389</td><td>LDAP</td><td>Verzeichnisabfragen im Klartext bzw. signiert</td></tr>
<tr><td>636</td><td>LDAPS</td><td>LDAP über TLS</td></tr>
<tr><td>445</td><td>SMB</td><td>SYSVOL, Gruppenrichtlinien, Dateifreigaben</td></tr>
<tr><td>464</td><td>kpasswd</td><td>Kennwortänderungen</td></tr>
<tr><td>3268 / 3269</td><td>Globaler Katalog</td><td>Gesamtstrukturweite Suche, mit und ohne TLS</td></tr>
<tr><td>5985 / 5986</td><td>WinRM</td><td>PowerShell-Remoting über HTTP bzw. HTTPS</td></tr>
<tr><td>9389</td><td>ADWS</td><td>Active Directory Web Services - Basis des PowerShell-Moduls</td></tr>
</table></div>
<x-term data-k="ps">
389,636,88,445,9389 | ForEach-Object {
    Test-NetConnection dc01 -Port $_ |
        Select-Object @{n='Port';e={$_.RemotePort}}, TcpTestSucceeded
}
</x-term>

<h3>Die fünf FSMO-Rollen</h3>
<p>Manche Aufgaben verträgt kein verteiltes System. Sie liegen deshalb bei genau einem DC.</p>
<div class="tblwrap"><table>
<tr><th>Rolle</th><th>Ebene</th><th>Aufgabe</th><th>Wenn sie ausfällt</th></tr>
<tr><td>Schemamaster</td><td>Gesamtstruktur</td><td>Einzige Stelle für Schemaänderungen</td><td>Nur bei Schemaerweiterungen spürbar</td></tr>
<tr><td>Domänennamenmaster</td><td>Gesamtstruktur</td><td>Hinzufügen und Entfernen von Domänen</td><td>Nur bei Strukturänderungen spürbar</td></tr>
<tr><td>RID-Master</td><td>Domäne</td><td>Verteilt Blöcke relativer Kennungen für neue SIDs</td><td>Irgendwann lassen sich keine neuen Objekte mehr anlegen</td></tr>
<tr><td>PDC-Emulator</td><td>Domäne</td><td>Zeitquelle, Kennwortänderungen, Kontosperrungen, GPO-Bearbeitung</td><td>Sofort spürbar: Anmeldeprobleme, Zeitabweichung</td></tr>
<tr><td>Infrastrukturmaster</td><td>Domäne</td><td>Pflegt Verweise auf Objekte anderer Domänen</td><td>Nur in Umgebungen mit mehreren Domänen relevant</td></tr>
</table></div>
<x-term data-k="cmd">
netdom query fsmo
</x-term>
<x-term data-k="ps">
Get-ADForest | Select-Object SchemaMaster, DomainNamingMaster
Get-ADDomain | Select-Object PDCEmulator, RIDMaster, InfrastructureMaster
</x-term>
<div class="note warn"><b>Übertragen oder entreißen</b>Solange beide DCs erreichbar sind, wird eine Rolle sauber <em>übertragen</em> (transfer). Ist der Rolleninhaber endgültig verloren, wird sie <em>entrissen</em> (seize) - danach darf der alte DC nie wieder ins Netz, sonst entsteht ein Konflikt.</div>

<h3>Globaler Katalog</h3>
<p>Ein globaler Katalog enthält alle Objekte der gesamten Gesamtstruktur, aber nur mit einer Teilmenge der Attribute. Er beantwortet strukturweite Suchen und wird bei der Anmeldung gebraucht, um universelle Gruppen aufzulösen. In Umgebungen mit mehreren Standorten gehört an jeden Standort mindestens einer.</p>

<h3>Replikation</h3>
<ul>
<li><strong>Innerhalb eines Standorts</strong> wird nahezu sofort repliziert, unkomprimiert, angestoßen durch Änderungsbenachrichtigungen.</li>
<li><strong>Zwischen Standorten</strong> läuft die Replikation nach Zeitplan und komprimiert - üblich sind 180 Minuten.</li>
<li>Kritische Änderungen wie Kontosperrungen werden <strong>dringend</strong> repliziert und warten nicht auf den Zeitplan.</li>
<li>Der Knowledge Consistency Checker baut die Replikationstopologie automatisch auf.</li>
</ul>
<x-term data-k="cmd">
repadmin /replsummary
repadmin /showrepl dc02
dcdiag /test:replications
</x-term>
<p>Wenn ein frisch zurückgesetztes Kennwort auf einem Rechner funktioniert und auf einem anderen nicht, lohnt fast immer ein Blick hierher - der zweite Rechner hat einen anderen DC erwischt.</p>
`},

{id:"ad-gpo", grp:"Active Directory", nav:"Gruppenrichtlinien", title:"Gruppenrichtlinien",
lede:"Mit GPOs wird zentral festgelegt, wie Rechner und Benutzer sich verhalten. Die Kunst liegt weniger in den Einstellungen als in der Frage, welches Objekt am Ende gewinnt.",
html:`
<h3>Aufbau eines GPO</h3>
<p>Ein Gruppenrichtlinienobjekt besteht aus zwei Teilen: dem Container im Verzeichnis und der Vorlage im SYSVOL. Es enthält zwei Konfigurationszweige:</p>
<ul>
<li><strong>Computerkonfiguration</strong> - wird beim Systemstart angewendet und gilt für den Rechner, unabhängig davon, wer sich anmeldet.</li>
<li><strong>Benutzerkonfiguration</strong> - wird bei der Anmeldung angewendet und folgt dem Benutzer auf jeden Rechner.</li>
</ul>
<p>Verknüpft wird ein GPO mit einem Standort, einer Domäne oder einer OU - niemals mit einer Gruppe. Gruppen kommen nur in der Sicherheitsfilterung ins Spiel.</p>

<h3>Die Verarbeitungsreihenfolge: LSDOU</h3>
<div class="card">
<pre style="font-family:var(--mono);font-size:.82rem;line-height:1.9;margin:0;overflow-x:auto;color:#cfe7ef">
 L  Lokale Richtlinie        zuerst
 S  Standort (Site)
 D  Domäne
 O  OU                       von oben nach unten
 U  untergeordnete OU        zuletzt - und gewinnt damit
</pre>
</div>
<p>Wer zuletzt schreibt, gewinnt. Widersprechen sich zwei Einstellungen, setzt sich also die am tiefsten verknüpfte durch. Innerhalb derselben Ebene entscheidet die Verknüpfungsreihenfolge - dort gewinnt die <strong>niedrigste</strong> Nummer.</p>
<div class="tblwrap"><table>
<tr><th>Sonderfall</th><th>Wirkung</th></tr>
<tr><td>Vererbung deaktivieren</td><td>An einer OU werden alle Richtlinien von oben ignoriert</td></tr>
<tr><td>Erzwungen (Enforced)</td><td>Schlägt die Blockade und kehrt die Reihenfolge um - das erzwungene GPO gewinnt gegen alles Tiefere</td></tr>
<tr><td>Sicherheitsfilterung</td><td>GPO gilt nur für bestimmte Gruppen, erfordert das Recht "Gruppenrichtlinie übernehmen"</td></tr>
<tr><td>WMI-Filter</td><td>GPO gilt nur, wenn eine Abfrage zutrifft, etwa nur auf Notebooks</td></tr>
<tr><td>Loopbackverarbeitung</td><td>Benutzereinstellungen richten sich nach dem Rechner statt nach dem Benutzer - typisch für Terminalserver und Kioskrechner</td></tr>
</table></div>

<h3>Wann Richtlinien greifen</h3>
<ul>
<li>Computerrichtlinien beim Start, Benutzerrichtlinien bei der Anmeldung.</li>
<li>Im laufenden Betrieb alle <strong>90 Minuten</strong> plus einem Zufallswert von bis zu 30 Minuten, damit nicht alle Clients gleichzeitig anfragen.</li>
<li>Auf Domänencontrollern alle 5 Minuten.</li>
<li>Manche Erweiterungen - etwa Softwareinstallation, Ordnerumleitung oder Laufwerkszuordnung - greifen nur beim Start oder bei der Anmeldung. Deshalb reicht <code>gpupdate /force</code> nicht immer aus.</li>
</ul>
<x-term data-k="cmd">

gpupdate /target:user /force /logoff

:: Der wichtigste Diagnosebefehl überhaupt
gpresult /h C:\\gpo-bericht.html /f
gpresult /r /scope:computer
</x-term>

# GPOs sichern - die einzige eingebaute Versionierung

<h3>Häufige Störungsbilder</h3>
<div class="tblwrap"><table>
<tr><th>Symptom</th><th>Wahrscheinliche Ursache</th><th>Prüfen mit</th></tr>
<tr><td>GPO wirkt gar nicht</td><td>Objekt liegt in <code>CN=Users</code> statt in einer OU</td><td><code>Get-ADUser x -Properties DistinguishedName</code></td></tr>
<tr><td>GPO wirkt bei einem Benutzer nicht</td><td>Sicherheitsfilterung schließt ihn aus</td><td><code>gpresult /r</code> - Abschnitt "Herausgefilterte GPOs"</td></tr>
<tr><td>Falsche Einstellung gewinnt</td><td>Tiefere OU oder ein erzwungenes GPO überschreibt</td><td>RSoP-Bericht in der GPMC</td></tr>
<tr><td>Laufwerk fehlt</td><td>Einstellung wirkt nur bei der Anmeldung</td><td>Ab- und wieder anmelden, dann <code>net use</code></td></tr>
<tr><td>Nichts kommt an</td><td>SYSVOL nicht erreichbar oder Replikation gestört</td><td><code>dcdiag /test:sysvolcheck</code>, <code>repadmin /replsummary</code></td></tr>
</table></div>

{id:"praxis", grp:"Anwenden", nav:"Praxisszenarien", title:"Vier Abläufe von Anfang bis Ende",
lede:"Jetzt greifen die drei Welten ineinander. Diese Abläufe entsprechen dem, was im ersten Jahr im Betrieb tatsächlich auf dem Tisch landet.",
html:`
<h3>1. Neuer Mitarbeiter, vollständig eingerichtet</h3>
<x-term data-k="ps">
Import-Module ActiveDirectory

$vorname = 'Anna'; $nachname = 'Berger'
$sam     = 'a.berger'
$ou      = 'OU=Vertrieb,OU=Abteilungen,DC=firma,DC=local'

New-ADUser -Name "$vorname $nachname" -GivenName $vorname -Surname $nachname &#96;
    -DisplayName "$nachname, $vorname" -SamAccountName $sam &#96;
    -UserPrincipalName "$sam@firma.local" -Path $ou &#96;
    -AccountPassword (Read-Host 'Startkennwort' -AsSecureString) &#96;
    -ChangePasswordAtLogon $true -Enabled $true &#96;
    -Department 'Vertrieb' -Title 'Sachbearbeiterin' -Office 'Berlin'

Add-ADGroupMember 'G-Vertrieb' -Members $sam
Add-ADGroupMember 'G-Drucker-EG' -Members $sam

# Kontrolle
Get-ADUser $sam -Properties Department,Title,MemberOf |
    Select-Object Name,Department,Title,@{n='Gruppen';e={($_.MemberOf | ForEach-Object {($_ -split ',')[0] -replace 'CN='}) -join ', '}}
</x-term>

<h3>2. Zwanzig Konten aus einer Tabelle anlegen</h3>
<p>Die CSV enthält die Spalten <code>Vorname;Nachname;Kuerzel;Abteilung</code>. Erst ein Testlauf, dann der Ernstfall.</p>
<x-term data-k="ps">
$start = Read-Host 'Startkennwort' -AsSecureString

Import-Csv C:\\neu.csv -Delimiter ';' -Encoding UTF8 | ForEach-Object {
    $params = @{
        Name              = "$($_.Vorname) $($_.Nachname)"
        GivenName         = $_.Vorname
        Surname           = $_.Nachname
        SamAccountName    = $_.Kuerzel
        UserPrincipalName = "$($_.Kuerzel)@firma.local"
        Department        = $_.Abteilung
        Path              = "OU=$($_.Abteilung),OU=Abteilungen,DC=firma,DC=local"
        AccountPassword   = $start
        ChangePasswordAtLogon = $true
        Enabled           = $true
    }
    try   { New-ADUser @params -ErrorAction Stop; Write-Host "OK  $($_.Kuerzel)" -ForegroundColor Green }
    catch { Write-Warning "FEHLER $($_.Kuerzel): $($_.Exception.Message)" }
}
</x-term>
<p>Die Technik mit der Hashtabelle heißt Splatting. Sie hält lange Befehle lesbar und erlaubt es, Parameter abhängig von Bedingungen zu setzen.</p>

<h3>3. Störung: Benutzer kommt nicht mehr auf sein Laufwerk</h3>
<div class="tblwrap"><table>
<tr><th>Schritt</th><th>Befehl</th><th>Was die Antwort bedeutet</th></tr>
<tr><td>1. Konto gesperrt?</td><td><code>Search-ADAccount -LockedOut</code></td><td>Treffer: entsperren mit <code>Unlock-ADAccount</code></td></tr>
<tr><td>2. Konto aktiv?</td><td><code>Get-ADUser a.berger -Properties Enabled,LockedOut</code></td><td>Enabled False: der Austrittsprozess hat zugeschlagen</td></tr>
<tr><td>3. Gruppe vorhanden?</td><td><code>Get-ADPrincipalGroupMembership a.berger</code></td><td>Fehlt die Gruppe, hier ergänzen</td></tr>
<tr><td>4. Im Token angekommen?</td><td><code>whoami /groups</code> am Client</td><td>Fehlt sie hier trotz AD-Eintrag: neu anmelden oder <code>klist purge</code></td></tr>
<tr><td>5. Erreicht er den Server?</td><td><code>Test-NetConnection srv01 -Port 445</code></td><td>False: Netz, Firewall oder Namensauflösung</td></tr>
<tr><td>6. Richtige Berechtigung?</td><td><code>Get-ADGroupMember 'FS-...' -Recursive</code></td><td>Zeigt, wer tatsächlich Zugriff hat</td></tr>
<tr><td>7. GPO-Laufwerk da?</td><td><code>gpresult /h bericht.html</code></td><td>Zeigt, ob die Zuordnung überhaupt angekommen ist</td></tr>
</table></div>

<h3>4. Bestandsaufnahme für die Dokumentation</h3>
<x-term data-k="ps">
$datum = Get-Date -Format 'yyyy-MM-dd'

# Inaktive Konten der letzten 90 Tage
Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly |
    Where-Object Enabled -eq $true |
    Select-Object Name, SamAccountName, LastLogonDate |
    Export-Csv "C:\\Doku\\inaktiv_$datum.csv" -NoTypeInformation -Delimiter ';' -Encoding UTF8

# Betriebssysteme im Netz zählen
Get-ADComputer -Filter * -Properties OperatingSystem |
    Group-Object OperatingSystem |
    Sort-Object Count -Descending |
    Select-Object Count, Name

# Mitglieder aller administrativen Gruppen
'Domänen-Admins','Organisations-Admins','Schema-Admins' | ForEach-Object {
    Get-ADGroupMember $_ -Recursive |
        Select-Object @{n='Gruppe';e={$_}}, Name, SamAccountName
}
</x-term>

systeminfo > C:\\Doku\\pc042.txt
ipconfig /all >> C:\\Doku\\pc042.txt

/* ---- Terminalblöcke aus <x-term> erzeugen ---- */
var KLASSEN = { cmd:["t-cmd","Eingabeaufforderung"], ps:["t-ps","PowerShell"], ad:["t-ad","Active Directory"] };

function termsAufbauen(root){
  var list = root.querySelectorAll("x-term");
  Array.prototype.forEach.call(list, function(el){
    var art  = el.getAttribute("data-k") || "cmd";
    var meta = KLASSEN[art] || KLASSEN.cmd;
    var code = el.textContent.replace(/^\n+/,"").replace(/\s+$/,"");

    var box = document.createElement("div");
    box.className = "term";

    var head = document.createElement("div");
    head.className = "term-head";
    var tag = document.createElement("span");
    tag.className = "tag " + meta[0];
    tag.textContent = meta[1];
    var btn = document.createElement("button");
    btn.className = "copy";
    btn.type = "button";
    btn.textContent = "Kopieren";
    btn.addEventListener("click", function(){
      kopieren(code, btn);
    });
    head.appendChild(tag);
    head.appendChild(btn);

    var pre = document.createElement("pre");
    pre.textContent = code;

    box.appendChild(head);
    box.appendChild(pre);
    el.parentNode.replaceChild(box, el);
  });
}

function kopieren(text, btn){
  var fertig = function(){
    var alt = btn.textContent;
    btn.textContent = "Kopiert";
    setTimeout(function(){ btn.textContent = alt; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(fertig, function(){ ersatzKopie(text, fertig); });
  } else {
    ersatzKopie(text, fertig);
  }
}
function ersatzKopie(text, fertig){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); fertig(); } catch(e) {}
  document.body.removeChild(ta);
}

    }

    html += '<button class="' + klasse + '" data-go="' + e.id + '">' +

  nav.innerHTML = html;

/* ---- Ansichten ---- */
function zeige(id){
  state.view = id;
  var main = document.getElementById("main");
  main.innerHTML = "";

  var kap = CHAPTERS.filter(function(c){ return c.id === id; })[0];
  if (kap) { kapitelZeichnen(main, kap); }
  else if (id === "befehle")   { befehleZeichnen(main); }
  else if (id === "quiz")      { quizZeichnen(main); }
  else if (id === "quellen")   { quellenZeichnen(main); }
  else if (id === "impressum") { impressumZeichnen(main); }

  navBauen();
  window.scrollTo(0, 0);
  try { location.hash = id; } catch(e) {}
}

function kapitelZeichnen(main, kap){
  var idx  = CHAPTERS.indexOf(kap);
  var prev = CHAPTERS[idx - 1];
  var next = CHAPTERS[idx + 1];

  var wrap = document.createElement("div");
  wrap.className = "view on";
  wrap.innerHTML =
    '<div class="eyebrow">' + kap.grp + " · Kapitel " + (idx + 1) + " von " + CHAPTERS.length + "</div>" +
    "<h2>" + kap.title + "</h2>" +
    '<div class="lede">' + kap.lede + "</div>" +
    kap.html +
    '<div class="pager">' +
      '<label class="readtoggle"><input type="checkbox" id="gelesen"' + (state.read[kap.id] ? " checked" : "") + "> Kapitel verstanden</label>" +
      '<div class="spacer" style="flex:1"></div>' +
      (prev ? '<button class="btn ghost" data-nav="' + prev.id + '">Zurück</button>' : "") +
      (next ? '<button class="btn" data-nav="' + next.id + '">Weiter</button>' : '<button class="btn" data-nav="quiz">Zum Wissenstest</button>') +
    "</div>";
  main.appendChild(wrap);

  termsAufbauen(wrap);

  wrap.querySelector("#gelesen").addEventListener("change", function(e){
    if (e.target.checked) { state.read[kap.id] = 1; } else { delete state.read[kap.id]; }
    speichern();
    navBauen();
  });
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ zeige(b.getAttribute("data-nav")); });
  });
}

function trefferZeichnen(){
  var liste = document.getElementById("trefferliste");
  var zahl  = document.getElementById("trefferzahl");
  if (!liste) { return; }

  var q = state.suche.toLowerCase().trim();
  var treffer = ALL_CMDS.filter(function(c){
    if (state.filter !== "alle" && c.s !== state.filter) { return false; }
    if (!q) { return true; }
    return (c.n + " " + c.short + " " + c.desc + " " + c.ex + " " + c.rel + " " + c.k).toLowerCase().indexOf(q) > -1;
  });

  zahl.textContent = treffer.length + " von " + ALL_CMDS.length + " Befehlen";

  if (!treffer.length) {
    liste.innerHTML = '<div class="card">Kein Treffer. Andere Schreibweise oder allgemeineren Begriff versuchen - die Suche greift auch auf Beschreibungen und Beispiele zu.</div>';
    return;
  }

  var html = "";
  var letzte = null;
  treffer.forEach(function(c, i){
    var kopf = c.label + " · " + c.k;
    if (kopf !== letzte) {
      html += '<div class="catline">' + kopf + "</div>";
      letzte = kopf;
    }
    html +=
      '<div class="cmdrow s-' + c.s + '" data-i="' + i + '">' +
        '<button type="button"><span class="name">' + esc(c.n) + '</span><span class="short">' + esc(c.short) + "</span></button>" +
        '<div class="body">' +
          "<p>" + esc(c.desc) + "</p>" +
          (c.ex ? '<div class="ex">' + esc(c.ex) + "</div>" : "") +
          (c.rel ? '<div class="rel">' + esc(c.rel) + "</div>" : "") +
        "</div>" +
      "</div>";
  });
  liste.innerHTML = html;

  Array.prototype.forEach.call(liste.querySelectorAll(".cmdrow > button"), function(b){
    b.addEventListener("click", function(){ b.parentNode.classList.toggle("open"); });
  });
}

/* ---- Wissenstest ---- */
function mischen(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var quizReihe = null;

function quizZeichnen(main){
  if (!quizReihe) { quizReihe = mischen(QUIZ); }
  state.quizRichtig = 0;
  state.quizBeantwortet = 0;
  var wrap = document.createElement("div");
  wrap.className = "view on";

    '<div class="scorebox" id="score"></div>' +
    '<div id="fragen"></div>' +
    '<div class="pager"><button class="btn ghost" id="neustart">Neu mischen</button></div>';
  main.appendChild(wrap);

  wrap.querySelector("#neustart").addEventListener("click", function(){
    quizReihe = mischen(QUIZ);
    state.quizRichtig = 0;
    state.quizBeantwortet = 0;
    zeige("quiz");
  });

  var box = wrap.querySelector("#fragen");
  quizReihe.forEach(function(f, i){
    var div = document.createElement("div");
    div.className = "q";
    div.innerHTML =
      '<div class="qtext">' + (i + 1) + ". " + esc(f[0]) + ' <span style="color:var(--ink-faint);font-weight:400;font-size:.82rem">(' + f[4] + ")</span></div>" +
      f[1].map(function(o, j){ return '<button class="opt" data-j="' + j + '">' + esc(o) + "</button>"; }).join("") +
      '<div class="expl"><strong>' + esc(f[1][f[2]]) + "</strong><br>" + esc(f[3]) + "</div>";
    box.appendChild(div);

    Array.prototype.forEach.call(div.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        var gewaehlt = parseInt(b.getAttribute("data-j"), 10);
        Array.prototype.forEach.call(div.querySelectorAll(".opt"), function(x, xi){
          x.disabled = true;
          if (xi === f[2]) { x.classList.add("right"); }
          else if (xi === gewaehlt) { x.classList.add("wrong"); }
        });
        div.querySelector(".expl").classList.add("on");
        state.quizBeantwortet++;
        if (gewaehlt === f[2]) { state.quizRichtig++; }
        punkteAktualisieren();
      });
    });
  });
  punkteAktualisieren();
}

function punkteAktualisieren(){
  var el = document.getElementById("score");
  if (!el) { return; }
  var quote = state.quizBeantwortet ? Math.round(state.quizRichtig / state.quizBeantwortet * 100) : 0;
  el.textContent = state.quizBeantwortet + " beantwortet · " + state.quizRichtig + " richtig · " + quote + " %";
}

  var icon = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));

  var apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon;
  document.head.appendChild(apple);

  var fav = document.createElement("link");
  fav.rel = "icon";
  fav.type = "image/svg+xml";
  fav.href = icon;
  document.head.appendChild(fav);

  try {
    var manifest = {
      name: "Konsole & Verzeichnis",
      short_name: "Konsole",
      start_url: ".",
      display: "standalone",
      background_color: "#06121a",
      theme_color: "#06121a",
      description: "Lern-App für Windows CMD, PowerShell und Active Directory",
      icons: [
        { src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
        { src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    var m = document.createElement("link");
    m.rel = "manifest";
    m.href = URL.createObjectURL(blob);
    document.head.appendChild(m);
  } catch(e) {}

  var meta = document.createElement("meta");
  meta.name = "apple-mobile-web-app-capable";
  meta.content = "yes";
  document.head.appendChild(meta);
})();

/* ---- Menü auf kleinen Bildschirmen ---- */
function menuSchliessen(){
  document.getElementById("sideNav").classList.remove("open");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("menuBtn").addEventListener("click", function(){
  document.getElementById("sideNav").classList.toggle("open");
  document.getElementById("scrim").classList.toggle("on");
});
document.getElementById("scrim").addEventListener("click", menuSchliessen);

var startId = (location.hash || "").replace("#", "");
var gueltig = CHAPTERS.some(function(c){ return c.id === startId; }) ||
              EXTRA_VIEWS.some(function(v){ return v.id === startId; });
zeige(gueltig ? startId : "start");
