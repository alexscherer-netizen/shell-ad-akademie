<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lern-App für Windows CMD, PowerShell und Active Directory - Konzepte, Befehle und ihre Zusammenhänge.">
<meta name="theme-color" content="#06121a">
<title>Konsole &amp; Verzeichnis – CMD, PowerShell, Active Directory</title>
<style>
:root{
  --bg:#06121a;
  --bg-deep:#040c12;
  --panel:#0c1c26;
  --panel-2:#102530;
  --line:#1b3a48;
  --line-soft:#153040;
  --ink:#d8e8ef;
  --ink-dim:#8aa8b6;
  --ink-faint:#5f7d8c;

  --teal:#2dd4bf;
  --emerald:#34d399;
  --ps:#6ea8fe;
  --ps-deep:#1e5fa8;
  --cmd:#c6d4dc;
  --ad:#2dd4bf;
  --amber:#f0b429;
  --rose:#f87171;

  --mono:"Cascadia Mono","Consolas","SF Mono","DejaVu Sans Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;

  --r:10px;
  --shell-w:280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 620px at 78% -12%,rgba(45,212,191,.10),transparent 62%),
             radial-gradient(760px 480px at 4% 104%,rgba(110,168,254,.08),transparent 60%);
}
a{color:var(--teal)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.55rem;margin-top:0}
h3{font-size:1.12rem;margin-top:2rem;color:#eaf5f9}
h4{font-size:.98rem;margin-top:1.4rem;color:var(--teal);font-weight:600}
p{margin:0 0 1rem}
ul,ol{margin:0 0 1rem;padding-left:1.25rem}
li{margin-bottom:.4rem}
code{font-family:var(--mono);font-size:.88em;background:#0a1f2a;border:1px solid var(--line-soft);
  border-radius:5px;padding:.1em .38em;color:#a9e9dd;white-space:nowrap}
strong{color:#f0fafd;font-weight:600}

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem .8rem;
  padding-top:calc(.55rem + env(safe-area-inset-top));
  background:rgba(4,12,18,.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:600;font-size:.98rem;letter-spacing:-.01em;min-width:0}
.brand .caret{font-family:var(--mono);color:var(--teal);flex:0 0 auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:9px;font-size:1.05rem;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--teal);color:var(--teal)}
.spacer{flex:1}
.progress-mini{display:flex;align-items:center;gap:.45rem;font-size:.74rem;color:var(--ink-faint);font-family:var(--mono)}
.progress-mini .track{width:56px;height:5px;border-radius:3px;background:#0e2836;overflow:hidden}
.progress-mini .fill{height:100%;background:linear-gradient(90deg,var(--ps),var(--teal));width:0%}

/* ---------- Navigation ---------- */
.shell{display:flex}
nav.side{
  width:var(--shell-w);flex:0 0 var(--shell-w);
  position:sticky;top:53px;align-self:flex-start;z-index:2;
  height:calc(100vh - 53px);overflow-y:auto;
  border-right:1px solid var(--line);
  padding:1rem .6rem 3rem;
  background:var(--bg-deep);
}
nav.side .navgroup{font-size:.68rem;letter-spacing:.09em;color:var(--ink-faint);
  font-family:var(--mono);margin:1.3rem .6rem .45rem;text-transform:uppercase}
nav.side .navgroup:first-child{margin-top:0}
.navitem{
  display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
  background:none;border:0;border-left:2px solid transparent;
  color:var(--ink-dim);font:inherit;font-size:.9rem;
  padding:.46rem .6rem;border-radius:0 7px 7px 0;cursor:pointer;
}
.navitem:hover{background:#0d2029;color:var(--ink)}
.navitem.active{background:#0f2a36;color:#eafcf8;border-left-color:var(--teal)}
.navitem .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#22414f}
.navitem.done .dot{background:var(--emerald);box-shadow:0 0 7px rgba(52,211,153,.55)}
.navitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Inhalt ---------- */
main{flex:1;min-width:0;padding:1.6rem 1.5rem 6rem;max-width:900px;position:relative;z-index:1}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:.74rem;color:var(--ink-faint);margin-bottom:.35rem}
.lede{color:var(--ink-dim);font-size:1.02rem;border-left:2px solid var(--line);padding-left:.9rem;margin-bottom:1.8rem}

/* ---------- Bausteine ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin:1.1rem 0}
.card.tight{padding:.75rem .9rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin:1.1rem 0}

.term{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r);
  margin:1rem 0;overflow:hidden;
}
.term-head{
  display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;
  background:var(--panel-2);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
}
.term-head .tag{padding:.05rem .4rem;border-radius:4px;font-size:.66rem;letter-spacing:.04em}
.tag.t-cmd{background:#243139;color:var(--cmd)}
.tag.t-ps{background:#122a4a;color:var(--ps)}
.tag.t-ad{background:#0d3b39;color:var(--ad)}
.term pre{
  margin:0;padding:.8rem .85rem;overflow-x:auto;
  font-family:var(--mono);font-size:.83rem;line-height:1.7;color:#cfe7ef;
  -webkit-overflow-scrolling:touch;
}
.term pre .c{color:var(--ink-faint)}
.term pre .p{color:var(--emerald)}
.term pre .o{color:var(--amber)}
.term pre .s{color:#e79ad8}
.copy{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink-faint);
  border-radius:5px;font-size:.66rem;font-family:var(--mono);padding:.1rem .4rem;cursor:pointer}
.copy:hover{color:var(--teal);border-color:var(--teal)}

.note{border-left:3px solid var(--teal);background:#0b2129;padding:.75rem .9rem;border-radius:0 8px 8px 0;margin:1.1rem 0;font-size:.94rem}
.note.warn{border-left-color:var(--amber);background:#231c0c}
.note.stop{border-left-color:var(--rose);background:#241214}
.note b{display:block;margin-bottom:.2rem;color:#eafcf8}

.tblwrap{overflow-x:auto;margin:1.1rem 0;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:480px}
th{background:var(--panel-2);text-align:left;padding:.55rem .7rem;font-weight:600;color:#eafcf8;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:.82rem}
td{padding:.55rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-dim)}
tr:last-child td{border-bottom:0}
td code{white-space:normal}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0}
.chip{
  background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:20px;padding:.28rem .75rem;font-size:.8rem;cursor:pointer;font:inherit;font-size:.8rem;
}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip.on{background:#0f3038;border-color:var(--teal);color:#a9f0e4}

/* ---------- Befehlssuche ---------- */
.searchbar{display:flex;gap:.5rem;margin:1rem 0;position:sticky;top:53px;z-index:20;
  background:var(--bg);padding:.6rem 0}
.searchbar input{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font:inherit;font-size:.95rem;padding:.6rem .8rem;font-family:var(--mono);
}
.searchbar input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.cmdrow{
  border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  background:var(--panel);margin-bottom:.55rem;overflow:hidden;
}
.cmdrow.s-cmd{border-left-color:#6e8493}
.cmdrow.s-ps{border-left-color:var(--ps)}
.cmdrow.s-ad{border-left-color:var(--ad)}
.cmdrow > button{
  width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;
  padding:.6rem .8rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline;
}
.cmdrow > button:hover{background:var(--panel-2)}
.cmdrow .name{font-family:var(--mono);font-size:.88rem;color:#a9e9dd;flex:0 0 auto}
.cmdrow.s-ps .name{color:#a8c9ff}
.cmdrow.s-cmd .name{color:#dbe6ec}
.cmdrow .short{font-size:.83rem;color:var(--ink-faint);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdrow .body{display:none;padding:0 .8rem .8rem;font-size:.89rem;border-top:1px solid var(--line-soft)}
.cmdrow.open .body{display:block}
.cmdrow .body p{margin:.7rem 0 .5rem;color:var(--ink-dim)}
.cmdrow .body .ex{font-family:var(--mono);font-size:.8rem;background:var(--bg-deep);
  border:1px solid var(--line-soft);border-radius:7px;padding:.5rem .6rem;overflow-x:auto;white-space:pre;color:#cfe7ef}
.cmdrow .body .rel{font-size:.78rem;color:var(--ink-faint);margin-top:.5rem}
.counter{font-family:var(--mono);font-size:.78rem;color:var(--ink-faint);margin:.4rem 0 .8rem}
.catline{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
  margin:1.4rem 0 .5rem;border-bottom:1px solid var(--line-soft);padding-bottom:.25rem}

/* ---------- Quiz ---------- */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:.9rem}
.q .qtext{font-weight:500;margin-bottom:.75rem;color:#eafcf8}
.opt{display:block;width:100%;text-align:left;background:var(--bg-deep);border:1px solid var(--line);
  color:var(--ink-dim);border-radius:8px;padding:.55rem .75rem;margin-bottom:.4rem;cursor:pointer;font:inherit;font-size:.92rem}
.opt:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--emerald);background:#0d2a20;color:#b6f0d6}
.opt.wrong{border-color:var(--rose);background:#2a1416;color:#f3b8b8}
.expl{font-size:.86rem;color:var(--ink-dim);border-left:2px solid var(--teal);padding-left:.7rem;margin-top:.6rem;display:none}
.expl.on{display:block}
.btn{background:linear-gradient(135deg,var(--ps-deep),#0d6a63);border:0;color:#eafcf8;font:inherit;
  font-weight:600;padding:.6rem 1.1rem;border-radius:9px;cursor:pointer;font-size:.93rem}
.btn:hover{filter:brightness(1.14)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-dim);font-weight:400}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal)}
.scorebox{font-family:var(--mono);font-size:.85rem;color:var(--ink-dim);margin-bottom:1rem}

/* ---------- Fußnavigation ---------- */
.pager{display:flex;gap:.6rem;align-items:center;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.readtoggle{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-dim);cursor:pointer;user-select:none}
.readtoggle input{accent-color:var(--emerald);width:17px;height:17px}

/* ---------- Quellenliste ---------- */
.src{display:block;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:.7rem .85rem;margin-bottom:.55rem;text-decoration:none;color:inherit}
.src:hover{border-color:var(--teal)}
.src .t{color:#eafcf8;font-size:.93rem;font-weight:500}
.src .u{font-family:var(--mono);font-size:.73rem;color:var(--ink-faint);word-break:break-all}
.src .d{font-size:.83rem;color:var(--ink-dim);margin-top:.2rem}

/* ---------- Impressum ---------- */
.legal dt{font-size:.74rem;color:var(--ink-faint);font-family:var(--mono);margin-top:.6rem}
.legal dd{margin:0;color:var(--ink)}
.paypal{display:inline-block;background:#ffc439;color:#12232e;font-weight:700;text-decoration:none;
  padding:.6rem 1.3rem;border-radius:24px;margin:.4rem 0}
.paypal:hover{filter:brightness(1.07)}

.scrim{display:none}
@media(max-width:860px){
  main{padding:1.1rem 1rem 5rem;max-width:100%}
  nav.side{
    position:fixed;top:0;left:0;height:100%;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;
    padding-top:calc(1rem + env(safe-area-inset-top));width:270px;
  }
  nav.side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(2,8,12,.66);z-index:55;opacity:0;
    pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  h2{font-size:1.34rem}
  .searchbar{top:0}
  body{font-size:15.5px}
}
@media(min-width:861px){ .iconbtn.menu{display:none} }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn menu" id="menuBtn" aria-label="Navigation öffnen">☰</button>
  <div class="brand"><span class="caret">PS&gt;</span><span>Konsole &amp; Verzeichnis</span></div>

    <div class="track"><div class="fill" id="progFill"></div></div>

</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="side" id="sideNav"></nav>
  <main id="main"></main>
</div>

<script>

/* =====================================================================

var CMD_DB = [
["cmd","Shell-Grundlagen","Startet eine neue Instanz des Befehlsinterpreters","cmd.exe ist der Interpreter selbst. /c führt einen Befehl aus und beendet sich, /k führt aus und bleibt offen. Liegt unter %SystemRoot%\\System32\\cmd.exe.","cmd /c \"ipconfig /all\"\ncmd /k cd C:\\Temp","PowerShell-Pendant: pwsh -Command bzw. powershell -Command"],
["help","Shell-Grundlagen","Listet die eingebauten Befehle auf","Zeigt nur die internen Befehle von cmd.exe. Externe Programme (z.B. ping.exe) stehen nicht in dieser Liste - die findest du über where oder die Microsoft-Referenz.","help\nhelp dir","PowerShell: Get-Command und Get-Help"],
["<befehl> /?","Shell-Grundlagen","Zeigt die Hilfe zu einem Befehl","Der Standardweg zur Syntax. Fast jedes Windows-Kommandozeilenwerkzeug unterstützt /? - manche zusätzlich -h oder --help.","robocopy /?\nnetsh /?","PowerShell: Get-Help <Cmdlet> -Full"],
["cls","Shell-Grundlagen","Leert den Bildschirminhalt","Löscht nur die Anzeige, nicht den Verlauf oder Variablen.","cls","PowerShell: Clear-Host (Alias cls)"],
["exit","Shell-Grundlagen","Beendet die Sitzung","Mit /b wird nur das aktuelle Batch-Skript beendet, nicht die Konsole. Der optionale Code landet in ERRORLEVEL.","exit\nexit /b 1","PowerShell: exit, $LASTEXITCODE"],
["doskey","Shell-Grundlagen","Verwaltet Makros und den Befehlsverlauf","doskey /history gibt alle Befehle der Sitzung aus - praktisch für die Dokumentation dessen, was du gerade gemacht hast.","doskey /history > verlauf.txt\ndoskey ll=dir /a $*","PowerShell: Get-History, Set-Alias"],
["title","Shell-Grundlagen","Setzt den Fenstertitel","Hilfreich, wenn mehrere Konsolen offen sind.","title Wartung Server01",""],
["color","Shell-Grundlagen","Ändert Vorder- und Hintergrundfarbe","Zwei Hex-Ziffern: erste = Hintergrund, zweite = Schrift.","color 0A",""],
["chcp","Shell-Grundlagen","Zeigt oder setzt die Codepage","Wichtig bei Umlautproblemen. 850 ist die deutsche DOS-Codepage, 65001 ist UTF-8.","chcp 65001","PowerShell: $OutputEncoding, [Console]::OutputEncoding"],
["prompt","Shell-Grundlagen","Verändert die Eingabeaufforderung","$P = Pfad, $G = Größer-Zeichen, $T = Uhrzeit.","prompt $T$G","PowerShell: function prompt {...}"],
["ver","Shell-Grundlagen","Zeigt die Windows-Version","Sehr grobe Ausgabe. systeminfo oder winver liefern mehr.","ver","PowerShell: [Environment]::OSVersion"],

["dir","Dateisystem","Listet Dateien und Ordner","/a zeigt auch versteckte und Systemdateien, /s durchsucht Unterordner, /b liefert die nackte Liste ohne Kopfzeilen (gut für Skripte), /o sortiert.","dir /a /s /b C:\\Logs\\*.log\ndir /o-d","PowerShell: Get-ChildItem (Aliase dir, ls, gci)"],
["cd","Dateisystem","Wechselt das Verzeichnis","Ohne /d wechselt cd nicht das Laufwerk. cd .. geht eine Ebene hoch.","cd /d D:\\Daten\ncd ..","PowerShell: Set-Location (Aliase cd, sl)"],
["pushd","Dateisystem","Merkt sich das Verzeichnis und wechselt","Bei einem UNC-Pfad bindet pushd automatisch einen temporären Laufwerksbuchstaben ein - das ist der eigentliche Trick daran.","pushd \\\\srv01\\share\npopd","PowerShell: Push-Location / Pop-Location"],
["popd","Dateisystem","Kehrt zum gemerkten Verzeichnis zurück","Hebt eine per pushd gesetzte temporäre Netzlaufwerksverbindung wieder auf.","popd","PowerShell: Pop-Location"],
["md","Dateisystem","Erstellt ein Verzeichnis","Auch mkdir. Legt bei aktivierten Befehlserweiterungen ganze Pfadketten auf einmal an.","md C:\\Projekt\\2026\\Q1","PowerShell: New-Item -ItemType Directory"],
["rd","Dateisystem","Löscht ein Verzeichnis","Auch rmdir. /s löscht rekursiv, /q ohne Rückfrage. Diese Kombination ist endgültig - kein Papierkorb.","rd /s /q C:\\Temp\\Alt","PowerShell: Remove-Item -Recurse -Force"],
["del","Dateisystem","Löscht Dateien","/f auch schreibgeschützte, /s in Unterordnern, /q ohne Nachfrage. Kein Papierkorb.","del /f /s /q C:\\Temp\\*.tmp","PowerShell: Remove-Item"],
["copy","Dateisystem","Kopiert einzelne Dateien","Der älteste Kopierbefehl. Kann keine Verzeichnisbäume - dafür xcopy oder robocopy.","copy C:\\a.txt D:\\b.txt","PowerShell: Copy-Item"],
["xcopy","Dateisystem","Kopiert Verzeichnisbäume","/e inklusive leerer Ordner, /h versteckte Dateien, /k Attribute behalten, /y ohne Rückfrage überschreiben. Gilt als veraltet zugunsten von robocopy.","xcopy C:\\Quelle D:\\Ziel /e /h /i /y","robocopy ist der moderne Nachfolger"],
["robocopy","Dateisystem","Robustes Kopieren und Spiegeln","Das Arbeitspferd für Migrationen. /mir spiegelt exakt (löscht im Ziel, was in der Quelle fehlt), /copyall überträgt alle NTFS-Informationen inkl. ACLs, /r und /w begrenzen Wiederholversuche, /log schreibt Protokoll. Rückgabecodes unter 8 bedeuten Erfolg.","robocopy C:\\Daten D:\\Backup /mir /copyall /r:2 /w:5 /log:C:\\rc.log","Achtung: /mir löscht im Ziel. Vorher mit /l testen."],
["move","Dateisystem","Verschiebt oder benennt um","Innerhalb eines Laufwerks nur ein Verzeichniseintrag-Update, über Laufwerke hinweg echtes Kopieren plus Löschen.","move C:\\alt.txt D:\\neu.txt","PowerShell: Move-Item"],
["ren","Dateisystem","Benennt Dateien um","Auch rename. Kann nicht zwischen Verzeichnissen verschieben.","ren bericht.txt bericht_alt.txt","PowerShell: Rename-Item"],
["type","Dateisystem","Gibt Dateiinhalt aus","Der schnelle Blick in eine Textdatei.","type C:\\Logs\\app.log","PowerShell: Get-Content (Aliase cat, type, gc)"],
["more","Dateisystem","Seitenweise Ausgabe","Wird meist über die Pipe genutzt, wenn eine Ausgabe zu lang ist.","dir /s | more","PowerShell: Out-Host -Paging, more"],
["tree","Dateisystem","Zeigt die Ordnerstruktur grafisch","/f zeigt zusätzlich die Dateien, /a nutzt ASCII statt Grafikzeichen (wichtig beim Umleiten in Dateien).","tree C:\\Projekt /f /a > struktur.txt",""],
["fc","Dateisystem","Vergleicht zwei Dateien","/b vergleicht binär. Gut zum Prüfen, ob zwei Konfigurationen identisch sind.","fc /b datei1.dll datei2.dll","PowerShell: Compare-Object"],
["comp","Dateisystem","Vergleicht Dateien byteweise","Ältere Alternative zu fc.","comp a.bin b.bin",""],
["findstr","Dateisystem","Durchsucht Dateien nach Textmustern","Das grep von Windows. /i ignoriert Groß-/Kleinschreibung, /s sucht rekursiv, /n zeigt Zeilennummern, /c:\"...\" sucht eine feste Zeichenkette, /r erlaubt reguläre Ausdrücke.","findstr /s /i /n /c:\"Fehler 0x\" C:\\Logs\\*.log","PowerShell: Select-String (Alias sls)"],
["find","Dateisystem","Sucht eine Zeichenkette in Dateien","Älter und schwächer als findstr, kann aber mit /c zählen.","tasklist | find /c \"chrome\"","PowerShell: Select-String"],

["tracert","Netzwerk","Verfolgt den Weg zum Ziel","Zeigt jeden Router (Hop) auf dem Pfad. -d verzichtet auf Namensauflösung und ist dadurch schneller.","tracert -d 1.1.1.1","PowerShell: Test-NetConnection -TraceRoute"],
["pathping","Netzwerk","Kombiniert tracert mit Paketverlustmessung","Braucht deutlich länger, zeigt dafür pro Hop die Verlustrate - gut bei sporadischen Aussetzern.","pathping -q 50 srv01",""],
["nslookup","Netzwerk","Fragt DNS-Einträge ab","Interaktiv oder direkt. set type=SRV ist der Schlüssel zur AD-Fehlersuche, weil Clients ihre Domänencontroller über SRV-Records finden.","nslookup -type=SRV _ldap._tcp.dc._msdcs.firma.local","PowerShell: Resolve-DnsName"],

["netsh","Netzwerk","Umfangreiches Netzwerk-Konfigurationswerkzeug","Arbeitet mit Kontexten. interface ip für Adressen, wlan für Funknetze, advfirewall für die Firewall, winsock reset als letzte Rettung bei kaputtem Netzwerkstack.","netsh interface ip set address \"Ethernet\" static 192.168.1.50 255.255.255.0 192.168.1.1\nnetsh wlan show profiles\nnetsh advfirewall set allprofiles state off","PowerShell: NetTCPIP- und NetSecurity-Module"],
["nbtstat","Netzwerk","NetBIOS-Informationen über TCP/IP","-n lokale Namen, -A fragt eine IP ab. Nur noch in älteren Umgebungen relevant.","nbtstat -A 192.168.1.20",""],
["telnet","Netzwerk","Prüft, ob ein TCP-Port erreichbar ist","Muss als optionales Feature nachinstalliert werden. Ein schwarzer Bildschirm bedeutet: Port offen.","telnet dc01 389","PowerShell: Test-NetConnection -Port 389"],

["curl","Netzwerk","HTTP-Anfragen von der Konsole","Seit Windows 10 1803 ist curl.exe fester Bestandteil von Windows. Achtung: In Windows PowerShell 5.1 ist curl ein Alias für Invoke-WebRequest und ruft gerade nicht das echte curl auf. In PowerShell 7 wurde dieser Alias entfernt, dort landet curl beim echten Programm.","curl -I https://www.microsoft.com","PowerShell: Invoke-WebRequest, Invoke-RestMethod"],

["net user","Benutzer &amp; Gruppen","Verwaltet Benutzerkonten","Ohne Zusatz lokale Konten, mit /domain die AD-Konten. Zeigt Ablaufdatum, letzte Anmeldung und Gruppenmitgliedschaften. Passwörter direkt im Befehl zu setzen landet im Verlauf - im AD lieber PowerShell verwenden.","net user max.mustermann /domain\nnet user azubi Start2026! /add","PowerShell: Get-LocalUser bzw. Get-ADUser"],
["net localgroup","Benutzer &amp; Gruppen","Verwaltet lokale Gruppen","Der schnellste Weg, ein Domänenkonto zum lokalen Administrator zu machen.","net localgroup Administratoren FIRMA\\it-support /add","PowerShell: Add-LocalGroupMember"],
["net group","Benutzer &amp; Gruppen","Verwaltet globale Domänengruppen","Läuft nur gegen einen Domänencontroller.","net group \"Vertrieb\" max.mustermann /add /domain","PowerShell: Add-ADGroupMember"],

["net view","Benutzer &amp; Gruppen","Listet Freigaben eines Rechners","","net view \\\\srv01","PowerShell: Get-SmbShare -CimSession"],

["sc","System &amp; Prozesse","Verwaltet Dienste auf Systemebene","query zeigt den Status, qc die Konfiguration, config ändert den Starttyp, create und delete legen Dienste an oder entfernen sie. Achtung auf das Leerzeichen nach dem Gleichheitszeichen.","sc query Spooler\nsc config Spooler start= disabled","PowerShell: Get-Service, Set-Service"],

["systeminfo","System &amp; Prozesse","Zeigt eine vollständige Systemübersicht","Enthält Betriebssystemversion, Installationsdatum, Hotfixes, Arbeitsspeicher, Domäne und Anmeldeserver - ideal für die Erstdokumentation eines Rechners.","systeminfo\nsysteminfo | findstr /i \"Domäne Systemstartzeit\"","PowerShell: Get-ComputerInfo"],

["Get-ExecutionPolicy","Skripting","Zeigt die Skriptausführungsrichtlinie","Restricted verhindert jedes Skript, RemoteSigned verlangt eine Signatur nur für heruntergeladene Skripte und ist der übliche Kompromiss, Unrestricted erlaubt alles. Die Richtlinie ist ein Schutz vor Versehen, keine echte Sicherheitsgrenze.","Get-ExecutionPolicy -List",""],
["Set-ExecutionPolicy","Skripting","Setzt die Ausführungsrichtlinie","-Scope CurrentUser vermeidet Administratorrechte und systemweite Wirkung.","Set-ExecutionPolicy RemoteSigned -Scope CurrentUser",""],
["RemoteSigned","Skripting","Ausführungsrichtlinie: lokal frei, fremd nur signiert","Wert für Set-ExecutionPolicy und der übliche Kompromiss. Lokal erstellte Skripte laufen ohne Signatur, heruntergeladene nur mit gültiger Signatur. Erkannt wird die Herkunft am NTFS-Datenstrom Zone.Identifier, den Windows beim Download anlegt. Standardwert auf Windows Server.","Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser","Fremdes Skript trotzdem freigeben: Unblock-File"],
["Unrestricted","Skripting","Ausführungsrichtlinie: alles erlaubt","Führt jedes Skript aus; bei heruntergeladenen Dateien erscheint noch eine Rückfrage, die sich dauerhaft abschalten lässt. Voreinstellung auf Linux und macOS, weil es dort keine Herkunftsmarkierung gibt. Auf Windows-Arbeitsplätzen ungeeignet - für einen Test reicht -Scope Process.","Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope Process","Sicherere Alternative: RemoteSigned oder ein einmaliges -ExecutionPolicy Bypass"],
["Unblock-File","Skripting","Entfernt die Herkunftsmarkierung einer Datei","Löscht den NTFS-Datenstrom Zone.Identifier. Danach gilt die Datei als lokal und läuft auch unter RemoteSigned. Erst den Inhalt prüfen, dann entsperren.","Unblock-File .\\skript.ps1\nGet-ChildItem C:\\Skripte -Filter *.ps1 -Recurse | Unblock-File","Sichtbar machen: Get-Item datei.ps1 -Stream *"],

["Start-Sleep","Skripting","Pausiert die Ausführung","-Seconds oder -Milliseconds.","Start-Sleep -Seconds 5","CMD: timeout"],
["Read-Host","Skripting","Fragt eine Eingabe ab","-AsSecureString für Kennwörter.","$name = Read-Host \"Benutzername\"","CMD: set /p"],
["Try/Catch","Skripting","Strukturierte Fehlerbehandlung","Fängt nur abbrechende Fehler ab. Mit -ErrorAction Stop lassen sich auch normale Fehler zu abbrechenden machen - sonst läuft der Catch-Block nie an.","try { Get-ADUser xyz -ErrorAction Stop } catch { Write-Warning $_.Exception.Message }","CMD: if errorlevel"],
["Get-Date","Skripting","Liefert Datum und Uhrzeit als Objekt","-Format für Zeichenketten, AddDays für Zeitrechnung. Grundlage jeder Filterung nach Zeiträumen.","Get-Date -Format 'yyyy-MM-dd HH:mm'\n(Get-Date).AddDays(-90)","CMD: date /t, time /t"],
