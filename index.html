function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---- Terminalblöcke aus <x-term> erzeugen ---- */
var KLASSEN = { cmd:["t-cmd","Eingabeaufforderung"], ps:["t-ps","PowerShell"], ad:["t-ad","Active Directory"] };

function termsAufbauen(root){
  var list = root.querySelectorAll("x-term");
  Array.prototype.forEach.call(list, function(el){
    var art  = el.getAttribute("data-k") || "cmd";
    var meta = KLASSEN[art] || KLASSEN.cmd;
    var code = el.textContent.replace(/^\n+/,"").replace(/\s+$/,"");

    var box = document.createElement("div");
    box.className = "term";

    var head = document.createElement("div");
    head.className = "term-head";
    var tag = document.createElement("span");
    tag.className = "tag " + meta[0];
    tag.textContent = meta[1];
    var btn = document.createElement("button");
    btn.className = "copy";
    btn.type = "button";
    btn.textContent = "Kopieren";
    btn.addEventListener("click", function(){
      kopieren(code, btn);
    });
    head.appendChild(tag);
    head.appendChild(btn);

    var pre = document.createElement("pre");
    pre.textContent = code;

    box.appendChild(head);
    box.appendChild(pre);
    el.parentNode.replaceChild(box, el);
  });
}

function kopieren(text, btn){
  var fertig = function(){
    var alt = btn.textContent;
    btn.textContent = "Kopiert";
    setTimeout(function(){ btn.textContent = alt; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(fertig, function(){ ersatzKopie(text, fertig); });
  } else {
    ersatzKopie(text, fertig);
  }
}
function ersatzKopie(text, fertig){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); fertig(); } catch(e) {}
  document.body.removeChild(ta);
}

/* ---- Navigation ---- */
function navBauen(){
  var nav = document.getElementById("sideNav");
  var alle = CHAPTERS.map(function(c){ return {id:c.id, grp:c.grp, nav:c.nav}; }).concat(EXTRA_VIEWS);
  var html = "";
  var letzteGruppe = null;

  alle.forEach(function(e){
    if (e.grp !== letzteGruppe) {
      html += '<div class="navgroup">' + e.grp + "</div>";
      letzteGruppe = e.grp;
    }
    var istKapitel = CHAPTERS.some(function(c){ return c.id === e.id; });
    var klasse = "navitem" + (state.view === e.id ? " active" : "") + (state.read[e.id] ? " done" : "");
    html += '<button class="' + klasse + '" data-go="' + e.id + '">' +
            (istKapitel ? '<span class="dot"></span>' : '<span class="dot" style="background:transparent"></span>') +
            '<span class="lbl">' + e.nav + "</span></button>";
  });
  nav.innerHTML = html;

  Array.prototype.forEach.call(nav.querySelectorAll("[data-go]"), function(b){
    b.addEventListener("click", function(){
      zeige(b.getAttribute("data-go"));
      menuSchliessen();
    });
  });
  fortschrittAktualisieren();
}

function fortschrittAktualisieren(){
  var gesamt = CHAPTERS.length;
  var fertig = CHAPTERS.filter(function(c){ return state.read[c.id]; }).length;
  document.getElementById("progFill").style.width = (gesamt ? Math.round(fertig / gesamt * 100) : 0) + "%";
  document.getElementById("progTxt").textContent = fertig + "/" + gesamt;
}

/* ---- Ansichten ---- */
function zeige(id){
  state.view = id;
  var main = document.getElementById("main");
  main.innerHTML = "";

  var kap = CHAPTERS.filter(function(c){ return c.id === id; })[0];
  if (kap) { kapitelZeichnen(main, kap); }
  else if (id === "befehle")   { befehleZeichnen(main); }
  else if (id === "katalog")   { katalogZeichnen(main); }
  else if (id === "generator") { generatorZeichnen(main); }
  else if (id === "quiz")      { quizZeichnen(main); }
  else if (id === "quellen")   { quellenZeichnen(main); }
  else if (id === "impressum") { impressumZeichnen(main); }

  navBauen();
  window.scrollTo(0, 0);
  try { location.hash = id; } catch(e) {}
}

function kapitelZeichnen(main, kap){
  var idx  = CHAPTERS.indexOf(kap);
  var prev = CHAPTERS[idx - 1];
  var next = CHAPTERS[idx + 1];

  var wrap = document.createElement("div");
  wrap.className = "view on";
  wrap.innerHTML =
    '<div class="eyebrow">' + kap.grp + " · Kapitel " + (idx + 1) + " von " + CHAPTERS.length + "</div>" +
    "<h2>" + kap.title + "</h2>" +
    '<div class="lede">' + kap.lede + "</div>" +
    kap.html +
    '<div class="pager">' +
      '<label class="readtoggle"><input type="checkbox" id="gelesen"' + (state.read[kap.id] ? " checked" : "") + "> Kapitel verstanden</label>" +
      '<div class="spacer" style="flex:1"></div>' +
      (prev ? '<button class="btn ghost" data-nav="' + prev.id + '">Zurück</button>' : "") +
      (next ? '<button class="btn" data-nav="' + next.id + '">Weiter</button>' : '<button class="btn" data-nav="quiz">Zum Wissenstest</button>') +
    "</div>";
  main.appendChild(wrap);

  termsAufbauen(wrap);

  wrap.querySelector("#gelesen").addEventListener("change", function(e){
    if (e.target.checked) { state.read[kap.id] = 1; } else { delete state.read[kap.id]; }
    speichern();
    navBauen();
  });
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ zeige(b.getAttribute("data-nav")); });
  });
}

/* ---- Befehlssuche ---- */
function befehleZeichnen(main){
  var wrap = document.createElement("div");
  wrap.className = "view on";
  wrap.innerHTML =
    '<div class="eyebrow">Nachschlagen</div>' +
    "<h2>Befehlssuche</h2>" +
    '<div class="lede">' + ALL_CMDS.length + " Befehle aus allen drei Welten, nach Bereichen sortiert. Suchbar nach Namen, Beschreibung und Beispiel - auch nach dem, was ein Befehl tut.</div>" +
    '<div class="searchbar"><input type="search" id="suchfeld" placeholder="z. B. gruppe, port, kennwort, robocopy" autocomplete="off" spellcheck="false"></div>' +
    '<div class="chips" id="filterchips"></div>' +
    '<div class="counter" id="trefferzahl"></div>' +
    '<div id="trefferliste"></div>';
  main.appendChild(wrap);

  var chips = [["alle","Alle"],["cmd","Eingabeaufforderung"],["ps","PowerShell"],["ad","Active Directory"]];
  var cbox = wrap.querySelector("#filterchips");
  cbox.innerHTML = chips.map(function(c){
    return '<button class="chip' + (state.filter === c[0] ? " on" : "") + '" data-f="' + c[0] + '">' + c[1] + "</button>";
  }).join("");
  Array.prototype.forEach.call(cbox.querySelectorAll("[data-f]"), function(b){
    b.addEventListener("click", function(){
      state.filter = b.getAttribute("data-f");
      Array.prototype.forEach.call(cbox.querySelectorAll(".chip"), function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      trefferZeichnen();
    });
  });

  var feld = wrap.querySelector("#suchfeld");
  feld.value = state.suche;
  feld.addEventListener("input", function(){
    state.suche = feld.value;
    trefferZeichnen();
  });

  trefferZeichnen();
}

function trefferZeichnen(){
  var liste = document.getElementById("trefferliste");
  var zahl  = document.getElementById("trefferzahl");
  if (!liste) { return; }

  var q = state.suche.toLowerCase().trim();
  var treffer = ALL_CMDS.filter(function(c){
    if (state.filter !== "alle" && c.s !== state.filter) { return false; }
    if (!q) { return true; }
    return (c.n + " " + c.short + " " + c.desc + " " + c.ex + " " + c.rel + " " + c.k).toLowerCase().indexOf(q) > -1;
  });

  zahl.textContent = treffer.length + " von " + ALL_CMDS.length + " Befehlen";

  if (!treffer.length) {
    liste.innerHTML = '<div class="card">Kein Treffer. Andere Schreibweise oder allgemeineren Begriff versuchen - die Suche greift auch auf Beschreibungen und Beispiele zu.</div>';
    return;
  }

  var html = "";
  var letzte = null;
  treffer.forEach(function(c, i){
    var kopf = c.label + " · " + c.k;
    if (kopf !== letzte) {
      html += '<div class="catline">' + kopf + "</div>";
      letzte = kopf;
    }
    html +=
      '<div class="cmdrow s-' + c.s + '" data-i="' + i + '">' +
        '<button type="button"><span class="name">' + esc(c.n) + '</span><span class="short">' + esc(c.short) + "</span></button>" +
        '<div class="body">' +
          "<p>" + esc(c.desc) + "</p>" +
          (c.ex ? '<div class="ex">' + esc(c.ex) + "</div>" : "") +
          (c.rel ? '<div class="rel">' + esc(c.rel) + "</div>" : "") +
        "</div>" +
      "</div>";
  });
  liste.innerHTML = html;

  Array.prototype.forEach.call(liste.querySelectorAll(".cmdrow > button"), function(b){
    b.addEventListener("click", function(){ b.parentNode.classList.toggle("open"); });
  });
}

/* ---- Cmdlet-Katalog ---- */
function katalogModule(){
  var m = {}, reihenfolge = [];
  CMDLET_DB.forEach(function(c){
    if (!m[c[0]]) { m[c[0]] = 0; reihenfolge.push(c[0]); }
    m[c[0]]++;
  });
  return reihenfolge.map(function(name){ return {name:name, anzahl:m[name]}; });
}

function katalogZeichnen(main){
  var module = katalogModule();
  var wrap = document.createElement("div");
  wrap.className = "view on";
  wrap.innerHTML =
    '<div class="eyebrow">Nachschlagen</div>' +
    "<h2>Cmdlet-Katalog</h2>" +
    '<div class="lede">' + CMDLET_DB.length + " Cmdlets aus " + module.length +
      " Modulen, so gruppiert, wie <code>Get-Command -Module</code> sie ausgibt. Das ist nicht der vollständige Bestand eines Systems, sondern die Module, die auf jedem Windows vorhanden sind, plus die Verwaltungsmodule für Netzwerk, Speicher und Active Directory.</div>" +
    '<div class="searchbar">' +
      '<input type="search" id="katfeld" placeholder="z. B. firewall, gruppe, partition, session" autocomplete="off" spellcheck="false">' +
    "</div>" +
    '<div class="selwrap"><select id="katmodul"><option value="alle">Alle Module (' + CMDLET_DB.length + ")</option>" +
      module.map(function(m){ return '<option value="' + m.name + '">' + m.name + " (" + m.anzahl + ")</option>"; }).join("") +
    "</select></div>" +
    '<div class="counter" id="katzahl"></div>' +
    '<div id="katliste"></div>';
  main.appendChild(wrap);

  var feld = wrap.querySelector("#katfeld");
  feld.value = state.katSuche;
  feld.addEventListener("input", function(){ state.katSuche = feld.value; katalogTreffer(); });

  var sel = wrap.querySelector("#katmodul");
  sel.value = state.katModul;
  sel.addEventListener("change", function(){ state.katModul = sel.value; katalogTreffer(); });

  katalogTreffer();
}

function katalogTreffer(){
  var liste = document.getElementById("katliste");
  var zahl  = document.getElementById("katzahl");
  if (!liste) { return; }

  var q = state.katSuche.toLowerCase().trim();
  var treffer = CMDLET_DB.filter(function(c){
    if (state.katModul !== "alle" && c[0] !== state.katModul) { return false; }
    if (!q) { return true; }
    return (c[1] + " " + c[2] + " " + c[0]).toLowerCase().indexOf(q) > -1;
  });

  zahl.textContent = treffer.length + " von " + CMDLET_DB.length + " Cmdlets";

  if (!treffer.length) {
    liste.innerHTML = '<div class="card">Kein Treffer. Die Suche greift auf Namen, Beschreibung und Modul zu - ein allgemeinerer Begriff hilft meist.</div>';
    return;
  }

  var html = "", letztes = null;
  treffer.forEach(function(c){
    if (c[0] !== letztes) { html += '<div class="catline">' + c[0] + "</div>"; letztes = c[0]; }
    html += '<div class="cmdlet"><span class="cn">' + esc(c[1]) + '</span><span class="cd">' + esc(c[2]) + "</span></div>";
  });
  liste.innerHTML = html;
}

/* ---- Skript-Generator ---- */
function rezeptFinden(id){
  for (var i = 0; i < REZEPTE.length; i++) { if (REZEPTE[i].id === id) { return REZEPTE[i]; } }
  return REZEPTE[0];
}

function genWert(r, f){
  var w = state.genWerte[r.id] || {};
  return (w[f.k] !== undefined) ? w[f.k] : f.v;
}

function psText(v){ return "'" + String(v).replace(/'/g, "''") + "'"; }

function einruecken(zeilen, praefix){
  // Here-Strings dürfen nicht eingerückt werden: ihr Abschluss "@ muss in Spalte 1 stehen.
  var drin = false;
  return zeilen.map(function(l){
    var roh = l.trim();
    if (drin) {
      if (roh === '"@' || roh === "'@") { drin = false; }
      return l;
    }
    if (/@["']\s*$/.test(l)) { drin = true; return praefix + l; }
    return l ? praefix + l : "";
  });
}

function bausteinFinden(id){
  for (var i = 0; i < BAUSTEINE.length; i++) { if (BAUSTEINE[i].id === id) { return BAUSTEINE[i]; } }
  return null;
}

function baukastenBauen(){
  var felder = [], module = [], admin = false, code = [], schritte = [], belegt = {};
  var tiefe = 0;
  if (!state.genWerte.baukasten) { state.genWerte.baukasten = {}; }

  state.bauListe.forEach(function(eintrag, idx){
    var b = bausteinFinden(eintrag.b);
    if (!b) { return; }

    var namen = {}, werte = {};
    (b.felder || []).forEach(function(f){
      var key = f.k, zaehler = 2;
      while (belegt[key]) { key = f.k + zaehler; zaehler++; }
      belegt[key] = true;

      felder.push({ k:key, l:(idx + 1) + ". " + b.name + " – " + f.l, t:f.t, v:f.v, opt:f.opt });
      namen[f.k] = "$" + key;

      var gesetzt = state.genWerte.baukasten[key];
      werte[f.k] = (gesetzt !== undefined) ? gesetzt : f.v;
    });

    (b.module || []).forEach(function(m){ if (module.indexOf(m) === -1) { module.push(m); } });
    if (b.admin) { admin = true; }

    if (b.aus && tiefe > 0) { tiefe--; }
    var einzug = new Array(tiefe + 1).join("    ");

    if (code.length) { code.push(""); }
    code.push(einzug + "# " + (idx + 1) + ". " + b.name);
    code = code.concat(einruecken(b.code(namen, werte), einzug));
    if (b.ein) { tiefe++; }

    schritte.push([(idx + 1) + ". " + b.name, b.erklaerung]);
  });

  if (!code.length) {
    code = ["Write-Host 'Noch kein Baustein gewählt.' -ForegroundColor Yellow"];
    schritte = [["Noch leer", "Oben einen Baustein hinzufügen. Sinnvoll ist die Reihenfolge Quelle, dann Verarbeitung, dann Ausgabe."]];
  }

  if (tiefe > 0) {
    code.push("");
    code.push("# ACHTUNG: " + tiefe + " Block/Blöcke sind nicht geschlossen - passenden Ende-Baustein ergänzen.");
    schritte.unshift(["Nicht geschlossen", "Es fehlen " + tiefe + " schließende Bausteine. Zu jedem Anfang gehört ein Ende, sonst meldet PowerShell einen Syntaxfehler."]);
  }

  var datei = (state.genMeta.datei || "Mein-Skript.ps1").trim();
  if (!/\.ps1$/i.test(datei)) { datei += ".ps1"; }

  return {
    id: "baukasten",
    name: state.genMeta.synopsis || "Eigenes Skript",
    zweck: state.genMeta.synopsis || "Aus Bausteinen zusammengesetzt.",
    datei: datei,
    module: module,
    admin: admin,
    felder: felder,
    rumpf: function(){ return { code: code, schritte: schritte }; }
  };
}

function baueSkript(){
  var r  = (state.genModus === "bau") ? baukastenBauen() : rezeptFinden(state.genRezept);
  var o  = state.genOpt;
  var z  = [];          // Zeilen
  var bl = [];          // Erklärungsblöcke
  var i;

  if (o.requires) {
    z.push("#Requires -Version 5.1");
    if (r.module.length) { z.push("#Requires -Modules " + r.module.join(", ")); }
    if (r.admin)         { z.push("#Requires -RunAsAdministrator"); }
    z.push("");
    bl.push(["#Requires", "Wird geprüft, bevor die erste Zeile läuft. Fehlt das Modul oder die Erhöhung, bricht PowerShell sofort ab statt mitten in der Arbeit."]);
  }

  if (o.hilfe) {
    z.push("<#");
    z.push(".SYNOPSIS");
    z.push("    " + r.name + ".");
    z.push("");
    z.push(".DESCRIPTION");
    z.push("    " + r.zweck);
    z.push("");
    for (i = 0; i < r.felder.length; i++) {
      z.push(".PARAMETER " + r.felder[i].k);
      z.push("    " + r.felder[i].l + ".");
      z.push("");
    }
    if (o.csv) {
      z.push(".PARAMETER BerichtPfad");
      z.push("    Zieldatei für den CSV-Bericht.");
      z.push("");
    }
    z.push(".EXAMPLE");
    z.push("    .\\" + r.datei + (o.binding ? " -WhatIf" : "") + (o.verbose ? " -Verbose" : ""));
    z.push("");
    z.push("    " + (o.binding ? "Zeigt, was geschehen würde, ohne etwas zu ändern." : "Führt das Skript mit den Standardwerten aus."));
    z.push("");
    z.push(".NOTES");
    if (state.genModus === "bau" && state.genMeta.autor) {
      z.push("    Autor:  " + state.genMeta.autor);
    }
    z.push("    Erstellt mit dem Skript-Generator, Stand " + new Date().toISOString().slice(0, 10) + ".");
    z.push("    Vor dem Einsatz auf einem Produktivsystem in einer Testumgebung prüfen.");
    z.push("#>");
    z.push("");
    bl.push(["Kommentarhilfe", "Dieser Block macht Get-Help auf dem eigenen Skript nutzbar - mit .EXAMPLES, Parameterbeschreibungen und allem, was ein eingebautes Cmdlet auch bietet. Er muss unmittelbar vor param stehen."]);
  }

  if (o.binding) {
    z.push("[CmdletBinding(SupportsShouldProcess)]");
    bl.push(["CmdletBinding", "Schaltet -Verbose, -ErrorAction und über SupportsShouldProcess auch -WhatIf und -Confirm frei. Ohne diese Zeile müsste man die Testlogik von Hand nachbauen."]);
  }

  // param-Block
  z.push("param(");
  var teile = [];
  for (i = 0; i < r.felder.length; i++) {
    var f = r.felder[i];
    if (f.t === "code" || f.t === "mehrzeilig") { continue; }
    var wert = genWert(r, f);
    var zeile = "    # " + f.l + "\n";
    if (f.t === "int") {
      zeile += "    [int]$" + f.k + " = " + (parseInt(wert, 10) || 0);
    } else if (f.t === "switch") {
      zeile += "    [bool]$" + f.k + " = $" + (String(wert) === "true" ? "true" : "false");
    } else if (f.t === "select") {
      zeile += "    [ValidateSet(" + f.opt.map(psText).join(", ") + ")]\n";
      zeile += "    [string]$" + f.k + " = " + psText(wert);
    } else {
      zeile += "    [string]$" + f.k + " = " + psText(wert);
    }
    teile.push(zeile);
  }
  if (o.csv) {
    teile.push("    # Zieldatei für den CSV-Bericht\n    [string]$BerichtPfad = " +
               psText("C:\\Berichte\\" + r.datei.replace(/\.ps1$/, "") + ".csv"));
  }
  z.push(teile.join(",\n"));
  z.push(")");
  z.push("");
  bl.push(["param-Block", "Alle Eingaben stehen an einer Stelle und sind typisiert. Die Werte aus dem Formular sind hier nur Standardwerte - beim Aufruf lassen sie sich überschreiben, ohne das Skript zu ändern."]);

  if (o.strict) {
    z.push("Set-StrictMode -Version Latest");
    z.push("");
    bl.push(["Set-StrictMode", "Ein Tippfehler in einem Variablennamen wird zum Fehler statt zu einem stillen leeren Wert. Das ist die häufigste Ursache für Skripte, die scheinbar durchlaufen und nichts tun."]);
  }

  if (o.fehler) {
    z.push("$ErrorActionPreference = 'Stop'");
    z.push("");
    bl.push(["ErrorActionPreference", "Setzt alle Fehler auf abbrechend. Erst dadurch erreicht der catch-Block die Fehler der aufgerufenen Cmdlets - ohne das läuft ein Skript nach einem Fehler einfach weiter."]);
  }

  if (r.module.length) {
    z.push("Import-Module " + r.module.join(", "));
    z.push("");
  }

  if (o.protokoll) {
    z.push("$protokollDatei = \"C:\\Protokoll\\" + r.datei.replace(/\.ps1$/, "") + "-$(Get-Date -Format yyyyMMdd-HHmm).txt\"");
    z.push("if (-not (Test-Path (Split-Path $protokollDatei))) {");
    z.push("    New-Item (Split-Path $protokollDatei) -ItemType Directory | Out-Null");
    z.push("}");
    z.push("Start-Transcript -Path $protokollDatei | Out-Null");
    z.push("");
    bl.push(["Start-Transcript", "Schneidet Eingaben und Ausgaben vollständig mit. Bei Änderungen an Produktivsystemen ist das der Nachweis, was tatsächlich gemacht wurde."]);
  }

  // Rumpf
  var rumpf = r.rumpf();
  var kern = rumpf.code.slice();

  if (o.csv) {
    kern = ["$ausgabe = & {"]
      .concat(einruecken(kern, "    "))
      .concat([
        "}",
        "",
        "if (-not (Test-Path (Split-Path $BerichtPfad))) {",
        "    New-Item (Split-Path $BerichtPfad) -ItemType Directory | Out-Null",
        "}",
        "",
        "$ausgabe | Export-Csv -Path $BerichtPfad -NoTypeInformation -Delimiter ';' -Encoding UTF8",
        "Write-Verbose \"Bericht geschrieben: $BerichtPfad\"",
        "$ausgabe"
      ]);
    bl.push(["CSV-Bericht", "Die Ausgabe wird in einer Variablen gesammelt, exportiert und danach trotzdem zurückgegeben. Das Semikolon als Trennzeichen und UTF8 sorgen dafür, dass deutsches Excel die Datei samt Umlauten richtig öffnet."]);
  }

  if (o.fehler) {
    z.push("try {");
    z = z.concat(einruecken(kern, "    "));
    z.push("}");
    z.push("catch {");
    z.push("    Write-Error \"Abbruch: $($_.Exception.Message)\"");
    z.push("    Write-Verbose \"Zeile $($_.InvocationInfo.ScriptLineNumber): $($_.InvocationInfo.Line.Trim())\"");
    z.push("    exit 1");
    z.push("}");
    z.push("finally {");
    if (o.protokoll) { z.push("    Stop-Transcript | Out-Null"); }
    z.push("    Write-Verbose 'Durchlauf beendet.'");
    z.push("}");
    z.push("");
    z.push("exit 0");
    bl.push(["try / catch / finally", "catch fängt den Abbruch ab und gibt eine verwertbare Meldung samt Zeilennummer aus. finally läuft immer - auch nach einem Fehler - und ist der richtige Ort zum Aufräumen. Der Rückgabewert über exit macht das Ergebnis für eine Aufgabenplanung auswertbar."]);
  } else {
    z = z.concat(kern);
    if (o.protokoll) { z.push(""); z.push("Stop-Transcript | Out-Null"); }
  }

  for (i = 0; i < rumpf.schritte.length; i++) { bl.push(rumpf.schritte[i]); }

  return { code: z.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n", bloecke: bl, rezept: r };
}

    '<div class="eyebrow">Nachschlagen</div>' +
    "<h2>Skript-Generator</h2>" +
    '<div class="lede">' + REZEPTE.length + " Aufgaben aus " + bereiche.length +
      " Bereichen. Aufgabe wählen, Felder ausfüllen, Gerüst zusammenstellen - heraus kommt ein Skript nach den Vorgaben aus dem Kapitel <em>Skriptaufbau</em>. Jeder Block wird darunter erklärt.</div>" +

    '<div class="gentabs">' +
      '<button class="gentab' + (state.genModus === "rezept" ? " on" : "") + '" data-m="rezept">Fertiges Rezept</button>' +
      '<button class="gentab' + (state.genModus === "bau"    ? " on" : "") + '" data-m="bau">Baukasten</button>' +
    "</div>" +

    '<div class="genstep"><span class="gnum">1</span>Aufgabe</div>' +

    '<div class="selwrap"><select id="genrez">' +
      bereiche.map(function(b){
        return '<optgroup label="' + b + '">' +
          REZEPTE.filter(function(r){ return r.bereich === b; })
                 .map(function(r){ return '<option value="' + r.id + '">' + r.name + "</option>"; }).join("") +
          "</optgroup>";
      }).join("") +
    "</select></div>" +
    '<div class="genzweck" id="genzweck"></div></div>' +

    '<div id="genbau"' + (state.genModus === "bau" ? "" : ' style="display:none"') + '>' +
      '<div class="bauhilfe">Reihenfolge: erst eine <b>Quelle</b>, dann beliebig viele <b>Schritte</b>, am Ende eine <b>Ausgabe</b>. Die Daten wandern von Baustein zu Baustein in der Variablen <code>$daten</code>. Schleifen und Bedingungen brauchen immer ein passendes Ende.</div>' +
      '<div class="genfeld"><label>Dateiname</label><input type="text" id="metaDatei" value="' + esc(state.genMeta.datei) + '"><span class="gvar">.ps1</span></div>' +
      '<div class="genfeld"><label>Kurzbeschreibung</label><input type="text" id="metaZweck" value="' + esc(state.genMeta.synopsis) + '"><span class="gvar">.SYNOPSIS</span></div>' +
      '<div class="genfeld"><label>Autor</label><input type="text" id="metaAutor" value="' + esc(state.genMeta.autor) + '"><span class="gvar">.NOTES</span></div>' +
      '<div class="bauspeicher">' +
        '<select id="bauVorlagen"></select>' +
        '<button class="btn ghost" id="bauLaden">Laden</button>' +
        '<button class="btn ghost" id="bauSpeichern">Speichern</button>' +
        '<button class="btn ghost" id="bauLoeschen">Löschen</button>' +
      "</div>" +
      '<div id="baugewaehlt"></div>' +
      '<div id="baupalette"></div>' +
    "</div>" +

    '<div class="genstep"><span class="gnum">2</span>Werte</div>' +
    '<div id="genfelder"></div>' +

    '<div class="genstep"><span class="gnum">3</span>Gerüst</div>' +
    '<div class="genopts" id="genopts"></div>' +

    '<div class="genstep"><span class="gnum">4</span>Ergebnis</div>' +
    '<div id="genpruefung"></div>' +
    '<div id="genausgabe"></div>' +
    '<div class="genbtns">' +
      '<button class="btn" id="genDownload">Als .ps1 speichern</button>' +
      '<button class="btn ghost" id="genReset">Werte zurücksetzen</button>' +
    "</div>" +
    '<div class="counter" id="genDlHinweis"></div>' +
    '<div class="genstep"><span class="gnum">5</span>Was das Skript tut</div>' +
    '<div id="generklaerung"></div>' +
    '<div class="note warn"><b>Vor dem ersten Einsatz</b>Erzeugte Skripte gehören in eine Testumgebung, nicht direkt auf ein Produktivsystem. Bei allem, was ändert oder löscht, zuerst mit <code>-WhatIf</code> starten.</div>';

  main.appendChild(wrap);

  ["Datei", "Zweck", "Autor"].forEach(function(feld){
    var el = wrap.querySelector("#meta" + feld);
    if (!el) { return; }
    el.addEventListener("input", function(){
      if (feld === "Datei") { state.genMeta.datei = el.value; }
      if (feld === "Zweck") { state.genMeta.synopsis = el.value; }
      if (feld === "Autor") { state.genMeta.autor = el.value; }
      generatorAusgabe();
    });
  });

  if (wrap.querySelector("#bauVorlagen")) {
    vorlagenListe();
    wrap.querySelector("#bauSpeichern").addEventListener("click", vorlageSpeichern);
    wrap.querySelector("#bauLaden").addEventListener("click", vorlageLaden);
    wrap.querySelector("#bauLoeschen").addEventListener("click", vorlageLoeschen);
  }

  Array.prototype.forEach.call(wrap.querySelectorAll("[data-m]"), function(t){
    t.addEventListener("click", function(){
      state.genModus = t.getAttribute("data-m");
      zeige("generator");
    });
  });

  var sel = wrap.querySelector("#genrez");
  sel.value = state.genRezept;
  sel.addEventListener("change", function(){
    state.genRezept = sel.value;
    generatorFelder();
    generatorAusgabe();
  });

  var optlist = [
    ["requires",  "#Requires-Zeilen"],
    ["hilfe",     "Kommentarhilfe"],
    ["binding",   "CmdletBinding + WhatIf"],
    ["strict",    "Set-StrictMode"],
    ["fehler",    "try / catch / finally"],
    ["verbose",   "Verbose-Meldungen"],
    ["protokoll", "Transcript-Protokoll"],
    ["csv",       "CSV-Bericht schreiben"]
  ];
  var ob = wrap.querySelector("#genopts");
  ob.innerHTML = optlist.map(function(o){
    return '<label class="genopt"><input type="checkbox" data-o="' + o[0] + '"' +
           (state.genOpt[o[0]] ? " checked" : "") + "> " + o[1] + "</label>";
  }).join("");
  Array.prototype.forEach.call(ob.querySelectorAll("[data-o]"), function(c){
    c.addEventListener("change", function(){
      state.genOpt[c.getAttribute("data-o")] = c.checked;
      generatorAusgabe();
    });
  });

  wrap.querySelector("#genReset").addEventListener("click", function(){
    if (state.genModus === "bau") { state.genWerte.baukasten = {}; state.bauListe = []; baukastenZeichnen(); }
    else { state.genWerte[state.genRezept] = {}; }
    generatorFelder();
    generatorAusgabe();
  });

  function downloadHinweis(text){
    var el = document.getElementById("genDlHinweis");
    if (el) { el.textContent = text; }
  }

  function downloadLokal(erg){
    try {
      var blob = new Blob(["\ufeff" + erg.code], {type:"text/plain;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = erg.rezept.datei;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      downloadHinweis("Gespeichert als " + erg.rezept.datei + ".");
    } catch(e) {
      downloadHinweis("Der Browser hat das Speichern blockiert – den Text bitte über Kopieren übernehmen.");
    }
  }

  wrap.querySelector("#genDownload").addEventListener("click", function(){
    var erg = baueSkript();
    downloadHinweis("");

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function(dl){
        if (!dl) { downloadLokal(erg); return; }
        dl.save({ filename: erg.rezept.datei + ".txt", data: "\ufeff" + erg.code }).then(function(){
          downloadHinweis("Gespeichert als " + erg.rezept.datei + ".txt – zum Ausführen die Endung .txt entfernen.");
        }, function(fehler){
          if (fehler && fehler.code === "declined") { downloadHinweis("Speichern abgebrochen."); return; }
          downloadLokal(erg);
        });
      }, function(){ downloadLokal(erg); });
    } else {
      downloadLokal(erg);
    }
  });

  if (state.genModus === "bau") { baukastenZeichnen(); }
  generatorFelder();
  generatorAusgabe();
}

var BAU_GRUPPEN = [
  ["quelle",  "Quelle – woher die Daten kommen"],
  ["struktur","Struktur – Schleifen, Bedingungen, eigener Code"],
  ["schritt", "Verarbeitung – filtern, sortieren, auswerten"],
  ["aktion",  "Aktion – etwas tun oder prüfen"],
  ["ausgabe", "Ausgabe – wohin das Ergebnis geht"]
];

function vorlagenLesen(){
  try { return JSON.parse(localStorage.getItem("kv-baukasten") || "{}"); } catch(e) { return {}; }
}
function vorlagenSchreiben(v){
  try { localStorage.setItem("kv-baukasten", JSON.stringify(v)); } catch(e) {}
}
function vorlagenListe(){
  var sel = document.getElementById("bauVorlagen");
  if (!sel) { return; }
  var v = vorlagenLesen();

function klammernPruefen(code){
  var zeilen = code.split("\n");
  var stand = { "(": 0, "{": 0, "[": 0 };
  var paare = { ")": "(", "}": "{", "]": "[" };
  var inHere = false, i, j;

  for (i = 0; i < zeilen.length; i++) {
    var z = zeilen[i], roh = z.trim();

    if (inHere) { if (roh === '"@' || roh === "'@") { inHere = false; } continue; }
    if (/@["']\s*$/.test(z)) { inHere = true; continue; }
    if (roh.charAt(0) === "#") { continue; }

    var einfach = false, doppelt = false;
    for (j = 0; j < z.length; j++) {
      var c = z.charAt(j);
      if (c === "`") { j++; continue; }
      if (!doppelt && c === "'") { einfach = !einfach; continue; }
      if (!einfach && c === '"') { doppelt = !doppelt; continue; }
      if (einfach || doppelt) { continue; }
      if (c === "#") { break; }
      if (stand[c] !== undefined) { stand[c]++; }
      else if (paare[c]) { stand[paare[c]]--; }
    }
  }
  return stand;
}

function baukastenPruefen(){
  var befunde = [];
  var liste = state.bauListe.map(function(e){ return bausteinFinden(e.b); }).filter(Boolean);

  function melde(stufe, text){ befunde.push({ s: stufe, t: text }); }

  if (!liste.length) { return befunde; }

  var typen   = liste.map(function(b){ return b.typ; });
  var quellen = typen.filter(function(t){ return t === "quelle"; }).length;

  /* 1. Aufbau */
  if (!quellen) {
    melde("fehler", "Es fehlt eine Quelle. Ohne sie ist $daten leer und alle folgenden Bausteine laufen ins Nichts.");
  }
  if (quellen > 1) {
    melde("warnung", quellen + " Quellen gewählt. Jede überschreibt $daten vollständig - nur die letzte wirkt sich aus.");
  }
  var ersteQuelle = typen.indexOf("quelle");
  if (ersteQuelle > 0) {
    var davor = typen.slice(0, ersteQuelle).filter(function(t){ return t === "schritt" || t === "aktion" || t === "ausgabe"; }).length;
    if (davor) { melde("fehler", "Die Quelle steht erst an Position " + (ersteQuelle + 1) + ". Bausteine davor arbeiten mit leeren Daten."); }
  }
  if (typen.indexOf("ausgabe") === -1 && typen.indexOf("aktion") === -1) {
    melde("warnung", "Weder Ausgabe noch Aktion gewählt. Das Skript sammelt Daten, tut damit aber nichts.");
  }
  var letzteAusgabe = typen.lastIndexOf("ausgabe");
  if (letzteAusgabe > -1 && letzteAusgabe < typen.length - 1) {
    var danach = typen.slice(letzteAusgabe + 1).filter(function(t){ return t === "schritt" || t === "quelle"; }).length;
    if (danach) { melde("warnung", "Nach der Ausgabe folgen noch Verarbeitungsschritte. Ausgegeben wird der Stand von vorher."); }
  }

  /* 2. Struktur */
  var tiefe = 0, zuviel = 0;
  liste.forEach(function(b){
    if (b.aus) { if (tiefe === 0) { zuviel++; } else { tiefe--; } }
    if (b.ein) { tiefe++; }
  });
  if (tiefe > 0) { melde("fehler", tiefe + " Block/Blöcke sind nicht geschlossen. Zu jedem Anfang gehört der passende Ende-Baustein."); }
  if (zuviel > 0) { melde("fehler", zuviel + " Ende-Baustein/e ohne zugehörigen Anfang. PowerShell meldet dazu eine unerwartete schließende Klammer."); }

  /* 3. Reihenfolge innerhalb der Pipeline */
  var idxFormat = -1, idxExport = -1;
  liste.forEach(function(b, i){
    if (b.id === "o-tabelle" || b.id === "o-datei") { if (idxFormat === -1) { idxFormat = i; } }
    if (b.id === "o-csv" || b.id === "o-html") { if (idxExport === -1) { idxExport = i; } }
  });
  if (idxFormat > -1 && idxExport > idxFormat) {
    melde("fehler", "Eine Tabellenausgabe steht vor einem Export. Format-Cmdlets zerstören die Objektstruktur - der Export danach enthält unbrauchbare Zeilen.");
  }

  var idxMessen = -1;
  liste.forEach(function(b, i){ if (b.id === "s-rechnen" && idxMessen === -1) { idxMessen = i; } });
  if (idxMessen > -1) {
    var nachMessen = liste.slice(idxMessen + 1).filter(function(b){
      return ["s-filter", "s-sortieren", "s-spalten", "s-gruppieren", "s-erste"].indexOf(b.id) > -1;
    }).length;
    if (nachMessen) { melde("warnung", "Nach \"Summe und Durchschnitt\" enthält $daten nur noch ein Ergebnisobjekt. Die folgenden Schritte greifen ins Leere."); }
  }

  var idxErste = -1, idxSort = -1;
  liste.forEach(function(b, i){
    if (b.id === "s-erste" && idxErste === -1) { idxErste = i; }
    if (b.id === "s-sortieren" && idxSort === -1) { idxSort = i; }
  });
  if (idxErste > -1 && idxSort > idxErste) {
    melde("warnung", "Begrenzen steht vor dem Sortieren. Dann werden zufällige Objekte behalten und erst danach sortiert - meist ist es umgekehrt gemeint.");
  }

  /* 4. Abhängigkeiten zum Gerüst */
  var brauchtShouldProcess = liste.some(function(b){ return b.id === "a-jedes"; });
  if (brauchtShouldProcess && !state.genOpt.binding) {
    melde("fehler", "Der Baustein \"Für jedes Objekt etwas tun\" ruft $PSCmdlet.ShouldProcess auf. Dafür muss unter Gerüst \"CmdletBinding + WhatIf\" angehakt sein.");
  }
  var adDrin = liste.some(function(b){ return (b.module || []).indexOf("ActiveDirectory") > -1; });
  if (adDrin && !state.genOpt.requires) {
    melde("tipp", "Es werden AD-Cmdlets verwendet. Mit angehaktem \"#Requires\" bricht das Skript sofort ab, wenn RSAT auf dem Rechner fehlt.");
  }
  var adminDrin = liste.some(function(b){ return b.admin; });
  if (adminDrin && !state.genOpt.requires) {
    melde("tipp", "Mindestens ein Baustein braucht Administratorrechte. Mit \"#Requires\" wird das vor dem ersten Befehl geprüft.");
  }

  /* 5. $objekt nur innerhalb einer Schleife */
  var offen = 0;
  liste.forEach(function(b, i){
    if (b.aus && offen > 0) { offen--; }
    if (!b.ein && offen === 0 && b.id !== "a-jedes") {
      var werte = state.genWerte.baukasten || {};
      var nutztObjekt = (b.felder || []).some(function(f){
        var w = werte[f.k] !== undefined ? werte[f.k] : f.v;
        return (f.t === "code" || f.t === "mehrzeilig") && String(w).indexOf("$objekt") > -1;
      });
      if (nutztObjekt) {
        melde("warnung", "Baustein " + (i + 1) + " verwendet $objekt, steht aber außerhalb einer Schleife. Dort ist die Variable leer.");
      }
    }
    if (b.ein) { offen++; }
  });

  /* 6. Klammernbilanz im fertigen Code */
  var stand = klammernPruefen(baueSkript().code);
  ["(", "{", "["].forEach(function(k){
    var zu = { "(": ")", "{": "}", "[": "]" }[k];
    if (stand[k] > 0) { melde("fehler", stand[k] + "-mal " + k + " ohne passendes " + zu + " im erzeugten Code."); }
    if (stand[k] < 0) { melde("fehler", (-stand[k]) + "-mal " + zu + " ohne passendes " + k + " im erzeugten Code."); }
  });

  return befunde;
}

function pruefungZeichnen(){
  var ziel = document.getElementById("genpruefung");
  if (!ziel) { return; }

  if (state.genModus !== "bau") { ziel.innerHTML = ""; return; }

  var b = baukastenPruefen();
  if (!state.bauListe.length) { ziel.innerHTML = ""; return; }

  var fehler   = b.filter(function(x){ return x.s === "fehler"; }).length;
  var warnung  = b.filter(function(x){ return x.s === "warnung"; }).length;

  var tipps = b.filter(function(x){ return x.s === "tipp"; }).length;
  var kopf  = fehler ? "fehler" : (warnung ? "warnung" : "ok");

  var teile = [];
  if (fehler)  { teile.push(fehler + (fehler === 1 ? " Fehler" : " Fehler")); }
  if (warnung) { teile.push(warnung + (warnung === 1 ? " Hinweis" : " Hinweise")); }
  if (tipps)   { teile.push(tipps + (tipps === 1 ? " Tipp" : " Tipps")); }

  var text = teile.length ? teile.join(", ") : "Aufbau schlüssig – keine Auffälligkeiten";

  ziel.innerHTML =
    '<div class="pruefkopf p-' + kopf + '">' + text + "</div>" +
    (b.length ? b.map(function(x){
      return '<div class="pruefzeile p-' + x.s + '"><span>' +
             (x.s === "fehler" ? "Fehler" : x.s === "warnung" ? "Hinweis" : "Tipp") +
             "</span>" + esc(x.t) + "</div>";
    }).join("") : "") +
    '<div class="pruefnote">Das ist eine Plausibilitätsprüfung im Browser, kein PowerShell-Durchlauf. Der echte Test läuft auf dem Zielsystem:' +
    '<code>$f=[ref]$null; [System.Management.Automation.Language.Parser]::ParseFile(&quot;.\\skript.ps1&quot;,[ref]$null,$f); $f.Value</code>' +
    ' prüft die Syntax, <code>Invoke-ScriptAnalyzer -Path .\\skript.ps1</code> den Stil.</div>';
}

function generatorFelder(){
  var r  = (state.genModus === "bau") ? baukastenBauen() : rezeptFinden(state.genRezept);
  var bx = document.getElementById("genfelder");
  var zw = document.getElementById("genzweck");
  if (zw) { zw.textContent = r.zweck; }
  if (!state.genWerte[r.id]) { state.genWerte[r.id] = {}; }
  if (!r.felder.length) {
    bx.innerHTML = '<div class="bauleer">Die gewählten Bausteine brauchen keine Eingaben.</div>';
    return;
  }

  bx.innerHTML = r.felder.map(function(f){
    var w = genWert(r, f);
    var eingabe;
    if (f.t === "switch") {
      eingabe = '<label class="genschalter"><input type="checkbox" data-f="' + f.k + '"' +
                (String(w) === "true" ? " checked" : "") + "> " + f.l + "</label>";
      return '<div class="genfeld schalter">' + eingabe + "</div>";
    }
    if (f.t === "mehrzeilig") {
      return '<div class="genfeld lang"><label>' + f.l + "</label>" +
             '<textarea data-f="' + f.k + '" rows="5" spellcheck="false">' + esc(w) + "</textarea></div>";
    }
    if (f.t === "select") {
      eingabe = '<select data-f="' + f.k + '">' + f.opt.map(function(o){
        return '<option value="' + o + '"' + (o === w ? " selected" : "") + ">" + o + "</option>";
      }).join("") + "</select>";
    } else {
      eingabe = '<input type="' + (f.t === "int" ? "number" : "text") + '" data-f="' + f.k +
                '" value="' + String(w).replace(/"/g, "&quot;") + '" spellcheck="false">';
    }
    return '<div class="genfeld"><label>' + f.l + "</label>" + eingabe +
           '<span class="gvar">$' + f.k + "</span></div>";
  }).join("");

  Array.prototype.forEach.call(bx.querySelectorAll("[data-f]"), function(el){
    var ereignis = (el.type === "checkbox" || el.tagName === "SELECT") ? "change" : "input";
    if (el.tagName === "TEXTAREA") { ereignis = "input"; }
    el.addEventListener(ereignis, function(){
      state.genWerte[r.id][el.getAttribute("data-f")] =
        (el.type === "checkbox") ? String(el.checked) : el.value;
      generatorAusgabe();
    });
  });
}

/* ---- Wissenstest ---- */
function mischen(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---- PWA: Symbol und Manifest ---- */
(function pwa(){
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
    '<rect width="512" height="512" rx="104" fill="#06121a"/>' +
    '<rect x="52" y="52" width="408" height="408" rx="72" fill="none" stroke="#164254" stroke-width="10"/>' +
    '<path d="M150 196 L226 256 L150 316" fill="none" stroke="#2dd4bf" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<rect x="258" y="300" width="116" height="26" rx="13" fill="#6ea8fe"/>' +
    "</svg>";
  var icon = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));

  var apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon;
  document.head.appendChild(apple);

  var fav = document.createElement("link");
  fav.rel = "icon";
  fav.type = "image/svg+xml";
  fav.href = icon;
  document.head.appendChild(fav);

  try {
    var manifest = {
      name: "Konsole & Verzeichnis",
      short_name: "Konsole",
      start_url: ".",
      display: "standalone",
      background_color: "#06121a",
      theme_color: "#06121a",
      description: "Lern-App für Windows CMD, PowerShell und Active Directory",
      icons: [
        { src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
        { src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    var m = document.createElement("link");
    m.rel = "manifest";
    m.href = URL.createObjectURL(blob);
    document.head.appendChild(m);
  } catch(e) {}

  var meta = document.createElement("meta");
  meta.name = "apple-mobile-web-app-capable";
  meta.content = "yes";
  document.head.appendChild(meta);
})();
